e.includes(t.answers[0]),a)}else r$("fill"===t.type&&void 0===t.options,a)}}return e}(((u=rH=JSON.parse('{"topics":[{"language":"en","id":"past-modal-deduction","title":"用情態動詞推斷過去","explanation":["CEFR B2 ｜ 使用頻率：高","門鎖著、燈也熄了。你現在看到這些線索，想推測剛才發生了什麼，可以用「情態動詞 + have + 過去分詞」。have 保持原形，事情的先後由過去分詞表達。","線索讓你相當肯定時用 must have；有這種可能、但另有解釋時用 might have、may have 或 could have；線索幾乎排除某種可能時用 can\'t have 或 couldn\'t have。","常見誤用：She must has left.　修正：She must have left.　must 後的 have 保留原形。"],"examples":[{"text":"The pavement is soaked. It must have rained overnight.","zh":"路面濕透了，昨晚想必下過雨。"},{"text":"Mina might have taken an earlier train.","zh":"米娜可能搭了更早的一班火車。"},{"text":"Leo can\'t have signed the receipt in person. He was abroad.","zh":"里歐不可能親自簽過收據，他當時人在國外。"}],"questions":[{"id":"strong-evidence","type":"choice","prompt":"烤盤還燙手，整間屋子都是麵包香。哪一句表示你相當肯定有人剛烤過麵包？","options":["Someone might bake bread tomorrow.","Someone must have baked bread.","Someone should bake bread."],"answers":["Someone must have baked bread."],"explanation":"你由眼前的熱度與香氣推測剛才的動作。must 表示把握高，have baked 把烘烤放在過去。"},{"id":"open-possibility","type":"fill","prompt":"Sam 沒接電話，也許他睡著了。請用 might 和 fall 填入整段動詞：Sam ___ asleep.","answers":["might have fallen"],"explanation":"你還不知道原因，因此用 might。fall 的過去分詞是 fallen，完整組合是 might have fallen asleep。"},{"id":"rule-it-out","type":"choice","prompt":"門禁紀錄證實 Aya 徹夜在外地。哪一句最能排除她昨晚進過辦公室的可能？","options":["Aya may have entered the office.","Aya didn\'t have to enter the office.","Aya can\'t have entered the office."],"answers":["Aya can\'t have entered the office."],"explanation":"can\'t have entered 表示證據與「她進過辦公室」相矛盾。didn\'t have to 只說沒有必要，無法據此推斷她有沒有進去。"},{"id":"evidence-strength","type":"choice","prompt":"你只知道地毯濕了，想提出可能原因。","options":["Water must be coming through the roof right now.","Water might have come through the roof."],"answers":["Water might have come through the roof."],"explanation":"might have come 指過去可能滲入；must be coming 強烈推定此刻還在漏。"}]},{"language":"fr","id":"polite-conditional-requests","title":"用條件式緩和請求","explanation":["CEFR B1 ｜ 使用頻率：高","在櫃檯請人幫忙時，直說 Je veux… 容易聽成要求。用條件式現在時 Je voudrais… 表達「我想要……」，讓對方有回應的餘地。這種用法不需要 si 子句。","請對方做事時，可以用 Pourriez-vous + 原形動詞。對熟人用 tu，就改成 Pourrais-tu。若問自己可不可以做某件事，用 Est-ce que je pourrais + 原形動詞。","常見誤用：Pourriez-vous vérifiez mon dossier ?　修正：Pourriez-vous vérifier mon dossier ?　pouvoir 變位後接原形動詞。"],"examples":[{"text":"Je voudrais une table pour deux, s\'il vous plaît.","zh":"我想要一張兩人桌，麻煩您。"},{"text":"Pourriez-vous répéter le numéro, s\'il vous plaît ?","zh":"您可以再說一次號碼嗎？"},{"text":"Est-ce que je pourrais laisser mon sac ici ?","zh":"請問我可以把包包放在這裡嗎？"}],"questions":[{"id":"at-the-counter","type":"choice","prompt":"第一次到旅館櫃檯，想請接待人員印出帳單。哪一句用條件式提出請求？","options":["Vous imprimez la facture.","Vous avez imprimé la facture ?","Pourriez-vous imprimer la facture ?"],"answers":["Pourriez-vous imprimer la facture ?"],"explanation":"Pourriez 是 pouvoir 搭配 vous 的條件式，後面接原形 imprimer。另兩句分別陳述現在的動作及詢問已發生的事。"},{"id":"order-politely","type":"fill","prompt":"在咖啡店點餐。請把 vouloir 改成條件式：Je ___ un café, s\'il vous plaît.","answers":["voudrais"],"explanation":"vouloir 的條件式詞幹是 voudr-，je 的字尾為 -ais，合起來就是 voudrais。"},{"id":"ask-a-friend","type":"fill","prompt":"向熟悉的朋友借筆，保留 tu：___-tu me prêter un stylo ? 請填入 pouvoir 的條件式。","answers":["Pourrais"],"explanation":"tu 對應 pourrais。改用倒裝問句時寫作 Pourrais-tu；若稱呼對方為 vous，才用 Pourriez-vous。"},{"id":"request-update","type":"choice","prompt":"你想請承辦人告訴你案件進度。","options":["Pourriez-vous me dire où en est mon dossier ?","Je pourrais vous dire où en est mon dossier."],"answers":["Pourriez-vous me dire où en est mon dossier ?"],"explanation":"Pourriez-vous 將告知進度的動作交給對方；je pourrais 則由我提供消息。"}]},{"language":"en","id":"be-identity","title":"be 動詞與身分介紹","explanation":["CEFR A1 ｜ 使用頻率：高","介紹身分、所在地或狀態時，用主詞加 am、is 或 are。I 配 am，he、she、it 或單數名詞配 is，you、we、they 或複數名詞配 are。問句把 be 移到主詞前面。","說「我今年 23 歲」用 I am 23。英文用 be 表達年齡。","常見誤用：I are on the waiting list.　修正：I am on the waiting list."],"examples":[{"text":"I am from Taiwan. Are you on the same course?","zh":"我來自台灣。你也修這門課嗎？"},{"text":"Are you a student here?","zh":"你是這裡的學生嗎？"},{"text":"I am on the waiting list.","zh":"我在候補名單上。"}],"questions":[{"id":"context-1","type":"choice","prompt":"My flatmate ___ a student in Paris.","options":["am","is","are"],"answers":["is"],"explanation":"My flatmate 是單數第三人稱，配 is。"},{"id":"context-2","type":"choice","prompt":"___ your classmates from Edinburgh?","options":["Is","Am","Are"],"answers":["Are"],"explanation":"classmates 是複數，問句以 Are 開頭。"},{"id":"complete-form","type":"fill","prompt":"我在候補名單上。 依語境填入 am 或 are。\\nI ___ on the waiting list.","answers":["am"],"explanation":"介紹身分、所在地或狀態時，用主詞加 am、is 或 are。I 配 am，he、she、it 或單數名詞配 is，you、we、they 或複數名詞配 are。問句把 be 移到主詞前面。 此句應寫成「I am on the waiting list.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n你是這裡的學生嗎？\\nstudent ｜ you ｜ here? ｜ Are ｜ a","answers":["Are you a student here?","Are you a student here"],"explanation":"介紹身分、所在地或狀態時，用主詞加 am、is 或 are。I 配 am，he、she、it 或單數名詞配 is，you、we、they 或複數名詞配 are。問句把 be 移到主詞前面。 在這個語境中，完整語序為「Are you a student here?」。"}]},{"language":"en","id":"present-habits","title":"現在簡單式與日常習慣","explanation":["CEFR A1 ｜ 使用頻率：高","描述習慣、固定作息或一般事實時，用現在簡單式。肯定句中，第三人稱單數的動詞加 -s 或 -es。疑問句以 do 或 does 開頭，後面的主要動詞用原形。","英式英文將動詞拼作 practise，名詞則是 practice。","常見誤用：Our tutor teach on Fridays.　修正：Our tutor teaches on Fridays."],"examples":[{"text":"She studies French on Mondays. Does she practise at home?","zh":"她每週一學法文。她會在家練習嗎？"},{"text":"Does she take the train?","zh":"她平常搭火車嗎？"},{"text":"Our tutor teaches on Fridays.","zh":"我們的導師每週五授課。"}],"questions":[{"id":"context-1","type":"choice","prompt":"Our seminar usually ___ at nine.","options":["start","starting","starts"],"answers":["starts"],"explanation":"主詞 our seminar 是第三人稱單數，start 加 -s。"},{"id":"context-2","type":"choice","prompt":"Does your flatmate ___ the bus to campus?","options":["take","takes","taking"],"answers":["take"],"explanation":"does 已標示第三人稱單數，後接原形 take。"},{"id":"complete-form","type":"fill","prompt":"我們的導師每週五授課。 依語境填入 teaches 或 teach。\\nOur tutor ___ on Fridays.","answers":["teaches"],"explanation":"描述習慣、固定作息或一般事實時，用現在簡單式。肯定句中，第三人稱單數的動詞加 -s 或 -es。疑問句以 do 或 does 開頭，後面的主要動詞用原形。 此句應寫成「Our tutor teaches on Fridays.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n她平常搭火車嗎？\\ntrain? ｜ she ｜ Does ｜ take ｜ the","answers":["Does she take the train?","Does she take the train"],"explanation":"描述習慣、固定作息或一般事實時，用現在簡單式。肯定句中，第三人稱單數的動詞加 -s 或 -es。疑問句以 do 或 does 開頭，後面的主要動詞用原形。 在這個語境中，完整語序為「Does she take the train?」。"}]},{"language":"en","id":"english-articles","title":"a、an 與 the","explanation":["CEFR A1 ｜ 使用頻率：高","第一次提到某個單數可數物品，通常用 a 或 an。接子音音素用 a，接母音音素用 an。雙方都知道是哪一個，或前文已提過它時，用 the。","university 開頭讀 /j/，所以是 a university。hour 開頭的 h 不發音，所以是 an hour。","常見誤用：Could I have a envelope?　修正：Could I have an envelope?"],"examples":[{"text":"I found a café near campus. The café serves an excellent hot chocolate.","zh":"我在校園附近找到一家咖啡館。那家店的熱巧克力非常好喝。"},{"text":"I need an umbrella.","zh":"我需要一把雨傘。"},{"text":"Could I have an envelope?","zh":"可以給我一個信封嗎？"}],"questions":[{"id":"context-1","type":"choice","prompt":"The journey takes ___ hour.","options":["a","an","many"],"answers":["an"],"explanation":"hour 的第一個音是母音，只需一小時用 an hour。"},{"id":"context-2","type":"choice","prompt":"I bought a notebook yesterday. ___ notebook is already full.","options":["An","Some","The"],"answers":["The"],"explanation":"第二句指昨天買的那本，因此用 the。"},{"id":"complete-form","type":"fill","prompt":"可以給我一個信封嗎？ 依語境填入 an 或 a。\\nCould I have ___ envelope?","answers":["an"],"explanation":"第一次提到某個單數可數物品，通常用 a 或 an。接子音音素用 a，接母音音素用 an。雙方都知道是哪一個，或前文已提過它時，用 the。 此句應寫成「Could I have an envelope?」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我需要一把雨傘。\\nneed ｜ I ｜ an ｜ umbrella.","answers":["I need an umbrella.","I need an umbrella"],"explanation":"第一次提到某個單數可數物品，通常用 a 或 an。接子音音素用 a，接母音音素用 an。雙方都知道是哪一個，或前文已提過它時，用 the。 在這個語境中，完整語序為「I need an umbrella.」。"}]},{"language":"en","id":"simple-past","title":"過去簡單式與已結束的時間","explanation":["CEFR A2 ｜ 使用頻率：高","事件發生在已經結束的時段時，用過去簡單式，例如 yesterday 或 last term。規則動詞多加 -ed，不規則動詞有特定過去式。一般動詞的否定和疑問句用 did 加原形。","buy 的過去式是 bought。若句中已經有 did，就要回到 buy。","常見誤用：Did you kept the receipt?　修正：Did you keep the receipt?"],"examples":[{"text":"We took the RER yesterday. Did you take it too?","zh":"我們昨天搭了巴黎區域快鐵。你也搭了嗎？"},{"text":"Did you enjoy the concert?","zh":"你喜歡那場音樂會嗎？"},{"text":"Did you keep the receipt?","zh":"你有留著收據嗎？"}],"questions":[{"id":"context-1","type":"choice","prompt":"Last winter we ___ music in Vienna.","options":["hear","have heard","heard"],"answers":["heard"],"explanation":"last winter 是已結束的過去時段，hear 的過去式是 heard。"},{"id":"context-2","type":"choice","prompt":"I didn’t ___ the final train.","options":["catch","caught","catching"],"answers":["catch"],"explanation":"didn’t 已標示過去，後面接 catch。"},{"id":"complete-form","type":"fill","prompt":"你有留著收據嗎？ 依語境填入 keep 或 kept。\\nDid you ___ the receipt?","answers":["keep"],"explanation":"事件發生在已經結束的時段時，用過去簡單式，例如 yesterday 或 last term。規則動詞多加 -ed，不規則動詞有特定過去式。一般動詞的否定和疑問句用 did 加原形。 此句應寫成「Did you keep the receipt?」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n你喜歡那場音樂會嗎？\\nenjoy ｜ the ｜ Did ｜ you ｜ concert?","answers":["Did you enjoy the concert?","Did you enjoy the concert"],"explanation":"事件發生在已經結束的時段時，用過去簡單式，例如 yesterday 或 last term。規則動詞多加 -ed，不規則動詞有特定過去式。一般動詞的否定和疑問句用 did 加原形。 在這個語境中，完整語序為「Did you enjoy the concert?」。"}]},{"language":"en","id":"comparatives","title":"比較級與 than","explanation":["CEFR A2 ｜ 使用頻率：高","比較兩個事物時，短形容詞常加 -er，較長的形容詞通常用 more。要說明比較對象時用 than。good 和 bad 的比較級分別是 better 和 worse。","cheaper 已經是比較級。想表示便宜「很多」可以寫 much cheaper。","常見誤用：The bus is slowest than the train.　修正：The bus is slower than the train."],"examples":[{"text":"This flat is cheaper than mine, but the journey is more expensive.","zh":"這間公寓比我的便宜，不過通勤費比較高。"},{"text":"This route is quicker than ours.","zh":"這條路線比我們那條快。"},{"text":"The bus is slower than the train.","zh":"公車比火車慢。"}],"questions":[{"id":"context-1","type":"choice","prompt":"The direct route is ___ than the one via Versailles.","options":["shortest","shorter","more shorter"],"answers":["shorter"],"explanation":"兩條路線互相比較，short 用 shorter。"},{"id":"context-2","type":"choice","prompt":"This classroom has ___ acoustics than the café.","options":["best","gooder","better"],"answers":["better"],"explanation":"good 的不規則比較級是 better。"},{"id":"complete-form","type":"fill","prompt":"公車比火車慢。 依語境填入 slower 或 slowest。\\nThe bus is ___ than the train.","answers":["slower"],"explanation":"比較兩個事物時，短形容詞常加 -er，較長的形容詞通常用 more。要說明比較對象時用 than。good 和 bad 的比較級分別是 better 和 worse。 此句應寫成「The bus is slower than the train.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n這條路線比我們那條快。\\nthan ｜ This ｜ quicker ｜ ours. ｜ is ｜ route","answers":["This route is quicker than ours.","This route is quicker than ours"],"explanation":"比較兩個事物時，短形容詞常加 -er，較長的形容詞通常用 more。要說明比較對象時用 than。good 和 bad 的比較級分別是 better 和 worse。 在這個語境中，完整語序為「This route is quicker than ours.」。"}]},{"language":"en","id":"countability","title":"可數、不可數與數量詞","explanation":["CEFR A2 ｜ 使用頻率：高","many 和 how many 接可數名詞複數，例如 tickets。much 和 how much 接不可數名詞，例如 time。想數不可數的物品或資訊時，可加入單位，例如 two pieces of advice。","advice、information 和 luggage 通常當作不可數名詞。說一項建議用 a piece of advice。","常見誤用：We haven\'t got many time.　修正：We haven\'t got much time."],"examples":[{"text":"How many tickets do we need? How much luggage can we take?","zh":"我們需要幾張票？可以帶多少行李？"},{"text":"How many places are available?","zh":"有多少名額？"},{"text":"We haven\'t got much time.","zh":"我們沒多少時間。"}],"questions":[{"id":"context-1","type":"choice","prompt":"How ___ information do we have about the placement?","options":["many","much","few"],"answers":["much"],"explanation":"information 是不可數名詞，問數量用 how much。"},{"id":"context-2","type":"choice","prompt":"The careers adviser gave me two ___ advice.","options":["advices of","piece of","pieces of"],"answers":["pieces of"],"explanation":"用 pieces 計算建議的數量，two 後面要用複數。"},{"id":"complete-form","type":"fill","prompt":"我們沒多少時間。 依語境填入 much 或 many。\\nWe haven\'t got ___ time.","answers":["much"],"explanation":"many 和 how many 接可數名詞複數，例如 tickets。much 和 how much 接不可數名詞，例如 time。想數不可數的物品或資訊時，可加入單位，例如 two pieces of advice。 此句應寫成「We haven\'t got much time.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n有多少名額？\\nHow ｜ available? ｜ are ｜ many ｜ places","answers":["How many places are available?","How many places are available"],"explanation":"many 和 how many 接可數名詞複數，例如 tickets。much 和 how much 接不可數名詞，例如 time。想數不可數的物品或資訊時，可加入單位，例如 two pieces of advice。 在這個語境中，完整語序為「How many places are available?」。"}]},{"language":"en","id":"since-for","title":"現在完成式與持續時間","explanation":["CEFR B1 ｜ 使用頻率：高","用 have 或 has 加過去分詞，將過去的事件連到現在。狀態從過去持續到現在時，since 接起點，for 接時長。若要交代發生於哪個已結束的時段，通常改用過去簡單式。","for three months 是「長達三個月」，since March 是「從三月起」。","常見誤用：I\'ve known Léa for September.　修正：I\'ve known Léa since September."],"examples":[{"text":"I have known my tutor since September. We first met at orientation.","zh":"我從九月就認識我的導師。我們是在迎新活動初次見面的。"},{"text":"We have worked together for months.","zh":"我們已經一起工作好幾個月了。"},{"text":"I\'ve known Léa since September.","zh":"我從九月就認識蕾雅了。"}],"questions":[{"id":"context-1","type":"choice","prompt":"I have lived in Paris ___ the start of term.","options":["for","since","during"],"answers":["since"],"explanation":"the start of term 指明起點，因此用 since。"},{"id":"context-2","type":"choice","prompt":"We ___ our first rehearsal last Friday.","options":["have had","have","had"],"answers":["had"],"explanation":"last Friday 已經結束，具體敘述當天事件用過去簡單式。"},{"id":"complete-form","type":"fill","prompt":"我從九月就認識蕾雅了。 依語境填入 since 或 for。\\nI\'ve known Léa ___ September.","answers":["since"],"explanation":"用 have 或 has 加過去分詞，將過去的事件連到現在。狀態從過去持續到現在時，since 接起點，for 接時長。若要交代發生於哪個已結束的時段，通常改用過去簡單式。 此句應寫成「I\'ve known Léa since September.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我們已經一起工作好幾個月了。\\nhave ｜ months. ｜ We ｜ together ｜ for ｜ worked","answers":["We have worked together for months.","We have worked together for months"],"explanation":"用 have 或 has 加過去分詞，將過去的事件連到現在。狀態從過去持續到現在時，since 接起點，for 接時長。若要交代發生於哪個已結束的時段，通常改用過去簡單式。 在這個語境中，完整語序為「We have worked together for months.」。"}]},{"language":"en","id":"first-conditional","title":"第一條件句與未來計畫","explanation":["CEFR B1 ｜ 使用頻率：高","談可能實現的未來條件，用 if 加現在簡單式，主要子句可以用 will 加原形動詞預測結果。if 子句放前面時，通常用逗號將兩個子句隔開。","結果也能用命令句，例如 If you find a seat, text me.（如果你找到座位，就傳訊息給我。）","常見誤用：If the price will falls, we\'ll book.　修正：If the price falls, we\'ll book."],"examples":[{"text":"If the library closes early, we’ll finish the case at my flat.","zh":"如果圖書館提早關門，我們就到我家完成個案。"},{"text":"If it rains, we’ll stay inside.","zh":"如果下雨，我們就待在室內。"},{"text":"If the price falls, we\'ll book.","zh":"價格若降，我們就預訂。"}],"questions":[{"id":"context-1","type":"choice","prompt":"If the café ___ early tomorrow, we’ll meet there.","options":["opens","will open","opening"],"answers":["opens"],"explanation":"表示未來條件的 if 子句用現在簡單式，café 配 opens。"},{"id":"context-2","type":"choice","prompt":"If I finish by six, I ___ you at the station.","options":["met","have met yesterday","will meet"],"answers":["will meet"],"explanation":"主句描述條件成立後的未來行動，用 will meet。"},{"id":"complete-form","type":"fill","prompt":"價格若降，我們就預訂。 依語境填入 falls 或 will falls。\\nIf the price ___, we\'ll book.","answers":["falls"],"explanation":"談可能實現的未來條件，用 if 加現在簡單式，主要子句可以用 will 加原形動詞預測結果。if 子句放前面時，通常用逗號將兩個子句隔開。 此句應寫成「If the price falls, we\'ll book.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n如果下雨，我們就待在室內。\\nstay ｜ it ｜ If ｜ inside. ｜ rains, ｜ we’ll","answers":["If it rains, we’ll stay inside.","If it rains, we’ll stay inside"],"explanation":"談可能實現的未來條件，用 if 加現在簡單式，主要子句可以用 will 加原形動詞預測結果。if 子句放前面時，通常用逗號將兩個子句隔開。 在這個語境中，完整語序為「If it rains, we’ll stay inside.」。"}]},{"language":"en","id":"embedded-questions","title":"間接問句的語序","explanation":["CEFR B1 ｜ 使用頻率：常","用 Could you tell me 或 Do you know 引入問題時，嵌入部分採主詞在動詞前的直述語序。原問題若沒有疑問詞，就用 if 或 whether 引入。","直接問 Where does the train stop?，嵌入後是 Do you know where the train stops?，does 消失，stop 恢復 stops。","常見誤用：Could you explain why do the totals differ?　修正：Could you explain why the totals differ?"],"examples":[{"text":"Could you tell me where the rehearsal room is? Do you know if it is open?","zh":"可以告訴我排練室在哪裡嗎？你知道它開放了嗎？"},{"text":"Do you know when it starts?","zh":"你知道它什麼時候開始嗎？"},{"text":"Could you explain why the totals differ?","zh":"可以解釋為何總額不一樣嗎？"}],"questions":[{"id":"context-1","type":"choice","prompt":"Do you know where ___?","options":["is the venue","the venue is","does the venue is"],"answers":["the venue is"],"explanation":"嵌入問句使用 the venue is 的直述語序。"},{"id":"context-2","type":"choice","prompt":"Could you tell me ___ there are any places left?","options":["what","which","whether"],"answers":["whether"],"explanation":"原本是「還有名額嗎」的是非問句，用 whether 或 if 引入。"},{"id":"complete-form","type":"fill","prompt":"可以解釋為何總額不一樣嗎？ 依語境填入 the totals differ 或 do the totals differ。\\nCould you explain why ___?","answers":["the totals differ"],"explanation":"用 Could you tell me 或 Do you know 引入問題時，嵌入部分採主詞在動詞前的直述語序。原問題若沒有疑問詞，就用 if 或 whether 引入。 此句應寫成「Could you explain why the totals differ?」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n你知道它什麼時候開始嗎？\\nit ｜ Do ｜ when ｜ you ｜ starts? ｜ know","answers":["Do you know when it starts?","Do you know when it starts"],"explanation":"用 Could you tell me 或 Do you know 引入問題時，嵌入部分採主詞在動詞前的直述語序。原問題若沒有疑問詞，就用 if 或 whether 引入。 在這個語境中，完整語序為「Do you know when it starts?」。"}]},{"language":"en","id":"past-counterfactual","title":"第三條件句與過去的反事實","explanation":["CEFR B2 ｜ 使用頻率：常","想像一個已無法改變的過去，用 if 加 had 和過去分詞設定條件，再以 would have 加過去分詞表達想像中的結果。could have 著重可能性或能力。","had seen 與 would have applied 都在談過去。要表達現在的結果時，主句可改成 would be，例如 I would be in London now。","常見誤用：If we\'d left earlier, we\'d have catch the bus.　修正：If we\'d left earlier, we\'d have caught the bus."],"examples":[{"text":"If I had seen the vacancy earlier, I would have applied.","zh":"如果我早點看到那個職缺，我當時就會申請。"},{"text":"If I had known, I would have waited.","zh":"如果我當時知道，我就會等。"},{"text":"If we\'d left earlier, we\'d have caught the bus.","zh":"若早些出門，我們就趕得上公車。"}],"questions":[{"id":"context-1","type":"choice","prompt":"If we ___ the earlier train, we would have arrived on time yesterday.","options":["had caught","have caught","would catch"],"answers":["had caught"],"explanation":"想像昨天實際上沒搭到的車，要用過去完成式 had caught。"},{"id":"context-2","type":"choice","prompt":"If they had sent the link, I ___ the call yesterday.","options":["would join tomorrow","would have joined","will join"],"answers":["would have joined"],"explanation":"昨天的通話已經結束，過去的假設結果用 would have joined。"},{"id":"complete-form","type":"fill","prompt":"若早些出門，我們就趕得上公車。 依語境填入 caught 或 catch。\\nIf we\'d left earlier, we\'d have ___ the bus.","answers":["caught"],"explanation":"想像一個已無法改變的過去，用 if 加 had 和過去分詞設定條件，再以 would have 加過去分詞表達想像中的結果。could have 著重可能性或能力。 此句應寫成「If we\'d left earlier, we\'d have caught the bus.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n如果我當時知道，我就會等。\\nIf ｜ had ｜ I ｜ would ｜ waited. ｜ have ｜ known, ｜ I","answers":["If I had known, I would have waited.","If I had known, I would have waited"],"explanation":"想像一個已無法改變的過去，用 if 加 had 和過去分詞設定條件，再以 would have 加過去分詞表達想像中的結果。could have 著重可能性或能力。 在這個語境中，完整語序為「If I had known, I would have waited.」。"}]},{"language":"en","id":"supplementary-relative","title":"非限定關係子句","explanation":["CEFR B2 ｜ 使用頻率：常","補充已經辨認出的對象時，可用逗號隔開關係子句。人用 who，物用 which；此用法須保留關係代名詞。which 還能指前面一整件事。","My classmates who sing 指有唱歌的那些同學。My classmates, who sing, ... 則把唱歌當作這群同學共同的補充資訊。","常見誤用：My flatmate, that sings in the choir, has a spare key.　修正：My flatmate, who sings in the choir, has a spare key."],"examples":[{"text":"Our train was cancelled, which gave us time to rehearse.","zh":"我們的火車取消了，這件事讓我們有時間排練。"},{"text":"The meeting ended early, which helped.","zh":"會議提早結束，這幫了忙。"},{"text":"My flatmate, who sings in the choir, has a spare key.","zh":"我室友在合唱團唱歌，他有備用鑰匙。"}],"questions":[{"id":"context-1","type":"choice","prompt":"My tutor, ___ teaches strategy, used to work in Taipei.","options":["that","who","what"],"answers":["who"],"explanation":"逗號中間是補充說明，先行詞是人，使用 who。"},{"id":"context-2","type":"choice","prompt":"The team finished early, ___ surprised everyone.","options":["which","who","that"],"answers":["which"],"explanation":"which 回指「團隊提早完成」這整件事。"},{"id":"complete-form","type":"fill","prompt":"我室友在合唱團唱歌，他有備用鑰匙。 依語境填入 who 或 that。\\nMy flatmate, ___ sings in the choir, has a spare key.","answers":["who"],"explanation":"補充已經辨認出的對象時，可用逗號隔開關係子句。人用 who，物用 which；此用法須保留關係代名詞。which 還能指前面一整件事。 此句應寫成「My flatmate, who sings in the choir, has a spare key.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n會議提早結束，這幫了忙。\\nearly, ｜ which ｜ helped. ｜ The ｜ meeting ｜ ended","answers":["The meeting ended early, which helped.","The meeting ended early, which helped"],"explanation":"補充已經辨認出的對象時，可用逗號隔開關係子句。人用 who，物用 which；此用法須保留關係代名詞。which 還能指前面一整件事。 在這個語境中，完整語序為「The meeting ended early, which helped.」。"}]},{"language":"en","id":"negative-fronting","title":"否定副詞前置與倒裝","explanation":["CEFR C1 ｜ 使用頻率：常","想在正式發言或文章強調稀少或從未發生，可把 rarely、never 或 seldom 放句首，再將助動詞移到主詞前面。若原句沒有助動詞，就補 do、does 或 did，主要動詞回到原形。","原句 We have never seen this. 前置為 Never have we seen this.，本來的 have 已足以構成倒裝。","常見誤用：Never I have heard this room so quiet.　修正：Never have I heard this room so quiet."],"examples":[{"text":"Rarely do we get the chance to interview a founder twice.","zh":"我們很少有機會訪問同一位創辦人兩次。"},{"text":"Rarely have we agreed so quickly.","zh":"我們很少這麼快就達成共識。"},{"text":"Never have I heard this room so quiet.","zh":"我從沒聽過這個房間這麼安靜。"}],"questions":[{"id":"context-1","type":"choice","prompt":"Seldom ___ such detailed feedback on a presentation.","options":["we receive","do we receive","do we receives"],"answers":["do we receive"],"explanation":"Seldom 前置後用 do we receive，主要動詞維持原形。"},{"id":"context-2","type":"choice","prompt":"Never ___ a queue this long before.","options":["I have seen","have I saw","have I seen"],"answers":["have I seen"],"explanation":"完成式保留過去分詞 seen，助動詞 have 移至 I 前面。"},{"id":"complete-form","type":"fill","prompt":"我從沒聽過這個房間這麼安靜。 依語境填入 have I heard 或 I have heard。\\nNever ___ this room so quiet.","answers":["have I heard"],"explanation":"想在正式發言或文章強調稀少或從未發生，可把 rarely、never 或 seldom 放句首，再將助動詞移到主詞前面。若原句沒有助動詞，就補 do、does 或 did，主要動詞回到原形。 此句應寫成「Never have I heard this room so quiet.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我們很少這麼快就達成共識。\\nquickly. ｜ have ｜ agreed ｜ Rarely ｜ so ｜ we","answers":["Rarely have we agreed so quickly.","Rarely have we agreed so quickly"],"explanation":"想在正式發言或文章強調稀少或從未發生，可把 rarely、never 或 seldom 放句首，再將助動詞移到主詞前面。若原句沒有助動詞，就補 do、does 或 did，主要動詞回到原形。 在這個語境中，完整語序為「Rarely have we agreed so quickly.」。"}]},{"language":"en","id":"anterior-participle","title":"分詞子句與時間先後","explanation":["CEFR C1 ｜ 使用頻率：常","兩個動作有同一個執行者時，可以用分詞子句壓縮時間、原因或背景。Having 加過去分詞清楚標明第一件事已經完成，接著才發生主要子句的事。分詞子句的隱含主詞通常等於主要子句主詞。","Having checked the figures, the proposal was sent. 會讓 proposal 看似在核對數字。把執行者 Joy 放回主句即可。","常見誤用：Having checking the receipts, we approved the claim.　修正：Having checked the receipts, we approved the claim."],"examples":[{"text":"Having checked the figures, Joy sent the proposal to the team.","zh":"核對完數字後，Joy 把提案寄給團隊。"},{"text":"Having finished the report, we left.","zh":"完成報告後，我們就離開了。"},{"text":"Having checked the receipts, we approved the claim.","zh":"核對完收據後，我們核准了這筆報銷。"}],"questions":[{"id":"context-1","type":"choice","prompt":"___ the interviews, we began coding the transcripts.","options":["Having completed","Have completing","Had complete"],"answers":["Having completed"],"explanation":"Having completed 標出訪談已經結束，再開始整理逐字稿。"},{"id":"context-2","type":"choice","prompt":"哪一句清楚表示是志工檢查路線？","options":["Having checked the route, the map was folded.","Having checked the route, the volunteers folded the map.","Having checked the route, the bus stop was nearby."],"answers":["Having checked the route, the volunteers folded the map."],"explanation":"主句主詞 the volunteers 同時也是 checked 的執行者。"},{"id":"complete-form","type":"fill","prompt":"核對完收據後，我們核准了這筆報銷。 依語境填入 checked 或 checking。\\nHaving ___ the receipts, we approved the claim.","answers":["checked"],"explanation":"兩個動作有同一個執行者時，可以用分詞子句壓縮時間、原因或背景。Having 加過去分詞清楚標明第一件事已經完成，接著才發生主要子句的事。分詞子句的隱含主詞通常等於主要子句主詞。 此句應寫成「Having checked the receipts, we approved the claim.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n完成報告後，我們就離開了。\\nreport, ｜ left. ｜ finished ｜ Having ｜ the ｜ we","answers":["Having finished the report, we left.","Having finished the report, we left"],"explanation":"兩個動作有同一個執行者時，可以用分詞子句壓縮時間、原因或背景。Having 加過去分詞清楚標明第一件事已經完成，接著才發生主要子句的事。分詞子句的隱含主詞通常等於主要子句主詞。 在這個語境中，完整語序為「Having finished the report, we left.」。"}]},{"language":"en","id":"reported-infinitive","title":"被動報導句與不定詞時態","explanation":["CEFR C1 ｜ 使用頻率：常","報導未經自己直接確認的消息，可用主詞加 is said、is believed 或 is thought，再接不定詞。to be 可描述與報導同時的狀態；to have 加過去分詞則表明事件比報導更早。","報導「現在進行中」可用 to be doing，例如 The team is said to be recruiting.。","常見誤用：The grant is thought to have cover the rent.　修正：The grant is thought to have covered the rent."],"examples":[{"text":"The charity is believed to have opened its first school in 1998.","zh":"據信，該慈善機構在 1998 年開辦了它的第一所學校。"},{"text":"The firm is said to be expanding.","zh":"據說那家公司正在擴張。"},{"text":"The grant is thought to have covered the rent.","zh":"據信該補助已支付了租金。"}],"questions":[{"id":"context-1","type":"choice","prompt":"The pianist is said ___ in Edinburgh currently.","options":["to living","to be living","to have live"],"answers":["to be living"],"explanation":"currently 說明現在的狀態，to be living 表示據說目前住在當地。"},{"id":"context-2","type":"choice","prompt":"The venue is believed ___ last summer.","options":["to have closed","to closing","to closes"],"answers":["to have closed"],"explanation":"去年夏天關閉，比現在的報導更早，用完成不定詞。"},{"id":"complete-form","type":"fill","prompt":"據信該補助已支付了租金。 依語境填入 covered 或 cover。\\nThe grant is thought to have ___ the rent.","answers":["covered"],"explanation":"報導未經自己直接確認的消息，可用主詞加 is said、is believed 或 is thought，再接不定詞。to be 可描述與報導同時的狀態；to have 加過去分詞則表明事件比報導更早。 此句應寫成「The grant is thought to have covered the rent.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n據說那家公司正在擴張。\\nsaid ｜ firm ｜ be ｜ expanding. ｜ The ｜ is ｜ to","answers":["The firm is said to be expanding.","The firm is said to be expanding"],"explanation":"報導未經自己直接確認的消息，可用主詞加 is said、is believed 或 is thought，再接不定詞。to be 可描述與報導同時的狀態；to have 加過去分詞則表明事件比報導更早。 在這個語境中，完整語序為「The firm is said to be expanding.」。"}]},{"language":"en","id":"though-fronting","title":"讓步倒裝與 as、though","explanation":["CEFR C2 ｜ 使用頻率：進","正式或文學語境中，可將形容詞前置，再接 as 或 though 引出讓步。Difficult as it was 表示「雖然很困難」。前置單數名詞作述語時，傳統結構常省略不定冠詞，例如 Novice though I was。","此處的 as 表讓步。As the pitch was persuasive 單獨放在前面則很容易被理解為「由於提案很有說服力」。","常見誤用：Useful though was it, the survey missed commuters.　修正：Useful though it was, the survey missed commuters."],"examples":[{"text":"Persuasive though the pitch was, it left the funding question unanswered.","zh":"這場提案雖然很有說服力，卻沒解答資金從哪裡來。"},{"text":"Costly though it was, we proceeded.","zh":"雖然成本很高，我們仍然繼續進行。"},{"text":"Useful though it was, the survey missed commuters.","zh":"調查雖有用，卻漏掉了通勤者。"}],"questions":[{"id":"context-1","type":"choice","prompt":"___ though the sample was, the interviews revealed a pattern.","options":["Small","A small","Smallness was"],"answers":["Small"],"explanation":"把形容詞 small 移到 though 前，the sample was 保留原順序。"},{"id":"context-2","type":"choice","prompt":"Experienced as she was, she still sought advice. 最接近哪個意思？","options":["她尋求意見是因為缺乏經驗。","她一有經驗就開始給建議。","她雖經驗豐富，仍徵詢了意見。"],"answers":["她雖經驗豐富，仍徵詢了意見。"],"explanation":"Experienced as she was 構成讓步，重點是經驗豐富仍願意求教。"},{"id":"complete-form","type":"fill","prompt":"調查雖有用，卻漏掉了通勤者。 依語境填入 it was 或 was it。\\nUseful though ___, the survey missed commuters.","answers":["it was"],"explanation":"正式或文學語境中，可將形容詞前置，再接 as 或 though 引出讓步。Difficult as it was 表示「雖然很困難」。前置單數名詞作述語時，傳統結構常省略不定冠詞，例如 Novice though I was。 此句應寫成「Useful though it was, the survey missed commuters.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n雖然成本很高，我們仍然繼續進行。\\nthough ｜ we ｜ it ｜ Costly ｜ proceeded. ｜ was,","answers":["Costly though it was, we proceeded.","Costly though it was, we proceeded"],"explanation":"正式或文學語境中，可將形容詞前置，再接 as 或 though 引出讓步。Difficult as it was 表示「雖然很困難」。前置單數名詞作述語時，傳統結構常省略不定冠詞，例如 Novice though I was。 在這個語境中，完整語序為「Costly though it was, we proceeded.」。"}]},{"language":"en","id":"conditional-inversion","title":"正式條件句的省略與倒裝","explanation":["CEFR C2 ｜ 使用頻率：進","正式書信或簡報可以省略 if，並將 had、were 或 should 移到主詞之前。Had we known 表示過去反事實；Were funding to fall 設定假想情境；Should you need help 禮貌提出未來可能出現的情況。","否定通常留在主詞後，例如 Had we not secured funding。請依條件的時間與真實程度選擇開頭。","常見誤用：Had we asking, we\'d have found a cheaper hall.　修正：Had we asked, we\'d have found a cheaper hall."],"examples":[{"text":"Were funding to fall, we would protect the teaching budget first.","zh":"萬一資金下滑，我們會先保住教學預算。"},{"text":"Had we known, we would have objected.","zh":"倘若我們當時知道，就會提出異議。"},{"text":"Had we asked, we\'d have found a cheaper hall.","zh":"要是當時有問，就會找到較便宜的場地。"}],"questions":[{"id":"context-1","type":"choice","prompt":"___ you require further details, please contact our team.","options":["Were","Should","Had"],"answers":["Should"],"explanation":"Should you require 是正式書信常用的可能條件，相當於 If you should require。"},{"id":"context-2","type":"choice","prompt":"If we had not secured a venue, we would have postponed. 哪個開頭可保留原意？","options":["Had we not secured a venue","Were we securing a venue","Should we secure a venue"],"answers":["Had we not secured a venue"],"explanation":"過去完成式的條件省略 if，把 had 放在主詞前，not 留在主詞後。"},{"id":"complete-form","type":"fill","prompt":"要是當時有問，就會找到較便宜的場地。 依語境填入 asked 或 asking。\\nHad we ___, we\'d have found a cheaper hall.","answers":["asked"],"explanation":"正式書信或簡報可以省略 if，並將 had、were 或 should 移到主詞之前。Had we known 表示過去反事實；Were funding to fall 設定假想情境；Should you need help 禮貌提出未來可能出現的情況。 此句應寫成「Had we asked, we\'d have found a cheaper hall.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n倘若我們當時知道，就會提出異議。\\nhave ｜ known, ｜ we ｜ Had ｜ objected. ｜ we ｜ would","answers":["Had we known, we would have objected.","Had we known, we would have objected"],"explanation":"正式書信或簡報可以省略 if，並將 had、were 或 should 移到主詞之前。Had we known 表示過去反事實；Were funding to fall 設定假想情境；Should you need help 禮貌提出未來可能出現的情況。 在這個語境中，完整語序為「Had we known, we would have objected.」。"}]},{"language":"en","id":"nominal-substitution","title":"指代替換與避免歧義","explanation":["CEFR C2 ｜ 使用頻率：進","正式比較中，用 that of 代替已出現的單數或不可數名詞，用 those of 代替複數名詞。先找清楚比較的兩端，再決定替代詞的數。並列動作可用 do so 回指前面已經說過的動作。","The salary in Paris exceeds that of the Lyon role. 裡面的 that 指 salary。直接把薪水與一份職位相比，兩端的比較對象會不一致。","常見誤用：The rent here exceeds those of our old flat.　修正：The rent here exceeds that of our old flat."],"examples":[{"text":"The Paris team’s estimates were more cautious than those of its London counterpart.","zh":"巴黎團隊的估計比倫敦團隊的估計更保守。"},{"text":"Our results resemble those of earlier studies.","zh":"我們的結果與先前研究的結果相似。"},{"text":"The rent here exceeds that of our old flat.","zh":"這裡的租金比舊公寓高。"}],"questions":[{"id":"context-1","type":"choice","prompt":"The findings of our survey broadly match ___ the larger study.","options":["that of","those of","it of"],"answers":["those of"],"explanation":"findings 是複數，those of the larger study 指那項較大研究的發現。"},{"id":"context-2","type":"choice","prompt":"We invited both teams to revise their estimates, but only one agreed to ___.","options":["be so","do these","do so"],"answers":["do so"],"explanation":"do so 代替動作 revise their estimates，避免重複整段。"},{"id":"complete-form","type":"fill","prompt":"這裡的租金比舊公寓高。 依語境填入 that of 或 those of。\\nThe rent here exceeds ___ our old flat.","answers":["that of"],"explanation":"正式比較中，用 that of 代替已出現的單數或不可數名詞，用 those of 代替複數名詞。先找清楚比較的兩端，再決定替代詞的數。並列動作可用 do so 回指前面已經說過的動作。 此句應寫成「The rent here exceeds that of our old flat.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我們的結果與先前研究的結果相似。\\nresemble ｜ earlier ｜ Our ｜ results ｜ of ｜ studies. ｜ those","answers":["Our results resemble those of earlier studies.","Our results resemble those of earlier studies"],"explanation":"正式比較中，用 that of 代替已出現的單數或不可數名詞，用 those of 代替複數名詞。先找清楚比較的兩端，再決定替代詞的數。並列動作可用 do so 回指前面已經說過的動作。 在這個語境中，完整語序為「Our results resemble those of earlier studies.」。"}]},{"language":"en","id":"there-is","title":"用 there is／are 介紹空間","explanation":["CEFR A1 ｜ 使用頻率：高","介紹場所裡有什麼，用 there 加 be，再依後面名詞選單複數；以已知名詞起句則是描述它。","比較「There is a leak upstairs.」（樓上有一處漏水。）和「The leak is upstairs.」（漏水的地方在樓上。）。","常見誤用：There is two sockets by the desk.　修正：There are two sockets by the desk."],"examples":[{"text":"There is a leak upstairs.","zh":"樓上有一處漏水。"},{"text":"The leak is upstairs.","zh":"漏水的地方在樓上。"},{"text":"There are two sockets by the desk.","zh":"書桌旁有兩個插座。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「樓上有一處漏水。」？","options":["The leak is upstairs.","There is a leak upstairs."],"answers":["There is a leak upstairs."],"explanation":"第一種意思是「樓上有一處漏水。」，另一種是「漏水的地方在樓上。」。介紹場所裡有什麼，用 there 加 be，再依後面名詞選單複數；以已知名詞起句則是描述它。"},{"id":"complete-form","type":"fill","prompt":"書桌旁有兩個插座。\\n請從「are／is」選出合適寫法，只填空格。\\nThere ___ two sockets by the desk.","answers":["are"],"explanation":"介紹場所裡有什麼，用 there 加 be，再依後面名詞選單複數；以已知名詞起句則是描述它。 完整寫法是「There are two sockets by the desk.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThere ___ some soup left.","options":["is","are"],"answers":["is"],"explanation":"介紹場所裡有什麼，用 there 加 be，再依後面名詞選單複數；以已知名詞起句則是描述它。 完整寫法是「There is some soup left.」。"},{"id":"transfer","type":"choice","prompt":"你剛進教室，想告訴同學現場有插座。","options":["The socket has a window.","There\'s a socket by the window."],"answers":["There\'s a socket by the window."],"explanation":"介紹場所裡有什麼，用 there 加 be，再依後面名詞選單複數；以已知名詞起句則是描述它。 此處要表達的意思對應「There\'s a socket by the window.」。"}]},{"language":"en","id":"demonstratives","title":"指示詞的遠近與單複數","explanation":["CEFR A1 ｜ 使用頻率：高","指示詞同時區分遠近和數量。this／these 指近處，that／those 指較遠處。","比較「Are these keys yours?」（這幾把鑰匙是你的嗎？）和「Is that key yours?」（那把鑰匙是你的嗎？）。","常見誤用：Could you pass me that folders over there?　修正：Could you pass me those folders over there?"],"examples":[{"text":"Are these keys yours?","zh":"這幾把鑰匙是你的嗎？"},{"text":"Is that key yours?","zh":"那把鑰匙是你的嗎？"},{"text":"Could you pass me those folders over there?","zh":"能把那邊那幾個資料夾遞給我嗎？"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「這幾把鑰匙是你的嗎？」？","options":["Is that key yours?","Are these keys yours?"],"answers":["Are these keys yours?"],"explanation":"第一種意思是「這幾把鑰匙是你的嗎？」，另一種是「那把鑰匙是你的嗎？」。指示詞同時區分遠近和數量。this／these 指近處，that／those 指較遠處。"},{"id":"complete-form","type":"fill","prompt":"能把那邊那幾個資料夾遞給我嗎？\\n請從「those／that」選出合適寫法，只填空格。\\nCould you pass me ___ folders over there?","answers":["those"],"explanation":"指示詞同時區分遠近和數量。this／these 指近處，that／those 指較遠處。 完整寫法是「Could you pass me those folders over there?」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\n___ badge here is mine.","options":["These","This"],"answers":["This"],"explanation":"指示詞同時區分遠近和數量。this／these 指近處，that／those 指較遠處。 完整寫法是「This badge here is mine.」。"},{"id":"transfer","type":"choice","prompt":"你手上只有一張卡，指著自己手上這張詢問。","options":["Is this card valid?","Are those cards valid?"],"answers":["Is this card valid?"],"explanation":"指示詞同時區分遠近和數量。this／these 指近處，that／those 指較遠處。 此處要表達的意思對應「Is this card valid?」。"}]},{"language":"en","id":"as-as","title":"as…as 的同等比較","explanation":["CEFR A2 ｜ 使用頻率：高","as 加原級形容詞再加 as 表程度相同；第一個 as 前加 not 表未達對方程度。","比較「My room is as warm as yours.」（我房間跟你的一樣暖。）和「My room isn\'t as warm as yours.」（我房間沒有你的暖。）。","常見誤用：Her recording sounds as clearer as yours.　修正：Her recording sounds as clear as yours."],"examples":[{"text":"My room is as warm as yours.","zh":"我房間跟你的一樣暖。"},{"text":"My room isn\'t as warm as yours.","zh":"我房間沒有你的暖。"},{"text":"Her recording sounds as clear as yours.","zh":"她的錄音跟你的一樣清楚。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我房間跟你的一樣暖。」？","options":["My room is as warm as yours.","My room isn\'t as warm as yours."],"answers":["My room is as warm as yours."],"explanation":"第一種意思是「我房間跟你的一樣暖。」，另一種是「我房間沒有你的暖。」。as 加原級形容詞再加 as 表程度相同；第一個 as 前加 not 表未達對方程度。"},{"id":"complete-form","type":"fill","prompt":"她的錄音跟你的一樣清楚。\\n請從「clearer／clear」選出合適寫法，只填空格。\\nHer recording sounds as ___ as yours.","answers":["clear"],"explanation":"as 加原級形容詞再加 as 表程度相同；第一個 as 前加 not 表未達對方程度。 完整寫法是「Her recording sounds as clear as yours.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThis bag is as ___ as mine.","options":["heavy","heavier"],"answers":["heavy"],"explanation":"as 加原級形容詞再加 as 表程度相同；第一個 as 前加 not 表未達對方程度。 完整寫法是「This bag is as heavy as mine.」。"},{"id":"transfer","type":"choice","prompt":"報告說兩組樣本「同樣大」。","options":["The two samples are equally large.","The second sample is larger."],"answers":["The two samples are equally large."],"explanation":"as 加原級形容詞再加 as 表程度相同；第一個 as 前加 not 表未達對方程度。 此處要表達的意思對應「The two samples are equally large.」。"}]},{"language":"en","id":"arranged-future","title":"用現在進行式說已約好的行程","explanation":["CEFR A2 ｜ 使用頻率：高","已經約定的行程可用 be 加 -ing，另給未來時間。might 加原形則保留不確定性。","比較「I\'m meeting Léa on Friday.」（我約好週五見蕾雅。）和「I might meet Léa on Friday.」（我週五可能會見蕾雅。）。","常見誤用：We are take the early train tomorrow.　修正：We are taking the early train tomorrow."],"examples":[{"text":"I\'m meeting Léa on Friday.","zh":"我約好週五見蕾雅。"},{"text":"I might meet Léa on Friday.","zh":"我週五可能會見蕾雅。"},{"text":"We are taking the early train tomorrow.","zh":"我們安排好明天搭早班火車。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我約好週五見蕾雅。」？","options":["I\'m meeting Léa on Friday.","I might meet Léa on Friday."],"answers":["I\'m meeting Léa on Friday."],"explanation":"第一種意思是「我約好週五見蕾雅。」，另一種是「我週五可能會見蕾雅。」。已經約定的行程可用 be 加 -ing，另給未來時間。might 加原形則保留不確定性。"},{"id":"complete-form","type":"fill","prompt":"我們安排好明天搭早班火車。\\n請從「are taking／are take」選出合適寫法，只填空格。\\nWe ___ the early train tomorrow.","answers":["are taking"],"explanation":"已經約定的行程可用 be 加 -ing，另給未來時間。might 加原形則保留不確定性。 完整寫法是「We are taking the early train tomorrow.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nShe ___ with us tonight.","options":["is rehearse","is rehearsing"],"answers":["is rehearsing"],"explanation":"已經約定的行程可用 be 加 -ing，另給未來時間。might 加原形則保留不確定性。 完整寫法是「She is rehearsing with us tonight.」。"},{"id":"transfer","type":"choice","prompt":"明天已約了面試官十點見，選擇明確表達已安排的句子。","options":["I\'m seeing the interviewer at ten.","I might see the interviewer at ten."],"answers":["I\'m seeing the interviewer at ten."],"explanation":"已經約定的行程可用 be 加 -ing，另給未來時間。might 加原形則保留不確定性。 此處要表達的意思對應「I\'m seeing the interviewer at ten.」。"}]},{"language":"en","id":"used-to","title":"used to 與 be used to","explanation":["CEFR B1 ｜ 使用頻率：高","用 used to 加原形回顧已改變的習慣或狀態。be used to 加名詞或動名詞則表示早已適應。","比較「I used to share a kitchen.」（我以前和別人共用廚房。）和「I\'m used to sharing a kitchen.」（我已習慣和別人共用廚房。）。","常見誤用：We used to meeting here on Thursdays.　修正：We used to meet here on Thursdays."],"examples":[{"text":"I used to share a kitchen.","zh":"我以前和別人共用廚房。"},{"text":"I\'m used to sharing a kitchen.","zh":"我已習慣和別人共用廚房。"},{"text":"We used to meet here on Thursdays.","zh":"我們以前每週四在這裡見面。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我以前和別人共用廚房。」？","options":["I\'m used to sharing a kitchen.","I used to share a kitchen."],"answers":["I used to share a kitchen."],"explanation":"第一種意思是「我以前和別人共用廚房。」，另一種是「我已習慣和別人共用廚房。」。用 used to 加原形回顧已改變的習慣或狀態。be used to 加名詞或動名詞則表示早已適應。"},{"id":"complete-form","type":"fill","prompt":"我們以前每週四在這裡見面。\\n請從「meeting／meet」選出合適寫法，只填空格。\\nWe used to ___ here on Thursdays.","answers":["meet"],"explanation":"用 used to 加原形回顧已改變的習慣或狀態。be used to 加名詞或動名詞則表示早已適應。 完整寫法是「We used to meet here on Thursdays.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nI\'m used to ___ home.","options":["walking","walk"],"answers":["walking"],"explanation":"用 used to 加原形回顧已改變的習慣或狀態。be used to 加名詞或動名詞則表示早已適應。 完整寫法是「I\'m used to walking home.」。"},{"id":"transfer","type":"choice","prompt":"你現在仍搭公車，而且已經習慣了。","options":["I used to take the bus, but now I cycle.","I\'m used to taking the bus."],"answers":["I\'m used to taking the bus."],"explanation":"用 used to 加原形回顧已改變的習慣或狀態。be used to 加名詞或動名詞則表示早已適應。 此處要表達的意思對應「I\'m used to taking the bus.」。"}]},{"language":"en","id":"relative-defining","title":"限定關係子句中的主詞與受詞","explanation":["CEFR B1 ｜ 使用頻率：高","限定子句協助辨認對象。關係詞作受詞時可省略；作主詞時必須保留。","比較「The student we interviewed speaks Thai.」（我們訪問的學生會泰語。）和「The student who interviewed us speaks Thai.」（訪問我們的學生會泰語。）。","常見誤用：The bus whose stops here goes to campus.　修正：The bus that stops here goes to campus."],"examples":[{"text":"The student we interviewed speaks Thai.","zh":"我們訪問的學生會泰語。"},{"text":"The student who interviewed us speaks Thai.","zh":"訪問我們的學生會泰語。"},{"text":"The bus that stops here goes to campus.","zh":"停在這裡的公車開往校園。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我們訪問的學生會泰語。」？","options":["The student we interviewed speaks Thai.","The student who interviewed us speaks Thai."],"answers":["The student we interviewed speaks Thai."],"explanation":"第一種意思是「我們訪問的學生會泰語。」，另一種是「訪問我們的學生會泰語。」。限定子句協助辨認對象。關係詞作受詞時可省略；作主詞時必須保留。"},{"id":"complete-form","type":"fill","prompt":"停在這裡的公車開往校園。\\n請從「that／whose」選出合適寫法，只填空格。\\nThe bus ___ stops here goes to campus.","answers":["that"],"explanation":"限定子句協助辨認對象。關係詞作受詞時可省略；作主詞時必須保留。 完整寫法是「The bus that stops here goes to campus.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe mentor ___ notes I borrowed is here.","options":["who","whose"],"answers":["whose"],"explanation":"限定子句協助辨認對象。關係詞作受詞時可省略；作主詞時必須保留。 完整寫法是「The mentor whose notes I borrowed is here.」。"},{"id":"transfer","type":"choice","prompt":"你想指「我教過的學生」，誰是 teach 的主詞？","options":["the students who taught me","the students I taught"],"answers":["the students I taught"],"explanation":"限定子句協助辨認對象。關係詞作受詞時可省略；作主詞時必須保留。 此處要表達的意思對應「the students I taught」。"}]},{"language":"en","id":"gerund-preposition","title":"介系詞後的動名詞","explanation":["CEFR B1 ｜ 使用頻率：高","介系詞後要描述活動，動詞用 -ing。look forward to 的 to 是介系詞，而 want to 的 to 引出原形。","比較「I look forward to meeting the team.」（我期待見團隊成員。）和「I want to meet the team.」（我想見團隊成員。）。","常見誤用：She left without sign the sheet.　修正：She left without signing the sheet."],"examples":[{"text":"I look forward to meeting the team.","zh":"我期待見團隊成員。"},{"text":"I want to meet the team.","zh":"我想見團隊成員。"},{"text":"She left without signing the sheet.","zh":"她沒簽到就走了。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我期待見團隊成員。」？","options":["I look forward to meeting the team.","I want to meet the team."],"answers":["I look forward to meeting the team."],"explanation":"第一種意思是「我期待見團隊成員。」，另一種是「我想見團隊成員。」。介系詞後要描述活動，動詞用 -ing。look forward to 的 to 是介系詞，而 want to 的 to 引出原形。"},{"id":"complete-form","type":"fill","prompt":"她沒簽到就走了。\\n請從「signing／sign」選出合適寫法，只填空格。\\nShe left without ___ the sheet.","answers":["signing"],"explanation":"介系詞後要描述活動，動詞用 -ing。look forward to 的 to 是介系詞，而 want to 的 to 引出原形。 完整寫法是「She left without signing the sheet.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThanks for ___ the figures.","options":["check","checking"],"answers":["checking"],"explanation":"介系詞後要描述活動，動詞用 -ing。look forward to 的 to 是介系詞，而 want to 的 to 引出原形。 完整寫法是「Thanks for checking the figures.」。"},{"id":"transfer","type":"choice","prompt":"用介系詞描述你是透過比較兩組訪談才發現差異。","options":["I found the difference by comparing the interviews.","I found the difference by compare the interviews."],"answers":["I found the difference by comparing the interviews."],"explanation":"介系詞後要描述活動，動詞用 -ing。look forward to 的 to 是介系詞，而 want to 的 to 引出原形。 此處要表達的意思對應「I found the difference by comparing the interviews.」。"}]},{"language":"en","id":"present-perfect-yet","title":"yet 與 already 的完成式問句","explanation":["CEFR B1 ｜ 使用頻率：高","預期的事是否至今已完成，用現在完成式配 yet。already 在問句中可表示比預期還早。","比較「Has the pass arrived yet?」（通行證寄到了嗎？）和「Has the pass already arrived?」（通行證竟然已經寄到了嗎？）。","常見誤用：We haven\'t chose a venue yet.　修正：We haven\'t chosen a venue yet."],"examples":[{"text":"Has the pass arrived yet?","zh":"通行證寄到了嗎？"},{"text":"Has the pass already arrived?","zh":"通行證竟然已經寄到了嗎？"},{"text":"We haven\'t chosen a venue yet.","zh":"我們還沒選好場地。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「通行證寄到了嗎？」？","options":["Has the pass arrived yet?","Has the pass already arrived?"],"answers":["Has the pass arrived yet?"],"explanation":"第一種意思是「通行證寄到了嗎？」，另一種是「通行證竟然已經寄到了嗎？」。預期的事是否至今已完成，用現在完成式配 yet。already 在問句中可表示比預期還早。"},{"id":"complete-form","type":"fill","prompt":"我們還沒選好場地。\\n請從「chosen／chose」選出合適寫法，只填空格。\\nWe haven\'t ___ a venue yet.","answers":["chosen"],"explanation":"預期的事是否至今已完成，用現在完成式配 yet。already 在問句中可表示比預期還早。 完整寫法是「We haven\'t chosen a venue yet.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nHas the office ___ yet?","options":["reply","replied"],"answers":["replied"],"explanation":"預期的事是否至今已完成，用現在完成式配 yet。already 在問句中可表示比預期還早。 完整寫法是「Has the office replied yet?」。"},{"id":"transfer","type":"choice","prompt":"報銷正在等發票，你想表示「目前還沒收到」。","options":["I didn\'t need the invoice after all.","I haven\'t received the invoice yet."],"answers":["I haven\'t received the invoice yet."],"explanation":"預期的事是否至今已完成，用現在完成式配 yet。already 在問句中可表示比預期還早。 此處要表達的意思對應「I haven\'t received the invoice yet.」。"}]},{"language":"en","id":"past-perfect","title":"過去完成式與事件先後","explanation":["CEFR B2 ｜ 使用頻率：高","在已建立的過去參照點前完成，用 had 加過去分詞；一般過去式可用來推進接下來的事件。","比較「When I arrived, the porter had left.」（我到時門房已走了。）和「When I arrived, the porter left.」（我到時，門房才離開。）。","常見誤用：The talk had began before we found the room.　修正：The talk had begun before we found the room."],"examples":[{"text":"When I arrived, the porter had left.","zh":"我到時門房已走了。"},{"text":"When I arrived, the porter left.","zh":"我到時，門房才離開。"},{"text":"The talk had begun before we found the room.","zh":"我們找到教室前演講就開始了。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我到時門房已走了。」？","options":["When I arrived, the porter had left.","When I arrived, the porter left."],"answers":["When I arrived, the porter had left."],"explanation":"第一種意思是「我到時門房已走了。」，另一種是「我到時，門房才離開。」。在已建立的過去參照點前完成，用 had 加過去分詞；一般過去式可用來推進接下來的事件。"},{"id":"complete-form","type":"fill","prompt":"我們找到教室前演講就開始了。\\n請從「began／begun」選出合適寫法，只填空格。\\nThe talk had ___ before we found the room.","answers":["begun"],"explanation":"在已建立的過去參照點前完成，用 had 加過去分詞；一般過去式可用來推進接下來的事件。 完整寫法是「The talk had begun before we found the room.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nBy noon the deadline had ___.","options":["passed","pass"],"answers":["passed"],"explanation":"在已建立的過去參照點前完成，用 had 加過去分詞；一般過去式可用來推進接下來的事件。 完整寫法是「By noon the deadline had passed.」。"},{"id":"transfer","type":"choice","prompt":"你打開教室門之前，排練就結束了。","options":["Rehearsal had ended when I opened the door.","Rehearsal ended after I opened the door."],"answers":["Rehearsal had ended when I opened the door."],"explanation":"在已建立的過去參照點前完成，用 had 加過去分詞；一般過去式可用來推進接下來的事件。 此處要表達的意思對應「Rehearsal had ended when I opened the door.」。"}]},{"language":"en","id":"future-perfect","title":"未來完成式與截止時間","explanation":["CEFR B2 ｜ 使用頻率：高","從未來時間點回看已完成的事，用 will have 加過去分詞；will be 加 -ing 則把活動放在當時進行中。","比較「By noon I\'ll have checked the files.」（到中午我就會核對完檔案。）和「At noon I\'ll be checking the files.」（中午時我會正在核對檔案。）。","常見誤用：By June she\'ll have spend a year in Paris.　修正：By June she\'ll have spent a year in Paris."],"examples":[{"text":"By noon I\'ll have checked the files.","zh":"到中午我就會核對完檔案。"},{"text":"At noon I\'ll be checking the files.","zh":"中午時我會正在核對檔案。"},{"text":"By June she\'ll have spent a year in Paris.","zh":"到六月她就在巴黎待滿一年。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「到中午我就會核對完檔案。」？","options":["At noon I\'ll be checking the files.","By noon I\'ll have checked the files."],"answers":["By noon I\'ll have checked the files."],"explanation":"第一種意思是「到中午我就會核對完檔案。」，另一種是「中午時我會正在核對檔案。」。從未來時間點回看已完成的事，用 will have 加過去分詞；will be 加 -ing 則把活動放在當時進行中。"},{"id":"complete-form","type":"fill","prompt":"到六月她就在巴黎待滿一年。\\n請從「spend／spent」選出合適寫法，只填空格。\\nBy June she\'ll have ___ a year in Paris.","answers":["spent"],"explanation":"從未來時間點回看已完成的事，用 will have 加過去分詞；will be 加 -ing 則把活動放在當時進行中。 完整寫法是「By June she\'ll have spent a year in Paris.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nBy Friday we\'ll have ___ the report.","options":["wrote","written"],"answers":["written"],"explanation":"從未來時間點回看已完成的事，用 will have 加過去分詞；will be 加 -ing 則把活動放在當時進行中。 完整寫法是「By Friday we\'ll have written the report.」。"},{"id":"transfer","type":"choice","prompt":"和老師約下週一討論。你承諾到那時報告會已經讀完。","options":["By Monday I\'ll have read the report.","On Monday I\'ll start reading the report."],"answers":["By Monday I\'ll have read the report."],"explanation":"從未來時間點回看已完成的事，用 will have 加過去分詞；will be 加 -ing 則把活動放在當時進行中。 此處要表達的意思對應「By Monday I\'ll have read the report.」。"}]},{"language":"en","id":"second-conditional","title":"第二條件句的假設距離","explanation":["CEFR B2 ｜ 使用頻率：高","設想與現況有距離的條件，用 if 加過去式，結果用 would 加原形；if 加現在式的可能性較開放。","比較「If I lived closer, I\'d walk to class.」（要是住近點，我就會走路上課。）和「If I move closer, I\'ll walk to class.」（如果我搬近一點，就會走路上課。）。","常見誤用：If we had a van, we would drove there.　修正：If we had a van, we would drive there."],"examples":[{"text":"If I lived closer, I\'d walk to class.","zh":"要是住近點，我就會走路上課。"},{"text":"If I move closer, I\'ll walk to class.","zh":"如果我搬近一點，就會走路上課。"},{"text":"If we had a van, we would drive there.","zh":"若有廂型車，我們就會開車去。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「要是住近點，我就會走路上課。」？","options":["If I move closer, I\'ll walk to class.","If I lived closer, I\'d walk to class."],"answers":["If I lived closer, I\'d walk to class."],"explanation":"第一種意思是「要是住近點，我就會走路上課。」，另一種是「如果我搬近一點，就會走路上課。」。設想與現況有距離的條件，用 if 加過去式，結果用 would 加原形；if 加現在式的可能性較開放。"},{"id":"complete-form","type":"fill","prompt":"若有廂型車，我們就會開車去。\\n請從「drive／drove」選出合適寫法，只填空格。\\nIf we had a van, we would ___ there.","answers":["drive"],"explanation":"設想與現況有距離的條件，用 if 加過去式，結果用 would 加原形；if 加現在式的可能性較開放。 完整寫法是「If we had a van, we would drive there.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nIf she knew, she would ___ us.","options":["told","tell"],"answers":["tell"],"explanation":"設想與現況有距離的條件，用 if 加過去式，結果用 would 加原形；if 加現在式的可能性較開放。 完整寫法是「If she knew, she would tell us.」。"},{"id":"transfer","type":"choice","prompt":"你目前沒有小巴，想像如果有，就可以載志工。","options":["If we had a minibus, we could take the volunteers.","Because we have a minibus, we can take the volunteers."],"answers":["If we had a minibus, we could take the volunteers."],"explanation":"設想與現況有距離的條件，用 if 加過去式，結果用 would 加原形；if 加現在式的可能性較開放。 此處要表達的意思對應「If we had a minibus, we could take the volunteers.」。"}]},{"language":"en","id":"causative-have","title":"have something done 與委託服務","explanation":["CEFR B2 ｜ 使用頻率：高","請別人處理物品，用 have 加物件加過去分詞；主詞直接做事則用一般主動句。","比較「I had my bike repaired.」（我請人修了腳踏車。）和「I repaired my bike.」（我自己修了腳踏車。）。","常見誤用：We had the piano tune before the concert.　修正：We had the piano tuned before the concert."],"examples":[{"text":"I had my bike repaired.","zh":"我請人修了腳踏車。"},{"text":"I repaired my bike.","zh":"我自己修了腳踏車。"},{"text":"We had the piano tuned before the concert.","zh":"演出前我們請人調了琴。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我請人修了腳踏車。」？","options":["I had my bike repaired.","I repaired my bike."],"answers":["I had my bike repaired."],"explanation":"第一種意思是「我請人修了腳踏車。」，另一種是「我自己修了腳踏車。」。請別人處理物品，用 have 加物件加過去分詞；主詞直接做事則用一般主動句。"},{"id":"complete-form","type":"fill","prompt":"演出前我們請人調了琴。\\n請從「tuned／tune」選出合適寫法，只填空格。\\nWe had the piano ___ before the concert.","answers":["tuned"],"explanation":"請別人處理物品，用 have 加物件加過去分詞；主詞直接做事則用一般主動句。 完整寫法是「We had the piano tuned before the concert.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nShe\'s having the lock ___.","options":["change","changed"],"answers":["changed"],"explanation":"請別人處理物品，用 have 加物件加過去分詞；主詞直接做事則用一般主動句。 完整寫法是「She\'s having the lock changed.」。"},{"id":"transfer","type":"choice","prompt":"你替社團聯絡印刷店做海報，面試時怎麼交代分工？","options":["I had the posters printed locally.","I printed the posters myself."],"answers":["I had the posters printed locally."],"explanation":"請別人處理物品，用 have 加物件加過去分詞；主詞直接做事則用一般主動句。 此處要表達的意思對應「I had the posters printed locally.」。"}]},{"language":"en","id":"despite-although","title":"despite 與 although 的補語","explanation":["CEFR B2 ｜ 使用頻率：高","讓步時 despite 接名詞或動名詞；although 接有主詞動詞的子句。because of 則引出原因。","比較「Despite the delay, we went ahead.」（儘管延誤，我們仍繼續進行。）和「Because of the delay, we went ahead without him.」（因為延誤，我們沒等他就開始了。）。","常見誤用：Despite the room was small, the acoustics were excellent.　修正：Although the room was small, the acoustics were excellent."],"examples":[{"text":"Despite the delay, we went ahead.","zh":"儘管延誤，我們仍繼續進行。"},{"text":"Because of the delay, we went ahead without him.","zh":"因為延誤，我們沒等他就開始了。"},{"text":"Although the room was small, the acoustics were excellent.","zh":"房間雖小，音響效果卻很好。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「儘管延誤，我們仍繼續進行。」？","options":["Because of the delay, we went ahead without him.","Despite the delay, we went ahead."],"answers":["Despite the delay, we went ahead."],"explanation":"第一種意思是「儘管延誤，我們仍繼續進行。」，另一種是「因為延誤，我們沒等他就開始了。」。讓步時 despite 接名詞或動名詞；although 接有主詞動詞的子句。because of 則引出原因。"},{"id":"complete-form","type":"fill","prompt":"房間雖小，音響效果卻很好。\\n請從「Despite／Although」選出合適寫法，只填空格。\\n___ the room was small, the acoustics were excellent.","answers":["Although"],"explanation":"讓步時 despite 接名詞或動名詞；although 接有主詞動詞的子句。because of 則引出原因。 完整寫法是「Although the room was small, the acoustics were excellent.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\n___ working late, she caught the train.","options":["Although","Despite"],"answers":["Despite"],"explanation":"讓步時 despite 接名詞或動名詞；although 接有主詞動詞的子句。because of 則引出原因。 完整寫法是「Despite working late, she caught the train.」。"},{"id":"transfer","type":"choice","prompt":"選出能直接接「場地已經有人訂了」這個完整子句的讓步連接詞。","options":["despite","although"],"answers":["although"],"explanation":"讓步時 despite 接名詞或動名詞；although 接有主詞動詞的子句。because of 則引出原因。 此處要表達的意思對應「although」。"}]},{"language":"en","id":"past-habit-would","title":"用 would 回憶反覆發生的事","explanation":["CEFR B2 ｜ 使用頻率：高","先建立過去背景，再用 would 加原形呈現反覆的行動；曾擁有的狀態一般用 used to own。","比較「After each rehearsal, we\'d walk home.」（以前每次排練後我們都會走回家。）和「After that rehearsal, we walked home.」（那一次排練後我們走回家。）。","常見誤用：On field visits, the children would waited by the gate.　修正：On field visits, the children would wait by the gate."],"examples":[{"text":"After each rehearsal, we\'d walk home.","zh":"以前每次排練後我們都會走回家。"},{"text":"After that rehearsal, we walked home.","zh":"那一次排練後我們走回家。"},{"text":"On field visits, the children would wait by the gate.","zh":"以往我們造訪時，孩子們總在門口等。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「以前每次排練後我們都會走回家。」？","options":["After each rehearsal, we\'d walk home.","After that rehearsal, we walked home."],"answers":["After each rehearsal, we\'d walk home."],"explanation":"第一種意思是「以前每次排練後我們都會走回家。」，另一種是「那一次排練後我們走回家。」。先建立過去背景，再用 would 加原形呈現反覆的行動；曾擁有的狀態一般用 used to own。"},{"id":"complete-form","type":"fill","prompt":"以往我們造訪時，孩子們總在門口等。\\n請從「wait／waited」選出合適寫法，只填空格。\\nOn field visits, the children would ___ by the gate.","answers":["wait"],"explanation":"先建立過去背景，再用 would 加原形呈現反覆的行動；曾擁有的狀態一般用 used to own。 完整寫法是「On field visits, the children would wait by the gate.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nEach evening the driver would ___ the bags.","options":["count","counted"],"answers":["count"],"explanation":"先建立過去背景，再用 would 加原形呈現反覆的行動；曾擁有的狀態一般用 used to own。 完整寫法是「Each evening the driver would count the bags.」。"},{"id":"transfer","type":"choice","prompt":"你在回憶愛丁堡的生活，想說「那時我有一把琴」，這是擁有的狀態。","options":["I used to own a keyboard.","I would borrow a keyboard every week."],"answers":["I used to own a keyboard."],"explanation":"先建立過去背景，再用 would 加原形呈現反覆的行動；曾擁有的狀態一般用 used to own。 此處要表達的意思對應「I used to own a keyboard.」。"}]},{"language":"en","id":"wish-present","title":"wish 加過去式表達對現況的願望","explanation":["CEFR B2 ｜ 使用頻率：高","wish 加過去式表示希望現況不同；hope 加現在式表示對尚未確定的情況抱有期待。","比較「I wish the boiler worked.」（我真希望鍋爐能正常運作。）和「I hope the boiler works.」（我希望鍋爐是好的。）。","常見誤用：I wish I will know the caretaker\'s number.　修正：I wish I knew the caretaker\'s number."],"examples":[{"text":"I wish the boiler worked.","zh":"我真希望鍋爐能正常運作。"},{"text":"I hope the boiler works.","zh":"我希望鍋爐是好的。"},{"text":"I wish I knew the caretaker\'s number.","zh":"真希望我知道管理員的電話。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我真希望鍋爐能正常運作。」？","options":["I hope the boiler works.","I wish the boiler worked."],"answers":["I wish the boiler worked."],"explanation":"第一種意思是「我真希望鍋爐能正常運作。」，另一種是「我希望鍋爐是好的。」。wish 加過去式表示希望現況不同；hope 加現在式表示對尚未確定的情況抱有期待。"},{"id":"complete-form","type":"fill","prompt":"真希望我知道管理員的電話。\\n請從「will know／knew」選出合適寫法，只填空格。\\nI wish I ___ the caretaker\'s number.","answers":["knew"],"explanation":"wish 加過去式表示希望現況不同；hope 加現在式表示對尚未確定的情況抱有期待。 完整寫法是「I wish I knew the caretaker\'s number.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nShe wishes the studio ___ a lift.","options":["had","will have"],"answers":["had"],"explanation":"wish 加過去式表示希望現況不同；hope 加現在式表示對尚未確定的情況抱有期待。 完整寫法是「She wishes the studio had a lift.」。"},{"id":"transfer","type":"choice","prompt":"同學問你熟不熟法國行政程序。你其實不熟，很希望自己了解。","options":["I wish I knew the procedure.","I know the procedure well."],"answers":["I wish I knew the procedure."],"explanation":"wish 加過去式表示希望現況不同；hope 加現在式表示對尚未確定的情況抱有期待。 此處要表達的意思對應「I wish I knew the procedure.」。"}]},{"language":"en","id":"only-after","title":"Only after 置首時，哪個子句倒裝？","explanation":["CEFR C1 ｜ 使用頻率：中","Only after 加時間事件置首，主句才倒裝，after 內仍用一般語序。普通 after 只交代事件順序。","比較「Only after the vote did we spot the error.」（直到投票後我們才發現錯誤。）和「Even before the vote we had spotted the error.」（投票之前我們就發現了錯誤。）。","常見誤用：Only after she left I realised who she was.　修正：Only after she left did I realise who she was."],"examples":[{"text":"Only after the vote did we spot the error.","zh":"直到投票後我們才發現錯誤。"},{"text":"Even before the vote we had spotted the error.","zh":"投票之前我們就發現了錯誤。"},{"text":"Only after she left did I realise who she was.","zh":"她走後我才意識到她是誰。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「直到投票後我們才發現錯誤。」？","options":["Only after the vote did we spot the error.","Even before the vote we had spotted the error."],"answers":["Only after the vote did we spot the error."],"explanation":"第一種意思是「直到投票後我們才發現錯誤。」，另一種是「投票之前我們就發現了錯誤。」。Only after 加時間事件置首，主句才倒裝，after 內仍用一般語序。普通 after 只交代事件順序。"},{"id":"complete-form","type":"fill","prompt":"她走後我才意識到她是誰。\\n請從「did I realise／I realised」選出合適寫法，只填空格。\\nOnly after she left ___ who she was.","answers":["did I realise"],"explanation":"Only after 加時間事件置首，主句才倒裝，after 內仍用一般語序。普通 after 只交代事件順序。 完整寫法是「Only after she left did I realise who she was.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nOnly after the audit ___.","options":["could we sign","we could sign"],"answers":["could we sign"],"explanation":"Only after 加時間事件置首，主句才倒裝，after 內仍用一般語序。普通 after 只交代事件順序。 完整寫法是「Only after the audit could we sign.」。"},{"id":"transfer","type":"choice","prompt":"把「只有等到所有訪談做完，我們才會分析結果」寫進研究計畫。","options":["Only after will we finish the interviews we analyse the results.","Only after we finish the interviews will we analyse the results."],"answers":["Only after we finish the interviews will we analyse the results."],"explanation":"Only after 加時間事件置首，主句才倒裝，after 內仍用一般語序。普通 after 只交代事件順序。 此處要表達的意思對應「Only after we finish the interviews will we analyse the results.」。"}]},{"language":"en","id":"not-until-cleft","title":"It was not until…that 聚焦時間","explanation":["CEFR C1 ｜ 使用頻率：中","It was not until X that… 強調直到 X 才發生；that 後用一般陳述語序。Not until X 起句則需倒裝主句。","比較「It wasn\'t until Friday that the grant arrived.」（直到週五補助才入帳。）和「The grant had arrived by Friday.」（到週五為止補助已入帳。）。","常見誤用：It wasn\'t until May than we found a venue.　修正：It wasn\'t until May that we found a venue."],"examples":[{"text":"It wasn\'t until Friday that the grant arrived.","zh":"直到週五補助才入帳。"},{"text":"The grant had arrived by Friday.","zh":"到週五為止補助已入帳。"},{"text":"It wasn\'t until May that we found a venue.","zh":"直到五月才找到場地。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「直到週五補助才入帳。」？","options":["It wasn\'t until Friday that the grant arrived.","The grant had arrived by Friday."],"answers":["It wasn\'t until Friday that the grant arrived."],"explanation":"第一種意思是「直到週五補助才入帳。」，另一種是「到週五為止補助已入帳。」。It was not until X that… 強調直到 X 才發生；that 後用一般陳述語序。Not until X 起句則需倒裝主句。"},{"id":"complete-form","type":"fill","prompt":"直到五月才找到場地。\\n請從「than／that」選出合適寫法，只填空格。\\nIt wasn\'t until May ___ we found a venue.","answers":["that"],"explanation":"It was not until X that… 強調直到 X 才發生；that 後用一般陳述語序。Not until X 起句則需倒裝主句。 完整寫法是「It wasn\'t until May that we found a venue.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nIt wasn\'t until noon that ___.","options":["they replied","did they reply"],"answers":["they replied"],"explanation":"It was not until X that… 強調直到 X 才發生；that 後用一般陳述語序。Not until X 起句則需倒裝主句。 完整寫法是「It wasn\'t until noon that they replied.」。"},{"id":"transfer","type":"choice","prompt":"把焦點放在直到第二次訪談才出現反對意見。","options":["It wasn\'t until the second interview that someone objected.","It wasn\'t until the second interview did someone object."],"answers":["It wasn\'t until the second interview that someone objected."],"explanation":"It was not until X that… 強調直到 X 才發生；that 後用一般陳述語序。Not until X 起句則需倒裝主句。 此處要表達的意思對應「It wasn\'t until the second interview that someone objected.」。"}]},{"language":"en","id":"mixed-present-result","title":"過去的選擇如何影響現在","explanation":["CEFR C1 ｜ 使用頻率：中","if 加過去完成式指錯過的條件，would 加原形描述它對現在的影響。結果時間可由 now 點明。","比較「If we\'d kept the receipt, we\'d have proof now.」（若留著收據，現在就有證明。）和「If we\'d kept the receipt, we\'d have claimed the refund yesterday.」（若留著收據，昨天就會申請退款。）。","常見誤用：If we\'d renewed the pass, it would still been valid.　修正：If we\'d renewed the pass, it would still be valid."],"examples":[{"text":"If we\'d kept the receipt, we\'d have proof now.","zh":"若留著收據，現在就有證明。"},{"text":"If we\'d kept the receipt, we\'d have claimed the refund yesterday.","zh":"若留著收據，昨天就會申請退款。"},{"text":"If we\'d renewed the pass, it would still be valid.","zh":"若有續卡，它現在就還有效。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「若留著收據，現在就有證明。」？","options":["If we\'d kept the receipt, we\'d have claimed the refund yesterday.","If we\'d kept the receipt, we\'d have proof now."],"answers":["If we\'d kept the receipt, we\'d have proof now."],"explanation":"第一種意思是「若留著收據，現在就有證明。」，另一種是「若留著收據，昨天就會申請退款。」。if 加過去完成式指錯過的條件，would 加原形描述它對現在的影響。結果時間可由 now 點明。"},{"id":"complete-form","type":"fill","prompt":"若有續卡，它現在就還有效。\\n請從「be／been」選出合適寫法，只填空格。\\nIf we\'d renewed the pass, it would still ___ valid.","answers":["be"],"explanation":"if 加過去完成式指錯過的條件，would 加原形描述它對現在的影響。結果時間可由 now 點明。 完整寫法是「If we\'d renewed the pass, it would still be valid.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nIf I\'d saved the address, I\'d ___ where to go now.","options":["know","known"],"answers":["know"],"explanation":"if 加過去完成式指錯過的條件，would 加原形描述它對現在的影響。結果時間可由 now 點明。 完整寫法是「If I\'d saved the address, I\'d know where to go now.」。"},{"id":"transfer","type":"choice","prompt":"你去年沒備份名冊，現在沒有名單可以核對。","options":["If we back it up now, we\'ll check the names tomorrow.","Had we backed it up, we could check the names now."],"answers":["Had we backed it up, we could check the names now."],"explanation":"if 加過去完成式指錯過的條件，would 加原形描述它對現在的影響。結果時間可由 now 點明。 此處要表達的意思對應「Had we backed it up, we could check the names now.」。"}]},{"language":"en","id":"mixed-past-result","title":"長期特質如何解釋錯過的事","explanation":["CEFR C1 ｜ 使用頻率：中","用 if 加過去式描述一向存在的特質；若想說這項特質如何影響昨天的事，結果用 would have 加分詞。","比較「If I could drive, I\'d have collected the volunteers last night.」（如果我會開車，昨晚就會去接志工。）和「If I could drive, I\'d collect them tonight.」（如果我會開車，今晚就會去接他們。）。","常見誤用：If he lived nearby, he would have join us yesterday.　修正：If he lived nearby, he would have joined us yesterday."],"examples":[{"text":"If I could drive, I\'d have collected the volunteers last night.","zh":"如果我會開車，昨晚就會去接志工。"},{"text":"If I could drive, I\'d collect them tonight.","zh":"如果我會開車，今晚就會去接他們。"},{"text":"If he lived nearby, he would have joined us yesterday.","zh":"若他住得近，昨天就會加入我們。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「如果我會開車，昨晚就會去接志工。」？","options":["If I could drive, I\'d collect them tonight.","If I could drive, I\'d have collected the volunteers last night."],"answers":["If I could drive, I\'d have collected the volunteers last night."],"explanation":"第一種意思是「如果我會開車，昨晚就會去接志工。」，另一種是「如果我會開車，今晚就會去接他們。」。用 if 加過去式描述一向存在的特質；若想說這項特質如何影響昨天的事，結果用 would have 加分詞。"},{"id":"complete-form","type":"fill","prompt":"若他住得近，昨天就會加入我們。\\n請從「join／joined」選出合適寫法，只填空格。\\nIf he lived nearby, he would have ___ us yesterday.","answers":["joined"],"explanation":"用 if 加過去式描述一向存在的特質；若想說這項特質如何影響昨天的事，結果用 would have 加分詞。 完整寫法是「If he lived nearby, he would have joined us yesterday.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nIf I owned a van, I\'d have ___ there last week.","options":["driven","drove"],"answers":["driven"],"explanation":"用 if 加過去式描述一向存在的特質；若想說這項特質如何影響昨天的事，結果用 would have 加分詞。 完整寫法是「If I owned a van, I\'d have driven there last week.」。"},{"id":"transfer","type":"choice","prompt":"你一向不會開車；昨晚因此沒辦法接隊友。","options":["If I\'d picked them up, I\'d know how to drive now.","If I could drive, I\'d have picked them up."],"answers":["If I could drive, I\'d have picked them up."],"explanation":"用 if 加過去式描述一向存在的特質；若想說這項特質如何影響昨天的事，結果用 would have 加分詞。 此處要表達的意思對應「If I could drive, I\'d have picked them up.」。"}]},{"language":"en","id":"wish-regret","title":"用 wish 加過去完成式回顧遺憾","explanation":["CEFR C1 ｜ 使用頻率：中","wish 加 had 和分詞表達已無法更改的遺憾。wish 加簡單過去則常描述現在狀態。","比較「I wish I\'d asked for a receipt.」（真後悔當時沒索取收據。）和「I wish I had the receipt.」（真希望收據現在在我手上。）。","常見誤用：She wishes she\'d took notes.　修正：She wishes she\'d taken notes."],"examples":[{"text":"I wish I\'d asked for a receipt.","zh":"真後悔當時沒索取收據。"},{"text":"I wish I had the receipt.","zh":"真希望收據現在在我手上。"},{"text":"She wishes she\'d taken notes.","zh":"她後悔當時沒做筆記。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「真後悔當時沒索取收據。」？","options":["I wish I\'d asked for a receipt.","I wish I had the receipt."],"answers":["I wish I\'d asked for a receipt."],"explanation":"第一種意思是「真後悔當時沒索取收據。」，另一種是「真希望收據現在在我手上。」。wish 加 had 和分詞表達已無法更改的遺憾。wish 加簡單過去則常描述現在狀態。"},{"id":"complete-form","type":"fill","prompt":"她後悔當時沒做筆記。\\n請從「took／taken」選出合適寫法，只填空格。\\nShe wishes she\'d ___ notes.","answers":["taken"],"explanation":"wish 加 had 和分詞表達已無法更改的遺憾。wish 加簡單過去則常描述現在狀態。 完整寫法是「She wishes she\'d taken notes.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nI wish I\'d ___ the email.","options":["kept","keep"],"answers":["kept"],"explanation":"wish 加 had 和分詞表達已無法更改的遺憾。wish 加簡單過去則常描述現在狀態。 完整寫法是「I wish I\'d kept the email.」。"},{"id":"transfer","type":"choice","prompt":"面試結束後，你後悔沒有問實習何時開始。","options":["I wish they\'d asked me about my start date.","I wish I\'d asked about the start date."],"answers":["I wish I\'d asked about the start date."],"explanation":"wish 加 had 和分詞表達已無法更改的遺憾。wish 加簡單過去則常描述現在狀態。 此處要表達的意思對應「I wish I\'d asked about the start date.」。"}]},{"language":"en","id":"would-rather","title":"would rather 後面換主詞","explanation":["CEFR C1 ｜ 使用頻率：中","主詞相同，would rather 後直接接原形；希望別人去做則用另一主詞加過去式。","比較「I\'d rather leave early.」（我自己想早走。）和「I\'d rather you left early.」（我希望你早走。）。","常見誤用：I\'d rather she to come in person tomorrow.　修正：I\'d rather she came in person tomorrow."],"examples":[{"text":"I\'d rather leave early.","zh":"我自己想早走。"},{"text":"I\'d rather you left early.","zh":"我希望你早走。"},{"text":"I\'d rather she came in person tomorrow.","zh":"我希望她明天親自來。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我自己想早走。」？","options":["I\'d rather you left early.","I\'d rather leave early."],"answers":["I\'d rather leave early."],"explanation":"第一種意思是「我自己想早走。」，另一種是「我希望你早走。」。主詞相同，would rather 後直接接原形；希望別人去做則用另一主詞加過去式。"},{"id":"complete-form","type":"fill","prompt":"我希望她明天親自來。\\n請從「came／to come」選出合適寫法，只填空格。\\nI\'d rather she ___ in person tomorrow.","answers":["came"],"explanation":"主詞相同，would rather 後直接接原形；希望別人去做則用另一主詞加過去式。 完整寫法是「I\'d rather she came in person tomorrow.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nWe\'d rather they ___ the names private.","options":["to keep","kept"],"answers":["kept"],"explanation":"主詞相同，would rather 後直接接原形；希望別人去做則用另一主詞加過去式。 完整寫法是「We\'d rather they kept the names private.」。"},{"id":"transfer","type":"choice","prompt":"希望同學等你刪掉逐字稿中的名字再分享。","options":["I\'d rather you waited until I\'d removed the names.","I\'d rather wait until you\'d removed the names."],"answers":["I\'d rather you waited until I\'d removed the names."],"explanation":"主詞相同，would rather 後直接接原形；希望別人去做則用另一主詞加過去式。 此處要表達的意思對應「I\'d rather you waited until I\'d removed the names.」。"}]},{"language":"en","id":"mandative","title":"提案與要求中的原形虛擬式","explanation":["CEFR C1 ｜ 使用頻率：中","正式提議可用 recommend that 加主詞和原形，即使主詞是第三人稱單數。英式英文也常加 should。","比較「We recommend that each school appoint a representative.」（我們建議每校指派一位代表。）和「We note that each school appoints a representative.」（我們記錄到各校都會指派一位代表。）。","常見誤用：The motion requires that each vote to be recorded.　修正：The motion requires that each vote be recorded."],"examples":[{"text":"We recommend that each school appoint a representative.","zh":"我們建議每校指派一位代表。"},{"text":"We note that each school appoints a representative.","zh":"我們記錄到各校都會指派一位代表。"},{"text":"The motion requires that each vote be recorded.","zh":"提案要求每票都要留下紀錄。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我們建議每校指派一位代表。」？","options":["We note that each school appoints a representative.","We recommend that each school appoint a representative."],"answers":["We recommend that each school appoint a representative."],"explanation":"第一種意思是「我們建議每校指派一位代表。」，另一種是「我們記錄到各校都會指派一位代表。」。正式提議可用 recommend that 加主詞和原形，即使主詞是第三人稱單數。英式英文也常加 should。"},{"id":"complete-form","type":"fill","prompt":"提案要求每票都要留下紀錄。\\n請從「to be／be」選出合適寫法，只填空格。\\nThe motion requires that each vote ___ recorded.","answers":["be"],"explanation":"正式提議可用 recommend that 加主詞和原形，即使主詞是第三人稱單數。英式英文也常加 should。 完整寫法是「The motion requires that each vote be recorded.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nWe propose that the chair ___ the bids.","options":["review","to reviews"],"answers":["review"],"explanation":"正式提議可用 recommend that 加主詞和原形，即使主詞是第三人稱單數。英式英文也常加 should。 完整寫法是「We propose that the chair review the bids.」。"},{"id":"transfer","type":"choice","prompt":"提案要求每一票都記錄下來。用原形虛擬式。","options":["We propose that every vote be recorded.","We confirm that every vote was recorded."],"answers":["We propose that every vote be recorded."],"explanation":"正式提議可用 recommend that 加主詞和原形，即使主詞是第三人稱單數。英式英文也常加 should。 此處要表達的意思對應「We propose that every vote be recorded.」。"}]},{"language":"en","id":"neednt-have","title":"needn\'t have done 與不必要的行動","explanation":["CEFR C1 ｜ 使用頻率：中","needn\'t have 加分詞表示確實做了，事後才知多餘。didn\'t need to 只說無此必要，要由後文判斷到底做了沒。","比較「We needn\'t have printed the slides.」（我們白印了投影片。）和「We didn\'t need to print the slides, so we didn\'t.」（我們無須印投影片，所以沒印。）。","常見誤用：I needn\'t have buy a ticket; entry was free.　修正：I needn\'t have bought a ticket; entry was free."],"examples":[{"text":"We needn\'t have printed the slides.","zh":"我們白印了投影片。"},{"text":"We didn\'t need to print the slides, so we didn\'t.","zh":"我們無須印投影片，所以沒印。"},{"text":"I needn\'t have bought a ticket; entry was free.","zh":"我白買票了，本來就免費入場。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我們白印了投影片。」？","options":["We didn\'t need to print the slides, so we didn\'t.","We needn\'t have printed the slides."],"answers":["We needn\'t have printed the slides."],"explanation":"第一種意思是「我們白印了投影片。」，另一種是「我們無須印投影片，所以沒印。」。needn\'t have 加分詞表示確實做了，事後才知多餘。didn\'t need to 只說無此必要，要由後文判斷到底做了沒。"},{"id":"complete-form","type":"fill","prompt":"我白買票了，本來就免費入場。\\n請從「bought／buy」選出合適寫法，只填空格。\\nI needn\'t have ___ a ticket; entry was free.","answers":["bought"],"explanation":"needn\'t have 加分詞表示確實做了，事後才知多餘。didn\'t need to 只說無此必要，要由後文判斷到底做了沒。 完整寫法是「I needn\'t have bought a ticket; entry was free.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nShe needn\'t have ___ a second letter.","options":["wrote","written"],"answers":["written"],"explanation":"needn\'t have 加分詞表示確實做了，事後才知多餘。didn\'t need to 只說無此必要，要由後文判斷到底做了沒。 完整寫法是「She needn\'t have written a second letter.」。"},{"id":"transfer","type":"choice","prompt":"你印了三十份投影片，到場才知道大家都有平板。","options":["I didn\'t print anything because everyone had a tablet.","I needn\'t have printed thirty copies."],"answers":["I needn\'t have printed thirty copies."],"explanation":"needn\'t have 加分詞表示確實做了，事後才知多餘。didn\'t need to 只說無此必要，要由後文判斷到底做了沒。 此處要表達的意思對應「I needn\'t have printed thirty copies.」。"}]},{"language":"en","id":"was-to-have","title":"was to have done 與落空的安排","explanation":["CEFR C1 ｜ 使用頻率：低","回顧落空的安排，用 was 或 were to have 加分詞。ended up doing 則說最後實際發生了什麼。","比較「I was to have sung last, but the concert was cancelled.」（我原定壓軸演唱，但音樂會取消了。）和「I ended up singing last.」（最後是我壓軸演唱。）。","常見誤用：We were to have sign on Friday, but the office closed.　修正：We were to have signed on Friday, but the office closed."],"examples":[{"text":"I was to have sung last, but the concert was cancelled.","zh":"我原定壓軸演唱，但音樂會取消了。"},{"text":"I ended up singing last.","zh":"最後是我壓軸演唱。"},{"text":"We were to have signed on Friday, but the office closed.","zh":"我們本來週五要簽，但辦公室關門了。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我原定壓軸演唱，但音樂會取消了。」？","options":["I was to have sung last, but the concert was cancelled.","I ended up singing last."],"answers":["I was to have sung last, but the concert was cancelled."],"explanation":"第一種意思是「我原定壓軸演唱，但音樂會取消了。」，另一種是「最後是我壓軸演唱。」。回顧落空的安排，用 was 或 were to have 加分詞。ended up doing 則說最後實際發生了什麼。"},{"id":"complete-form","type":"fill","prompt":"我們本來週五要簽，但辦公室關門了。\\n請從「sign／signed」選出合適寫法，只填空格。\\nWe were to have ___ on Friday, but the office closed.","answers":["signed"],"explanation":"回顧落空的安排，用 was 或 were to have 加分詞。ended up doing 則說最後實際發生了什麼。 完整寫法是「We were to have signed on Friday, but the office closed.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe pilot was to have ___ yesterday.","options":["ended","end"],"answers":["ended"],"explanation":"回顧落空的安排，用 was 或 were to have 加分詞。ended up doing 則說最後實際發生了什麼。 完整寫法是「The pilot was to have ended yesterday.」。"},{"id":"transfer","type":"choice","prompt":"排程表寫你壓軸，但臨時取消了。","options":["I was to have performed last.","I ended up performing last."],"answers":["I was to have performed last."],"explanation":"回顧落空的安排，用 was 或 were to have 加分詞。ended up doing 則說最後實際發生了什麼。 此處要表達的意思對應「I was to have performed last.」。"}]},{"language":"en","id":"ongoing-passive","title":"進行中的被動與已完成的被動","explanation":["CEFR B2 ｜ 使用頻率：高","be 加 being 加分詞把處理中的東西放在主詞位置。完成式被動強調已辦妥，對追蹤行政進度尤其重要。","比較「My application is being assessed.」（我的申請正在審查。）和「My application has been assessed.」（我的申請已經審查過了。）。","常見誤用：The boiler is being replace today.　修正：The boiler is being replaced today."],"examples":[{"text":"My application is being assessed.","zh":"我的申請正在審查。"},{"text":"My application has been assessed.","zh":"我的申請已經審查過了。"},{"text":"The boiler is being replaced today.","zh":"鍋爐今天正在更換。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我的申請正在審查。」？","options":["My application has been assessed.","My application is being assessed."],"answers":["My application is being assessed."],"explanation":"第一種意思是「我的申請正在審查。」，另一種是「我的申請已經審查過了。」。be 加 being 加分詞把處理中的東西放在主詞位置。完成式被動強調已辦妥，對追蹤行政進度尤其重要。"},{"id":"complete-form","type":"fill","prompt":"鍋爐今天正在更換。\\n請從「replaced／replace」選出合適寫法，只填空格。\\nThe boiler is being ___ today.","answers":["replaced"],"explanation":"be 加 being 加分詞把處理中的東西放在主詞位置。完成式被動強調已辦妥，對追蹤行政進度尤其重要。 完整寫法是「The boiler is being replaced today.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe recordings are being ___.","options":["checked","checking"],"answers":["checked"],"explanation":"be 加 being 加分詞把處理中的東西放在主詞位置。完成式被動強調已辦妥，對追蹤行政進度尤其重要。 完整寫法是「The recordings are being checked.」。"},{"id":"transfer","type":"choice","prompt":"辦公室說案件審到一半。","options":["My file has already been reviewed in full.","My file is still being reviewed."],"answers":["My file is still being reviewed."],"explanation":"be 加 being 加分詞把處理中的東西放在主詞位置。完成式被動強調已辦妥，對追蹤行政進度尤其重要。 此處要表達的意思對應「My file is still being reviewed.」。"}]},{"language":"en","id":"reduced-relative","title":"過去分詞片語縮短被動關係子句","explanation":["CEFR C1 ｜ 使用頻率：中","名詞後的過去分詞片語可縮短被動關係子句；現在分詞則常描述該名詞主動做的事。","比較「The volunteers interviewed yesterday speak Thai.」（昨天受訪的志工會泰語。）和「The volunteers interviewing us speak Thai.」（訪問我們的志工會泰語。）。","常見誤用：The figures quote in the email exclude tax.　修正：The figures quoted in the email exclude tax."],"examples":[{"text":"The volunteers interviewed yesterday speak Thai.","zh":"昨天受訪的志工會泰語。"},{"text":"The volunteers interviewing us speak Thai.","zh":"訪問我們的志工會泰語。"},{"text":"The figures quoted in the email exclude tax.","zh":"信中引用的數字不含稅。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「昨天受訪的志工會泰語。」？","options":["The volunteers interviewing us speak Thai.","The volunteers interviewed yesterday speak Thai."],"answers":["The volunteers interviewed yesterday speak Thai."],"explanation":"第一種意思是「昨天受訪的志工會泰語。」，另一種是「訪問我們的志工會泰語。」。名詞後的過去分詞片語可縮短被動關係子句；現在分詞則常描述該名詞主動做的事。"},{"id":"complete-form","type":"fill","prompt":"信中引用的數字不含稅。\\n請從「quote／quoted」選出合適寫法，只填空格。\\nThe figures ___ in the email exclude tax.","answers":["quoted"],"explanation":"名詞後的過去分詞片語可縮短被動關係子句；現在分詞則常描述該名詞主動做的事。 完整寫法是「The figures quoted in the email exclude tax.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe forms ___ yesterday are incomplete.","options":["submit","submitted"],"answers":["submitted"],"explanation":"名詞後的過去分詞片語可縮短被動關係子句；現在分詞則常描述該名詞主動做的事。 完整寫法是「The forms submitted yesterday are incomplete.」。"},{"id":"transfer","type":"choice","prompt":"問卷清單只列昨天收到的表格。","options":["the staff receiving forms yesterday","the forms received yesterday"],"answers":["the forms received yesterday"],"explanation":"名詞後的過去分詞片語可縮短被動關係子句；現在分詞則常描述該名詞主動做的事。 此處要表達的意思對應「the forms received yesterday」。"}]},{"language":"en","id":"whatever","title":"whatever 與不受結果影響的承諾","explanation":["CEFR C1 ｜ 使用頻率：中","whatever 加子句表示任何結果都不影響主句。only if 則把承諾限縮到特定結果。","比較「Whatever the pilot shows, we\'ll publish the report.」（無論試辦結果如何，我們都會公布報告。）和「We\'ll publish the report only if the pilot succeeds.」（只有試辦成功才會公布報告。）。","常見誤用：Which happens, we\'ll cover your fare.　修正：Whatever happens, we\'ll cover your fare."],"examples":[{"text":"Whatever the pilot shows, we\'ll publish the report.","zh":"無論試辦結果如何，我們都會公布報告。"},{"text":"We\'ll publish the report only if the pilot succeeds.","zh":"只有試辦成功才會公布報告。"},{"text":"Whatever happens, we\'ll cover your fare.","zh":"不管怎樣，我們都會付你的車資。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「無論試辦結果如何，我們都會公布報告。」？","options":["Whatever the pilot shows, we\'ll publish the report.","We\'ll publish the report only if the pilot succeeds."],"answers":["Whatever the pilot shows, we\'ll publish the report."],"explanation":"第一種意思是「無論試辦結果如何，我們都會公布報告。」，另一種是「只有試辦成功才會公布報告。」。whatever 加子句表示任何結果都不影響主句。only if 則把承諾限縮到特定結果。"},{"id":"complete-form","type":"fill","prompt":"不管怎樣，我們都會付你的車資。\\n請從「Whatever／Which」選出合適寫法，只填空格。\\n___ happens, we\'ll cover your fare.","answers":["Whatever"],"explanation":"whatever 加子句表示任何結果都不影響主句。only if 則把承諾限縮到特定結果。 完整寫法是「Whatever happens, we\'ll
