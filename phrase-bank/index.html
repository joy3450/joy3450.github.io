cover your fare.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\n___ they decide, the venue is booked.","options":["Which","Whatever"],"answers":["Whatever"],"explanation":"whatever 加子句表示任何結果都不影響主句。only if 則把承諾限縮到特定結果。 完整寫法是「Whatever they decide, the venue is booked.」。"},{"id":"transfer","type":"choice","prompt":"你保證試辦結果好壞都會告訴學校。","options":["Whatever we find, we\'ll send the report.","If the pilot succeeds, we\'ll send the report."],"answers":["Whatever we find, we\'ll send the report."],"explanation":"whatever 加子句表示任何結果都不影響主句。only if 則把承諾限縮到特定結果。 此處要表達的意思對應「Whatever we find, we\'ll send the report.」。"}]},{"language":"en","id":"lest","title":"lest 引出要避免的結果","explanation":["CEFR C1 ｜ 使用頻率：低","正式寫作以 lest 加主詞和原形或 should 加原形，表示希望預防的事。so that…can 則表示想促成的事。","比較「We hid the names lest reviewers identify the applicants.」（我們隱去姓名，以免評審認出申請人。）和「We listed the names so that reviewers could identify the applicants.」（我們列出姓名，方便評審辨認申請人。）。","常見誤用：She wrote it down lest she should forgot the address.　修正：She wrote it down lest she should forget the address."],"examples":[{"text":"We hid the names lest reviewers identify the applicants.","zh":"我們隱去姓名，以免評審認出申請人。"},{"text":"We listed the names so that reviewers could identify the applicants.","zh":"我們列出姓名，方便評審辨認申請人。"},{"text":"She wrote it down lest she should forget the address.","zh":"她寫下地址以免忘記。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我們隱去姓名，以免評審認出申請人。」？","options":["We hid the names lest reviewers identify the applicants.","We listed the names so that reviewers could identify the applicants."],"answers":["We hid the names lest reviewers identify the applicants."],"explanation":"第一種意思是「我們隱去姓名，以免評審認出申請人。」，另一種是「我們列出姓名，方便評審辨認申請人。」。正式寫作以 lest 加主詞和原形或 should 加原形，表示希望預防的事。so that…can 則表示想促成的事。"},{"id":"complete-form","type":"fill","prompt":"她寫下地址以免忘記。\\n請從「forget／forgot」選出合適寫法，只填空格。\\nShe wrote it down lest she should ___ the address.","answers":["forget"],"explanation":"正式寫作以 lest 加主詞和原形或 should 加原形，表示希望預防的事。so that…can 則表示想促成的事。 完整寫法是「She wrote it down lest she should forget the address.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nHe whispered lest he should ___ the others.","options":["wake","woke"],"answers":["wake"],"explanation":"正式寫作以 lest 加主詞和原形或 should 加原形，表示希望預防的事。so that…can 則表示想促成的事。 完整寫法是「He whispered lest he should wake the others.」。"},{"id":"transfer","type":"choice","prompt":"訪談稿隱去村名是為了預防受訪者被認出來。","options":["We removed the names once the speakers had been identified.","We removed the village names lest the speakers be identified."],"answers":["We removed the village names lest the speakers be identified."],"explanation":"正式寫作以 lest 加主詞和原形或 should 加原形，表示希望預防的事。so that…can 則表示想促成的事。 此處要表達的意思對應「We removed the village names lest the speakers be identified.」。"}]},{"language":"en","id":"irrealis-were","title":"as if 加 were 與非現實身分","explanation":["CEFR C1 ｜ 使用頻率：中","正式英語中 as if 加 were 可將已知不實的身分當作比擬。because 則通常把理由當成事實。","比較「She speaks as if she were the owner.」（她說話的口氣像是業主。）和「She speaks on behalf of the club because she is the owner.」（她代表俱樂部發言，因為她就是業主。）。","常見誤用：He treats rehearsal as if it be an exam.　修正：He treats rehearsal as if it were an exam."],"examples":[{"text":"She speaks as if she were the owner.","zh":"她說話的口氣像是業主。"},{"text":"She speaks on behalf of the club because she is the owner.","zh":"她代表俱樂部發言，因為她就是業主。"},{"text":"He treats rehearsal as if it were an exam.","zh":"他把排練看得像正式考試。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「她說話的口氣像是業主。」？","options":["She speaks as if she were the owner.","She speaks on behalf of the club because she is the owner."],"answers":["She speaks as if she were the owner."],"explanation":"第一種意思是「她說話的口氣像是業主。」，另一種是「她代表俱樂部發言，因為她就是業主。」。正式英語中 as if 加 were 可將已知不實的身分當作比擬。because 則通常把理由當成事實。"},{"id":"complete-form","type":"fill","prompt":"他把排練看得像正式考試。\\n請從「be／were」選出合適寫法，只填空格。\\nHe treats rehearsal as if it ___ an exam.","answers":["were"],"explanation":"正式英語中 as if 加 were 可將已知不實的身分當作比擬。because 則通常把理由當成事實。 完整寫法是「He treats rehearsal as if it were an exam.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThey speak as if approval ___ guaranteed.","options":["were","been"],"answers":["were"],"explanation":"正式英語中 as if 加 were 可將已知不實的身分當作比擬。because 則通常把理由當成事實。 完整寫法是「They speak as if approval were guaranteed.」。"},{"id":"transfer","type":"choice","prompt":"同學把一項建議講得像已生效的規定。","options":["You describe it as if it were a binding rule.","You say it is binding because it has already been adopted."],"answers":["You describe it as if it were a binding rule."],"explanation":"正式英語中 as if 加 were 可將已知不實的身分當作比擬。because 則通常把理由當成事實。 此處要表達的意思對應「You describe it as if it were a binding rule.」。"}]},{"language":"en","id":"high-time","title":"It\'s high time 與拖延已久的行動","explanation":["CEFR C1 ｜ 使用頻率：中","It\'s high time 加主詞加過去式，表明現在早該行動；不表示事情已經完成。","比較「It\'s high time the residence gave us a date.」（宿舍早該給我們確切日期了。）和「The residence gave us a date last week.」（宿舍上週給了我們日期。）。","常見誤用：It\'s time you to go home.　修正：It\'s time you went home."],"examples":[{"text":"It\'s high time the residence gave us a date.","zh":"宿舍早該給我們確切日期了。"},{"text":"The residence gave us a date last week.","zh":"宿舍上週給了我們日期。"},{"text":"It\'s time you went home.","zh":"你該回家了。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「宿舍早該給我們確切日期了。」？","options":["It\'s high time the residence gave us a date.","The residence gave us a date last week."],"answers":["It\'s high time the residence gave us a date."],"explanation":"第一種意思是「宿舍早該給我們確切日期了。」，另一種是「宿舍上週給了我們日期。」。It\'s high time 加主詞加過去式，表明現在早該行動；不表示事情已經完成。"},{"id":"complete-form","type":"fill","prompt":"你該回家了。\\n請從「to go／went」選出合適寫法，只填空格。\\nIt\'s time you ___ home.","answers":["went"],"explanation":"It\'s high time 加主詞加過去式，表明現在早該行動；不表示事情已經完成。 完整寫法是「It\'s time you went home.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nIt\'s high time they ___ the leak seriously.","options":["to take","took"],"answers":["took"],"explanation":"It\'s high time 加主詞加過去式，表明現在早該行動；不表示事情已經完成。 完整寫法是「It\'s high time they took the leak seriously.」。"},{"id":"transfer","type":"choice","prompt":"等宿舍修熱水已經三週，你想催他們改善。","options":["The residence took action a long time ago.","It\'s high time the residence took action."],"answers":["It\'s high time the residence took action."],"explanation":"It\'s high time 加主詞加過去式，表明現在早該行動；不表示事情已經完成。 此處要表達的意思對應「It\'s high time the residence took action.」。"}]},{"language":"en","id":"what-cleft","title":"What…is 分裂句與焦點","explanation":["CEFR C1 ｜ 使用頻率：中","用 What 加子句先界定問題，再以 be 接真正焦點。改動 what 子句會換掉要解決的問題。","比較「What we need is a testable hypothesis.」（我們需要的是一個可驗證的假設。）和「What the hypothesis needs is a test group.」（這個假設需要的是測試組。）。","常見誤用：What surprised me it was the silence after the vote.　修正：What surprised me was the silence after the vote."],"examples":[{"text":"What we need is a testable hypothesis.","zh":"我們需要的是一個可驗證的假設。"},{"text":"What the hypothesis needs is a test group.","zh":"這個假設需要的是測試組。"},{"text":"What surprised me was the silence after the vote.","zh":"讓我意外的是投票後的一片沉默。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我們需要的是一個可驗證的假設。」？","options":["What we need is a testable hypothesis.","What the hypothesis needs is a test group."],"answers":["What we need is a testable hypothesis."],"explanation":"第一種意思是「我們需要的是一個可驗證的假設。」，另一種是「這個假設需要的是測試組。」。用 What 加子句先界定問題，再以 be 接真正焦點。改動 what 子句會換掉要解決的問題。"},{"id":"complete-form","type":"fill","prompt":"讓我意外的是投票後的一片沉默。\\n請從「was／it was」選出合適寫法，只填空格。\\nWhat surprised me ___ the silence after the vote.","answers":["was"],"explanation":"用 What 加子句先界定問題，再以 be 接真正焦點。改動 what 子句會換掉要解決的問題。 完整寫法是「What surprised me was the silence after the vote.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nWhat the team lacks ___ a driver.","options":["it is","is"],"answers":["is"],"explanation":"用 What 加子句先界定問題，再以 be 接真正焦點。改動 what 子句會換掉要解決的問題。 完整寫法是「What the team lacks is a driver.」。"},{"id":"transfer","type":"choice","prompt":"你要把焦點從「錢不夠」拉回「缺少可靠證據」。","options":["What we\'re short of is reliable evidence.","What the evidence shows is a shortage of money."],"answers":["What we\'re short of is reliable evidence."],"explanation":"用 What 加子句先界定問題，再以 be 接真正焦點。改動 what 子句會換掉要解決的問題。 此處要表達的意思對應「What we\'re short of is reliable evidence.」。"}]},{"language":"en","id":"no-sooner","title":"No sooner…than 的時間倒裝","explanation":["CEFR C1 ｜ 使用頻率：中","no sooner 置首時常用 had 倒裝，第二件事由 than 接上，強調幾乎沒有間隔。long before 則拉長間隔。","比較「No sooner had the engineer left than the water ran cold.」（師傅前腳才走，水就冷了。）和「The water ran cold long before the engineer left.」（水早在師傅離開前就冷了。）。","常見誤用：No sooner had the doors opened as the queue began to move.　修正：No sooner had the doors opened than the queue began to move."],"examples":[{"text":"No sooner had the engineer left than the water ran cold.","zh":"師傅前腳才走，水就冷了。"},{"text":"The water ran cold long before the engineer left.","zh":"水早在師傅離開前就冷了。"},{"text":"No sooner had the doors opened than the queue began to move.","zh":"門才打開，隊伍就動了。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「師傅前腳才走，水就冷了。」？","options":["The water ran cold long before the engineer left.","No sooner had the engineer left than the water ran cold."],"answers":["No sooner had the engineer left than the water ran cold."],"explanation":"第一種意思是「師傅前腳才走，水就冷了。」，另一種是「水早在師傅離開前就冷了。」。no sooner 置首時常用 had 倒裝，第二件事由 than 接上，強調幾乎沒有間隔。long before 則拉長間隔。"},{"id":"complete-form","type":"fill","prompt":"門才打開，隊伍就動了。\\n請從「as／than」選出合適寫法，只填空格。\\nNo sooner had the doors opened ___ the queue began to move.","answers":["than"],"explanation":"no sooner 置首時常用 had 倒裝，第二件事由 than 接上，強調幾乎沒有間隔。long before 則拉長間隔。 完整寫法是「No sooner had the doors opened than the queue began to move.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nNo sooner had we signed ___ the venue changed hands.","options":["when","than"],"answers":["than"],"explanation":"no sooner 置首時常用 had 倒裝，第二件事由 than 接上，強調幾乎沒有間隔。long before 則拉長間隔。 完整寫法是「No sooner had we signed than the venue changed hands.」。"},{"id":"transfer","type":"choice","prompt":"想說車門前腳才關上，乘客就發現包包留在車外。","options":["No sooner had the doors shut than the passenger noticed the missing bag.","The passenger noticed the missing bag long before the doors shut."],"answers":["No sooner had the doors shut than the passenger noticed the missing bag."],"explanation":"no sooner 置首時常用 had 倒裝，第二件事由 than 接上，強調幾乎沒有間隔。long before 則拉長間隔。 此處要表達的意思對應「No sooner had the doors shut than the passenger noticed the missing bag.」。"}]},{"language":"en","id":"scarcely","title":"scarcely any 與近乎為零的數量","explanation":["CEFR C1 ｜ 使用頻率：中","scarcely any 或 scarcely anyone 指數量接近零，仍容許例外。none 則排除全部。","比較「Scarcely anyone mentioned the fare.」（幾乎沒人提到票價。）和「Nobody mentioned the fare.」（完全沒人提到票價。）。","常見誤用：There was scarcely none evidence of improvement.　修正：There was scarcely any evidence of improvement."],"examples":[{"text":"Scarcely anyone mentioned the fare.","zh":"幾乎沒人提到票價。"},{"text":"Nobody mentioned the fare.","zh":"完全沒人提到票價。"},{"text":"There was scarcely any evidence of improvement.","zh":"幾乎沒有改善的證據。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「幾乎沒人提到票價。」？","options":["Nobody mentioned the fare.","Scarcely anyone mentioned the fare."],"answers":["Scarcely anyone mentioned the fare."],"explanation":"第一種意思是「幾乎沒人提到票價。」，另一種是「完全沒人提到票價。」。scarcely any 或 scarcely anyone 指數量接近零，仍容許例外。none 則排除全部。"},{"id":"complete-form","type":"fill","prompt":"幾乎沒有改善的證據。\\n請從「any／none」選出合適寫法，只填空格。\\nThere was scarcely ___ evidence of improvement.","answers":["any"],"explanation":"scarcely any 或 scarcely anyone 指數量接近零，仍容許例外。none 則排除全部。 完整寫法是「There was scarcely any evidence of improvement.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nScarcely ___ challenged the figures.","options":["no one","anyone"],"answers":["anyone"],"explanation":"scarcely any 或 scarcely anyone 指數量接近零，仍容許例外。none 則排除全部。 完整寫法是「Scarcely anyone challenged the figures.」。"},{"id":"transfer","type":"choice","prompt":"30 份訪談有一人提到交通費。哪句摘要誠實保留這一例？","options":["Scarcely anyone mentioned travel costs.","No one whatsoever mentioned travel costs."],"answers":["Scarcely anyone mentioned travel costs."],"explanation":"scarcely any 或 scarcely anyone 指數量接近零，仍容許例外。none 則排除全部。 此處要表達的意思對應「Scarcely anyone mentioned travel costs.」。"}]},{"language":"en","id":"not-that","title":"not that A, but that B 修正理由","explanation":["CEFR C1 ｜ 使用頻率：中","not that A, but that B 排除一個推論後提供更準確的理由。not only A but also B 則接受兩者。","比較「It\'s not that I object, but that I\'d like time to read it.」（我想花點時間讀，並沒有反對。）和「I object, and I\'d also like time to read it.」（我持反對意見，也想花時間讀。）。","常見誤用：The issue is not that demand fell, but also supply grew faster.　修正：The issue is not that demand fell, but that supply grew faster."],"examples":[{"text":"It\'s not that I object, but that I\'d like time to read it.","zh":"我想花點時間讀，並沒有反對。"},{"text":"I object, and I\'d also like time to read it.","zh":"我持反對意見，也想花時間讀。"},{"text":"The issue is not that demand fell, but that supply grew faster.","zh":"問題在於供給增長更快，並非需求下降。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我想花點時間讀，並沒有反對。」？","options":["I object, and I\'d also like time to read it.","It\'s not that I object, but that I\'d like time to read it."],"answers":["It\'s not that I object, but that I\'d like time to read it."],"explanation":"第一種意思是「我想花點時間讀，並沒有反對。」，另一種是「我持反對意見，也想花時間讀。」。not that A, but that B 排除一個推論後提供更準確的理由。not only A but also B 則接受兩者。"},{"id":"complete-form","type":"fill","prompt":"問題在於供給增長更快，並非需求下降。\\n請從「but that／but also」選出合適寫法，只填空格。\\nThe issue is not that demand fell, ___ supply grew faster.","answers":["but that"],"explanation":"not that A, but that B 排除一個推論後提供更準確的理由。not only A but also B 則接受兩者。 完整寫法是「The issue is not that demand fell, but that supply grew faster.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nIt\'s not that we lack data, ___ the data are biased.","options":["but that","but also"],"answers":["but that"],"explanation":"not that A, but that B 排除一個推論後提供更準確的理由。not only A but also B 則接受兩者。 完整寫法是「It\'s not that we lack data, but that the data are biased.」。"},{"id":"transfer","type":"choice","prompt":"你贊成匿名，但檔名還有受訪者姓名。","options":["It\'s not that I oppose anonymity, but that the filenames identify people.","I object both to anonymity and to the filenames."],"answers":["It\'s not that I oppose anonymity, but that the filenames identify people."],"explanation":"not that A, but that B 排除一個推論後提供更準確的理由。not only A but also B 則接受兩者。 此處要表達的意思對應「It\'s not that I oppose anonymity, but that the filenames identify people.」。"}]},{"language":"en","id":"what-little","title":"what little 與 what few 指僅有的全部","explanation":["CEFR C1 ｜ 使用頻率：低","what little 加不可數名詞指僅有的全部。a little of 則可只取其中一部分。可數複數對應 what few。","比較「We used what little fuel we had to deliver the books.」（我們把僅有的燃料全用來送書。）和「We used a little of our fuel to deliver the books.」（我們用了一小部分燃料送書。）。","常見誤用：They shared what few equipment they had.　修正：They shared what little equipment they had."],"examples":[{"text":"We used what little fuel we had to deliver the books.","zh":"我們把僅有的燃料全用來送書。"},{"text":"We used a little of our fuel to deliver the books.","zh":"我們用了一小部分燃料送書。"},{"text":"They shared what little equipment they had.","zh":"他們把僅有的一點器材拿出來共用。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我們把僅有的燃料全用來送書。」？","options":["We used what little fuel we had to deliver the books.","We used a little of our fuel to deliver the books."],"answers":["We used what little fuel we had to deliver the books."],"explanation":"第一種意思是「我們把僅有的燃料全用來送書。」，另一種是「我們用了一小部分燃料送書。」。what little 加不可數名詞指僅有的全部。a little of 則可只取其中一部分。可數複數對應 what few。"},{"id":"complete-form","type":"fill","prompt":"他們把僅有的一點器材拿出來共用。\\n請從「what few／what little」選出合適寫法，只填空格。\\nThey shared ___ equipment they had.","answers":["what little"],"explanation":"what little 加不可數名詞指僅有的全部。a little of 則可只取其中一部分。可數複數對應 what few。 完整寫法是「They shared what little equipment they had.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\n___ seats remained were behind a pillar.","options":["What few","What little"],"answers":["What few"],"explanation":"what little 加不可數名詞指僅有的全部。a little of 則可只取其中一部分。可數複數對應 what few。 完整寫法是「What few seats remained were behind a pillar.」。"},{"id":"transfer","type":"choice","prompt":"志工會把僅剩的一點現金全部拿來租車。","options":["We\'ll spend a little of our remaining cash on the van.","We\'ll spend what little cash remains on the van."],"answers":["We\'ll spend what little cash remains on the van."],"explanation":"what little 加不可數名詞指僅有的全部。a little of 則可只取其中一部分。可數複數對應 what few。 此處要表達的意思對應「We\'ll spend what little cash remains on the van.」。"}]},{"language":"en","id":"such-inversion","title":"Such was／were…that 的程度結果句","explanation":["CEFR C2 ｜ 使用頻率：低","Such was 加單數名詞或 Such were 加複數名詞，再以 that 說明程度造成的結果。主詞在動詞之後仍決定單複數。","比較「Such was the demand that we opened a second session.」（需求之大，讓我們加開一場。）和「Opening a second session created demand.」（加開第二場帶來了需求。）。","常見誤用：Such was the delays that the venue offered a refund.　修正：Such were the delays that the venue offered a refund."],"examples":[{"text":"Such was the demand that we opened a second session.","zh":"需求之大，讓我們加開一場。"},{"text":"Opening a second session created demand.","zh":"加開第二場帶來了需求。"},{"text":"Such were the delays that the venue offered a refund.","zh":"延誤嚴重到場地人員主動提出退款。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「需求之大，讓我們加開一場。」？","options":["Opening a second session created demand.","Such was the demand that we opened a second session."],"answers":["Such was the demand that we opened a second session."],"explanation":"第一種意思是「需求之大，讓我們加開一場。」，另一種是「加開第二場帶來了需求。」。Such was 加單數名詞或 Such were 加複數名詞，再以 that 說明程度造成的結果。主詞在動詞之後仍決定單複數。"},{"id":"complete-form","type":"fill","prompt":"延誤嚴重到場地人員主動提出退款。\\n請從「was／were」選出合適寫法，只填空格。\\nSuch ___ the delays that the venue offered a refund.","answers":["were"],"explanation":"Such was 加單數名詞或 Such were 加複數名詞，再以 that 說明程度造成的結果。主詞在動詞之後仍決定單複數。 完整寫法是「Such were the delays that the venue offered a refund.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nSuch ___ the pressure that checks were missed.","options":["was","were"],"answers":["was"],"explanation":"Such was 加單數名詞或 Such were 加複數名詞，再以 that 說明程度造成的結果。主詞在動詞之後仍決定單複數。 完整寫法是「Such was the pressure that checks were missed.」。"},{"id":"transfer","type":"choice","prompt":"報名踴躍，因此加開課程。","options":["Such was the effect of adding a class that people finally responded.","Such was the response that we added a class."],"answers":["Such was the response that we added a class."],"explanation":"Such was 加單數名詞或 Such were 加複數名詞，再以 that 說明程度造成的結果。主詞在動詞之後仍決定單複數。 此處要表達的意思對應「Such was the response that we added a class.」。"}]},{"language":"en","id":"so-inversion","title":"So 加形容詞置首的程度倒裝","explanation":["CEFR C2 ｜ 使用頻率：低","正式敘事將 so 加形容詞置首，再接 be 加主詞和 that 結果句。請區別形容的是原因還是結果。","比較「So slight was the margin that a recount was necessary.」（票差小到必須重新計票。）和「The recount made the margin smaller.」（重新計票讓票差縮小了。）。","常見誤用：So detailed the notes were that we could reconstruct the vote.　修正：So detailed were the notes that we could reconstruct the vote."],"examples":[{"text":"So slight was the margin that a recount was necessary.","zh":"票差小到必須重新計票。"},{"text":"The recount made the margin smaller.","zh":"重新計票讓票差縮小了。"},{"text":"So detailed were the notes that we could reconstruct the vote.","zh":"紀錄詳盡到足以重建表決過程。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「票差小到必須重新計票。」？","options":["So slight was the margin that a recount was necessary.","The recount made the margin smaller."],"answers":["So slight was the margin that a recount was necessary."],"explanation":"第一種意思是「票差小到必須重新計票。」，另一種是「重新計票讓票差縮小了。」。正式敘事將 so 加形容詞置首，再接 be 加主詞和 that 結果句。請區別形容的是原因還是結果。"},{"id":"complete-form","type":"fill","prompt":"紀錄詳盡到足以重建表決過程。\\n請從「were the notes／the notes were」選出合適寫法，只填空格。\\nSo detailed ___ that we could reconstruct the vote.","answers":["were the notes"],"explanation":"正式敘事將 so 加形容詞置首，再接 be 加主詞和 that 結果句。請區別形容的是原因還是結果。 完整寫法是「So detailed were the notes that we could reconstruct the vote.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nSo faint ___ that we missed a word.","options":["the signal was","was the signal"],"answers":["was the signal"],"explanation":"正式敘事將 so 加形容詞置首，再接 be 加主詞和 that 結果句。請區別形容的是原因還是結果。 完整寫法是「So faint was the signal that we missed a word.」。"},{"id":"transfer","type":"choice","prompt":"訊號太弱，大家漏聽第一句。","options":["So clear was the opening line that the weak signal hardly mattered.","So weak was the signal that we missed the opening line."],"answers":["So weak was the signal that we missed the opening line."],"explanation":"正式敘事將 so 加形容詞置首，再接 be 加主詞和 that 結果句。請區別形容的是原因還是結果。 此處要表達的意思對應「So weak was the signal that we missed the opening line.」。"}]},{"language":"en","id":"as-if-past","title":"as if 加過去完成式與證據強度","explanation":["CEFR C2 ｜ 使用頻率：中","as if 加過去完成式可將比擬的行動放在觀察之前。這是在描述外觀，並未證明對方真做過。","比較「He spoke as if he\'d seen the answers.」（他說得像是事先看過答案。）和「He spoke confidently because he\'d seen the answers.」（他說得有信心，是因為已看過答案。）。","常見誤用：The minutes read as if everyone had agree.　修正：The minutes read as if everyone had agreed."],"examples":[{"text":"He spoke as if he\'d seen the answers.","zh":"他說得像是事先看過答案。"},{"text":"He spoke confidently because he\'d seen the answers.","zh":"他說得有信心，是因為已看過答案。"},{"text":"The minutes read as if everyone had agreed.","zh":"紀錄寫得像是當時全員同意。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「他說得像是事先看過答案。」？","options":["He spoke as if he\'d seen the answers.","He spoke confidently because he\'d seen the answers."],"answers":["He spoke as if he\'d seen the answers."],"explanation":"第一種意思是「他說得像是事先看過答案。」，另一種是「他說得有信心，是因為已看過答案。」。as if 加過去完成式可將比擬的行動放在觀察之前。這是在描述外觀，並未證明對方真做過。"},{"id":"complete-form","type":"fill","prompt":"紀錄寫得像是當時全員同意。\\n請從「agreed／agree」選出合適寫法，只填空格。\\nThe minutes read as if everyone had ___.","answers":["agreed"],"explanation":"as if 加過去完成式可將比擬的行動放在觀察之前。這是在描述外觀，並未證明對方真做過。 完整寫法是「The minutes read as if everyone had agreed.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThey greeted me as if we\'d ___ each other for years.","options":["known","knew"],"answers":["known"],"explanation":"as if 加過去完成式可將比擬的行動放在觀察之前。這是在描述外觀，並未證明對方真做過。 完整寫法是「They greeted me as if we\'d known each other for years.」。"},{"id":"transfer","type":"choice","prompt":"你沒證據證明同學偷看答案，只猜他像是看過。","options":["He sounded as if he\'d read the answers beforehand.","He knew the answers because he\'d already read them."],"answers":["He sounded as if he\'d read the answers beforehand."],"explanation":"as if 加過去完成式可將比擬的行動放在觀察之前。這是在描述外觀，並未證明對方真做過。 此處要表達的意思對應「He sounded as if he\'d read the answers beforehand.」。"}]},{"language":"en","id":"but-for","title":"but for 壓縮反事實條件","explanation":["CEFR C2 ｜ 使用頻率：中","but for 加名詞片語拿掉一項實際存在的因素，主句推演少了它會怎樣。because of 陳述實際因果。","比較「But for the grant, we\'d have cancelled the trip.」（要不是有補助，我們就取消行程了。）和「Because of the grant, we cancelled the trip.」（我們因為這筆補助而取消行程。）。","常見誤用：But from her notes, the decision would still be a mystery.　修正：But for her notes, the decision would still be a mystery."],"examples":[{"text":"But for the grant, we\'d have cancelled the trip.","zh":"要不是有補助，我們就取消行程了。"},{"text":"Because of the grant, we cancelled the trip.","zh":"我們因為這筆補助而取消行程。"},{"text":"But for her notes, the decision would still be a mystery.","zh":"若非她的筆記，這項決定至今仍難以理解。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「要不是有補助，我們就取消行程了。」？","options":["Because of the grant, we cancelled the trip.","But for the grant, we\'d have cancelled the trip."],"answers":["But for the grant, we\'d have cancelled the trip."],"explanation":"第一種意思是「要不是有補助，我們就取消行程了。」，另一種是「我們因為這筆補助而取消行程。」。but for 加名詞片語拿掉一項實際存在的因素，主句推演少了它會怎樣。because of 陳述實際因果。"},{"id":"complete-form","type":"fill","prompt":"若非她的筆記，這項決定至今仍難以理解。\\n請從「from／for」選出合適寫法，只填空格。\\nBut ___ her notes, the decision would still be a mystery.","answers":["for"],"explanation":"but for 加名詞片語拿掉一項實際存在的因素，主句推演少了它會怎樣。because of 陳述實際因果。 完整寫法是「But for her notes, the decision would still be a mystery.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nBut ___ a spare key, we\'d have been locked out.","options":["for","from"],"answers":["for"],"explanation":"but for 加名詞片語拿掉一項實際存在的因素，主句推演少了它會怎樣。because of 陳述實際因果。 完整寫法是「But for a spare key, we\'d have been locked out.」。"},{"id":"transfer","type":"choice","prompt":"面試時想表明當地老師的協助是辦成活動的必要條件。","options":["But for the local teachers, the workshops would never have gone ahead.","But for the local teachers, the workshops would have gone ahead."],"answers":["But for the local teachers, the workshops would never have gone ahead."],"explanation":"but for 加名詞片語拿掉一項實際存在的因素，主句推演少了它會怎樣。because of 陳述實際因果。 此處要表達的意思對應「But for the local teachers, the workshops would never have gone ahead.」。"}]},{"language":"en","id":"except-that","title":"except that 引出唯一的保留","explanation":["CEFR C2 ｜ 使用頻率：中","要說兩者大致相同，只有一個完整事實構成例外，可用 except that 加子句。except for 直接接名詞。","比較「The forms are identical except that one asks for an address.」（表格相同，唯一差別是其中一份要填地址。）和「Both forms ask for an address.」（兩張表格都要求填地址。）。","常見誤用：The route works except for the last bus leaves early.　修正：The route works except that the last bus leaves early."],"examples":[{"text":"The forms are identical except that one asks for an address.","zh":"表格相同，唯一差別是其中一份要填地址。"},{"text":"Both forms ask for an address.","zh":"兩張表格都要求填地址。"},{"text":"The route works except that the last bus leaves early.","zh":"這條路線可行，唯獨末班車開得早。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「表格相同，唯一差別是其中一份要填地址。」？","options":["Both forms ask for an address.","The forms are identical except that one asks for an address."],"answers":["The forms are identical except that one asks for an address."],"explanation":"第一種意思是「表格相同，唯一差別是其中一份要填地址。」，另一種是「兩張表格都要求填地址。」。要說兩者大致相同，只有一個完整事實構成例外，可用 except that 加子句。except for 直接接名詞。"},{"id":"complete-form","type":"fill","prompt":"這條路線可行，唯獨末班車開得早。\\n請從「for／that」選出合適寫法，只填空格。\\nThe route works except ___ the last bus leaves early.","answers":["that"],"explanation":"要說兩者大致相同，只有一個完整事實構成例外，可用 except that 加子句。except for 直接接名詞。 完整寫法是「The route works except that the last bus leaves early.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nExcept ___ one missing stamp, the file is complete.","options":["that","for"],"answers":["for"],"explanation":"要說兩者大致相同，只有一個完整事實構成例外，可用 except that 加子句。except for 直接接名詞。 完整寫法是「Except for one missing stamp, the file is complete.」。"},{"id":"transfer","type":"choice","prompt":"只有第二份資料缺簽名，其他內容相同。","options":["The copies match except that the second lacks a signature.","The copies differ except that both lack a signature."],"answers":["The copies match except that the second lacks a signature."],"explanation":"要說兩者大致相同，只有一個完整事實構成例外，可用 except that 加子句。except for 直接接名詞。 此處要表達的意思對應「The copies match except that the second lacks a signature.」。"}]},{"language":"en","id":"far-from","title":"far from 加動名詞推翻預期","explanation":["CEFR C2 ｜ 使用頻率：中","Far from 加名詞或動名詞先點出落空的預期，主句才交代實際結果。兩個動作的主詞要接得上。","比較「Far from saving time, the form slowed registration down.」（表格非但沒省時間，還拖慢報到。）和「Far from slowing registration down, the form saved time.」（表格非但沒拖慢報到，還省了時間。）。","常見誤用：Far from settle the issue, the vote divided the team.　修正：Far from settling the issue, the vote divided the team."],"examples":[{"text":"Far from saving time, the form slowed registration down.","zh":"表格非但沒省時間，還拖慢報到。"},{"text":"Far from slowing registration down, the form saved time.","zh":"表格非但沒拖慢報到，還省了時間。"},{"text":"Far from settling the issue, the vote divided the team.","zh":"表決沒解決問題，反而造成團隊分裂。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「表格非但沒省時間，還拖慢報到。」？","options":["Far from slowing registration down, the form saved time.","Far from saving time, the form slowed registration down."],"answers":["Far from saving time, the form slowed registration down."],"explanation":"第一種意思是「表格非但沒省時間，還拖慢報到。」，另一種是「表格非但沒拖慢報到，還省了時間。」。Far from 加名詞或動名詞先點出落空的預期，主句才交代實際結果。兩個動作的主詞要接得上。"},{"id":"complete-form","type":"fill","prompt":"表決沒解決問題，反而造成團隊分裂。\\n請從「settle／settling」選出合適寫法，只填空格。\\nFar from ___ the issue, the vote divided the team.","answers":["settling"],"explanation":"Far from 加名詞或動名詞先點出落空的預期，主句才交代實際結果。兩個動作的主詞要接得上。 完整寫法是「Far from settling the issue, the vote divided the team.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nFar from ___ costs, the change added a fee.","options":["reducing","reduce"],"answers":["reducing"],"explanation":"Far from 加名詞或動名詞先點出落空的預期，主句才交代實際結果。兩個動作的主詞要接得上。 完整寫法是「Far from reducing costs, the change added a fee.」。"},{"id":"transfer","type":"choice","prompt":"改表格的預期是加速報到，結果卻更慢。","options":["Far from causing delays, the form sped things up.","Far from speeding things up, the form caused delays."],"answers":["Far from speeding things up, the form caused delays."],"explanation":"Far from 加名詞或動名詞先點出落空的預期，主句才交代實際結果。兩個動作的主詞要接得上。 此處要表達的意思對應「Far from speeding things up, the form caused delays.」。"}]},{"language":"en","id":"much-as","title":"much as 承認意願再設限","explanation":["CEFR C2 ｜ 使用頻率：中","Much as 加主詞動詞，承認意願或喜好，主句再說為何決定仍不同。as much as I can 則是盡可能地做。","比較「Much as I\'d like to help, I\'ll be away on Monday.」（我很想幫忙，不過週一人在外地。）和「I\'ll help as much as I can on Monday.」（我週一會盡力幫忙。）。","常見誤用：Much than we admire the plan, we cannot fund it.　修正：Much as we admire the plan, we cannot fund it."],"examples":[{"text":"Much as I\'d like to help, I\'ll be away on Monday.","zh":"我很想幫忙，不過週一人在外地。"},{"text":"I\'ll help as much as I can on Monday.","zh":"我週一會盡力幫忙。"},{"text":"Much as we admire the plan, we cannot fund it.","zh":"我們雖欣賞計畫，卻無法資助。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我很想幫忙，不過週一人在外地。」？","options":["Much as I\'d like to help, I\'ll be away on Monday.","I\'ll help as much as I can on Monday."],"answers":["Much as I\'d like to help, I\'ll be away on Monday."],"explanation":"第一種意思是「我很想幫忙，不過週一人在外地。」，另一種是「我週一會盡力幫忙。」。Much as 加主詞動詞，承認意願或喜好，主句再說為何決定仍不同。as much as I can 則是盡可能地做。"},{"id":"complete-form","type":"fill","prompt":"我們雖欣賞計畫，卻無法資助。\\n請從「as／than」選出合適寫法，只填空格。\\nMuch ___ we admire the plan, we cannot fund it.","answers":["as"],"explanation":"Much as 加主詞動詞，承認意願或喜好，主句再說為何決定仍不同。as much as I can 則是盡可能地做。 完整寫法是「Much as we admire the plan, we cannot fund it.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nMuch ___ I value speed, accuracy comes first.","options":["than","as"],"answers":["as"],"explanation":"Much as 加主詞動詞，承認意願或喜好，主句再說為何決定仍不同。as much as I can 則是盡可能地做。 完整寫法是「Much as I value speed, accuracy comes first.」。"},{"id":"transfer","type":"choice","prompt":"你確實希望參與，但週一不在巴黎。","options":["I\'ll join you on Monday for as long as I can.","Much as I\'d like to join you, I\'ll be away on Monday."],"answers":["Much as I\'d like to join you, I\'ll be away on Monday."],"explanation":"Much as 加主詞動詞，承認意願或喜好，主句再說為何決定仍不同。as much as I can 則是盡可能地做。 此處要表達的意思對應「Much as I\'d like to join you, I\'ll be away on Monday.」。"}]},{"language":"en","id":"be-that-as","title":"Be that as it may 承接不同意見","explanation":["CEFR C2 ｜ 使用頻率：低","固定讓步語 Be that as it may 暫且接受上文前提，接著提出依舊成立的判斷。That being so 則把前提當作推論依據。","比較「Be that as it may, the outlier is worth checking.」（即使如此，那筆異常值仍值得查核。）和「That being so, we can ignore the outlier.」（既然如此，我們可以忽略那筆異常值。）。","常見誤用：Be that as it must to, the deposit is due today.　修正：Be that as it may, the deposit is due today."],"examples":[{"text":"Be that as it may, the outlier is worth checking.","zh":"即使如此，那筆異常值仍值得查核。"},{"text":"That being so, we can ignore the outlier.","zh":"既然如此，我們可以忽略那筆異常值。"},{"text":"Be that as it may, the deposit is due today.","zh":"即使如此，押金今天依然到期。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「即使如此，那筆異常值仍值得查核。」？","options":["That being so, we can ignore the outlier.","Be that as it may, the outlier is worth checking."],"answers":["Be that as it may, the outlier is worth checking."],"explanation":"第一種意思是「即使如此，那筆異常值仍值得查核。」，另一種是「既然如此，我們可以忽略那筆異常值。」。固定讓步語 Be that as it may 暫且接受上文前提，接著提出依舊成立的判斷。That being so 則把前提當作推論依據。"},{"id":"complete-form","type":"fill","prompt":"即使如此，押金今天依然到期。\\n請從「may／must to」選出合適寫法，只填空格。\\nBe that as it ___, the deposit is due today.","answers":["may"],"explanation":"固定讓步語 Be that as it may 暫且接受上文前提，接著提出依舊成立的判斷。That being so 則把前提當作推論依據。 完整寫法是「Be that as it may, the deposit is due today.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\n___ that as it may, we need written consent.","options":["Be","Being"],"answers":["Be"],"explanation":"固定讓步語 Be that as it may 暫且接受上文前提，接著提出依舊成立的判斷。That being so 則把前提當作推論依據。 完整寫法是「Be that as it may, we need written consent.」。"},{"id":"transfer","type":"choice","prompt":"對方提醒樣本不大。你想承認這點，仍主張檢查異常值。","options":["That being so, we can dismiss the outlier.","Be that as it may, the outlier deserves a closer look."],"answers":["Be that as it may, the outlier deserves a closer look."],"explanation":"固定讓步語 Be that as it may 暫且接受上文前提，接著提出依舊成立的判斷。That being so 則把前提當作推論依據。 此處要表達的意思對應「Be that as it may, the outlier deserves a closer look.」。"}]},{"language":"en","id":"come-what-may","title":"come what may 表達無條件承諾","explanation":["CEFR C2 ｜ 使用頻率：低","come what may 可放句首或句尾，承諾涵蓋所有變故。provided 或 if possible 則為承諾設定條件。","比較「Come what may, I\'ll meet you at the station.」（不論發生什麼，我都會去車站接你。）和「I\'ll meet you at the station if possible.」（情況允許的話，我會去車站接你。）。","常見誤用：Come which may, we\'ll honour the agreement.　修正：Come what may, we\'ll honour the agreement."],"examples":[{"text":"Come what may, I\'ll meet you at the station.","zh":"不論發生什麼，我都會去車站接你。"},{"text":"I\'ll meet you at the station if possible.","zh":"情況允許的話，我會去車站接你。"},{"text":"Come what may, we\'ll honour the agreement.","zh":"無論如何，我們都會履行協議。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「不論發生什麼，我都會去車站接你。」？","options":["Come what may, I\'ll meet you at the station.","I\'ll meet you at the station if possible."],"answers":["Come what may, I\'ll meet you at the station."],"explanation":"第一種意思是「不論發生什麼，我都會去車站接你。」，另一種是「情況允許的話，我會去車站接你。」。come what may 可放句首或句尾，承諾涵蓋所有變故。provided 或 if possible 則為承諾設定條件。"},{"id":"complete-form","type":"fill","prompt":"無論如何，我們都會履行協議。\\n請從「what／which」選出合適寫法，只填空格。\\nCome ___ may, we\'ll honour the agreement.","answers":["what"],"explanation":"come what may 可放句首或句尾，承諾涵蓋所有變故。provided 或 if possible 則為承諾設定條件。 完整寫法是「Come what may, we\'ll honour the agreement.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nI\'ll send the file, come what ___.","options":["might to","may"],"answers":["may"],"explanation":"come what may 可放句首或句尾，承諾涵蓋所有變故。provided 或 if possible 則為承諾設定條件。 完整寫法是「I\'ll send the file, come what may.」。"},{"id":"transfer","type":"choice","prompt":"告訴學生即使火車誤點，你也會去車站接他。","options":["Come what may, I\'ll be there.","I\'ll be there provided the trains run on time."],"answers":["Come what may, I\'ll be there."],"explanation":"come what may 可放句首或句尾，承諾涵蓋所有變故。provided 或 if possible 則為承諾設定條件。 此處要表達的意思對應「Come what may, I\'ll be there.」。"}]},{"language":"en","id":"modal-progressive","title":"情態完成進行式推估當時的活動","explanation":["CEFR C2 ｜ 使用頻率：中","情態動詞加 have been 加 -ing 推測較早時間正在持續的活動；用完成式簡單分詞可改成推測已完成的結果。","比較「She may have been waiting at the other entrance.」（她當時可能正在另一個入口等。）和「She may have left through the other entrance.」（她可能已經從另一個入口離開了。）。","常見誤用：They must have been rehearsed when the alarm rang.　修正：They must have been rehearsing when the alarm rang."],"examples":[{"text":"She may have been waiting at the other entrance.","zh":"她當時可能正在另一個入口等。"},{"text":"She may have left through the other entrance.","zh":"她可能已經從另一個入口離開了。"},{"text":"They must have been rehearsing when the alarm rang.","zh":"警報響時他們想必正在排練。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「她當時可能正在另一個入口等。」？","options":["She may have been waiting at the other entrance.","She may have left through the other entrance."],"answers":["She may have been waiting at the other entrance."],"explanation":"第一種意思是「她當時可能正在另一個入口等。」，另一種是「她可能已經從另一個入口離開了。」。情態動詞加 have been 加 -ing 推測較早時間正在持續的活動；用完成式簡單分詞可改成推測已完成的結果。"},{"id":"complete-form","type":"fill","prompt":"警報響時他們想必正在排練。\\n請從「rehearsed／rehearsing」選出合適寫法，只填空格。\\nThey must have been ___ when the alarm rang.","answers":["rehearsing"],"explanation":"情態動詞加 have been 加 -ing 推測較早時間正在持續的活動；用完成式簡單分詞可改成推測已完成的結果。 完整寫法是「They must have been rehearsing when the alarm rang.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nHe could have been ___ when you knocked.","options":["recorded","recording"],"answers":["recording"],"explanation":"情態動詞加 have been 加 -ing 推測較早時間正在持續的活動；用完成式簡單分詞可改成推測已完成的結果。 完整寫法是「He could have been recording when you knocked.」。"},{"id":"transfer","type":"choice","prompt":"門禁紀錄不能證明排練已結束。你只想說保全巡樓時「可能還在排」。","options":["We must have stopped before security came round.","We may still have been rehearsing when security came round."],"answers":["We may still have been rehearsing when security came round."],"explanation":"情態動詞加 have been 加 -ing 推測較早時間正在持續的活動；用完成式簡單分詞可改成推測已完成的結果。 此處要表達的意思對應「We may still have been rehearsing when security came round.」。"}]},{"language":"en","id":"may-well","title":"may well 與 may as well","explanation":["CEFR C2 ｜ 使用頻率：中","may well 加原形表示推測相當合理；may as well 加原形提出「不如這麼做」的建議。","比較「They may well be waiting for your reference.」（他們很可能在等你的推薦信。）和「They may as well wait for your reference.」（他們不如等你的推薦信。）。","常見誤用：She might as good have missed the notice.　修正：She might well have missed the notice."],"examples":[{"text":"They may well be waiting for your reference.","zh":"他們很可能在等你的推薦信。"},{"text":"They may as well wait for your reference.","zh":"他們不如等你的推薦信。"},{"text":"She might well have missed the notice.","zh":"她很可能漏看了公告。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「他們很可能在等你的推薦信。」？","options":["They may as well wait for your reference.","They may well be waiting for your reference."],"answers":["They may well be waiting for your reference."],"explanation":"第一種意思是「他們很可能在等你的推薦信。」，另一種是「他們不如等你的推薦信。」。may well 加原形表示推測相當合理；may as well 加原形提出「不如這麼做」的建議。"},{"id":"complete-form","type":"fill","prompt":"她很可能漏看了公告。\\n請從「well／as good」選出合適寫法，只填空格。\\nShe might ___ have missed the notice.","answers":["well"],"explanation":"may well 加原形表示推測相當合理；may as well 加原形提出「不如這麼做」的建議。 完整寫法是「She might well have missed the notice.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nWe may ___ wait here; the office opens shortly.","options":["as good","as well"],"answers":["as well"],"explanation":"may well 加原形表示推測相當合理；may as well 加原形提出「不如這麼做」的建議。 完整寫法是「We may as well wait here; the office opens shortly.」。"},{"id":"transfer","type":"choice","prompt":"你認為宿舍很可能在等廠商報價。","options":["They may well be waiting for a quote.","They may as well wait for a quote."],"answers":["They may well be waiting for a quote."],"explanation":"may well 加原形表示推測相當合理；may as well 加原形提出「不如這麼做」的建議。 此處要表達的意思對應「They may well be waiting for a quote.」。"}]},{"language":"en","id":"scope-all","title":"not all 與 none 的否定範圍","explanation":["CEFR C2 ｜ 使用頻率：中","not all 只否定「全部都」，容許部分成立。none 或 no 加名詞排除每一個，所需證據較強。","比較「Not every room has a projector.」（並非每間教室都有投影機。）和「No room has a projector.」（每間教室都沒有投影機。）。","常見誤用：Four of the five replied, so no one replied.　修正：Four of the five replied, so not everyone replied."],"examples":[{"text":"Not every room has a projector.","zh":"並非每間教室都有投影機。"},{"text":"No room has a projector.","zh":"每間教室都沒有投影機。"},{"text":"Four of the five replied, so not everyone replied.","zh":"五人中四人回覆，所以並非全員回覆。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「並非每間教室都有投影機。」？","options":["No room has a projector.","Not every room has a projector."],"answers":["Not every room has a projector."],"explanation":"第一種意思是「並非每間教室都有投影機。」，另一種是「每間教室都沒有投影機。」。not all 只否定「全部都」，容許部分成立。none 或 no 加名詞排除每一個，所需證據較強。"},{"id":"complete-form","type":"fill","prompt":"五人中四人回覆，所以並非全員回覆。\\n請從「no one／not everyone」選出合適寫法，只填空格。\\nFour of the five replied, so ___ replied.","answers":["not everyone"],"explanation":"not all 只否定「全部都」，容許部分成立。none 或 no 加名詞排除每一個，所需證據較強。 完整寫法是「Four of the five replied, so not everyone replied.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nSome were signed and some weren\'t: ___ were signed.","options":["not all","none"],"answers":["not all"],"explanation":"not all 只否定「全部都」，容許部分成立。none 或 no 加名詞排除每一個，所需證據較強。 完整寫法是「Some were signed and some weren\'t: not all were signed.」。"},{"id":"transfer","type":"choice","prompt":"你只查出一份申請沒附收據。哪個結論已有證據？","options":["No application includes a receipt.","Not every application includes a receipt."],"answers":["Not every application includes a receipt."],"explanation":"not all 只否定「全部都」，容許部分成立。none 或 no 加名詞排除每一個，所需證據較強。 此處要表達的意思對應「Not every application includes a receipt.」。"}]},{"language":"en","id":"scope-only","title":"only 的位置與焦點範圍","explanation":["CEFR C2 ｜ 使用頻率：中","讓 only 緊靠被限制的成分，避免讀者猜測限制的是人、時間還是範圍。改位置時，句子可以仍正確但意思不同。","比較「Only Léa checked the budget.」（只有蕾雅核對了預算。）和「Léa checked only the budget.」（蕾雅只核對了預算。）。","常見誤用：The grant covers travel as well as meals; meals are excluded.　修正：The grant covers only travel; meals are excluded."],"examples":[{"text":"Only Léa checked the budget.","zh":"只有蕾雅核對了預算。"},{"text":"Léa checked only the budget.","zh":"蕾雅只核對了預算。"},{"text":"The grant covers only travel; meals are excluded.","zh":"補助只涵蓋交通，餐費除外。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「只有蕾雅核對了預算。」？","options":["Léa checked only the budget.","Only Léa checked the budget."],"answers":["Only Léa checked the budget."],"explanation":"第一種意思是「只有蕾雅核對了預算。」，另一種是「蕾雅只核對了預算。」。讓 only 緊靠被限制的成分，避免讀者猜測限制的是人、時間還是範圍。改位置時，句子可以仍正確但意思不同。"},{"id":"complete-form","type":"fill","prompt":"補助只涵蓋交通，餐費除外。\\n請從「only travel／travel as well as meals」選出合適寫法，只填空格。\\nThe grant covers ___; meals are excluded.","answers":["only travel"],"explanation":"讓 only 緊靠被限制的成分，避免讀者猜測限制的是人、時間還是範圍。改位置時，句子可以仍正確但意思不同。 完整寫法是「The grant covers only travel; meals are excluded.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nWe interviewed ___; no staff took part.","options":["only students","students as well as staff"],"answers":["only students"],"explanation":"讓 only 緊靠被限制的成分，避免讀者猜測限制的是人、時間還是範圍。改位置時，句子可以仍正確但意思不同。 完整寫法是「We interviewed only students; no staff took part.」。"},{"id":"transfer","type":"choice","prompt":"所有工作人員和學生都受訪了，但訪談週五才開始。","options":["We interviewed staff and students only after Thursday.","We interviewed only students after Thursday."],"answers":["We interviewed staff and students only after Thursday."],"explanation":"讓 only 緊靠被限制的成分，避免讀者猜測限制的是人、時間還是範圍。改位置時，句子可以仍正確但意思不同。 此處要表達的意思對應「We interviewed staff and students only after Thursday.」。"}]},{"language":"en","id":"correlative","title":"the…the… 的連動比較","explanation":["CEFR C2 ｜ 使用頻率：中","the 加比較級…，the 加比較級… 表示兩個量連動。要注意增加的一方使另一方增加還是減少。","比較「The fewer buses there are, the longer students wait.」（公車越少，學生等越久。）和「The more buses there are, the longer students wait.」（公車越多，學生等越久。）。","常見誤用：The sooner we book, the least we\'ll pay.　修正：The sooner we book, the less we\'ll pay."],"examples":[{"text":"The fewer buses there are, the longer students wait.","zh":"公車越少，學生等越久。"},{"text":"The more buses there are, the longer students wait.","zh":"公車越多，學生等越久。"},{"text":"The sooner we book, the less we\'ll pay.","zh":"我們越早訂越便宜。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「公車越少，學生等越久。」？","options":["The more buses there are, the longer students wait.","The fewer buses there are, the longer students wait."],"answers":["The fewer buses there are, the longer students wait."],"explanation":"第一種意思是「公車越少，學生等越久。」，另一種是「公車越多，學生等越久。」。the 加比較級…，the 加比較級… 表示兩個量連動。要注意增加的一方使另一方增加還是減少。"},{"id":"complete-form","type":"fill","prompt":"我們越早訂越便宜。\\n請從「the least／the less」選出合適寫法，只填空格。\\nThe sooner we book, ___ we\'ll pay.","answers":["the less"],"explanation":"the 加比較級…，the 加比較級… 表示兩個量連動。要注意增加的一方使另一方增加還是減少。 完整寫法是「The sooner we book, the less we\'ll pay.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe more we rehearse, ___ we sound.","options":["the best","the better"],"answers":["the better"],"explanation":"the 加比較級…，the 加比較級… 表示兩個量連動。要注意增加的一方使另一方增加還是減少。 完整寫法是「The more we rehearse, the better we sound.」。"},{"id":"transfer","type":"choice","prompt":"參與的人越少，估計越不可靠。","options":["The fewer people respond, the more reliable the estimate becomes.","The fewer people respond, the less reliable the estimate becomes."],"answers":["The fewer people respond, the less reliable the estimate becomes."],"explanation":"the 加比較級…，the 加比較級… 表示兩個量連動。要注意增加的一方使另一方增加還是減少。 此處要表達的意思對應「The fewer people respond, the less reliable the estimate becomes.」。"}]},{"language":"en","id":"all-the-more","title":"all the more 與程度加深的理由","explanation":["CEFR C2 ｜ 使用頻率：中","all the more 加形容詞，再用 because 或 for 引出使程度加深的原因。less 則反轉評價方向。","比較「Your help was all the more valuable because time was short.」（正因為時間緊迫，你的協助格外寶貴。）和「Your help was less valuable because time was short.」（因為時間緊迫，你的協助價值打了折扣。）。","常見誤用：The delay was all the most frustrating because we\'d arrived early.　修正：The delay was all the more frustrating because we\'d arrived early."],"examples":[{"text":"Your help was all the more valuable because time was short.","zh":"正因為時間緊迫，你的協助格外寶貴。"},{"text":"Your help was less valuable because time was short.","zh":"因為時間緊迫，你的協助價值打了折扣。"},{"text":"The delay was all the more frustrating because we\'d arrived early.","zh":"我們早早就到了，這讓延誤格外惱人。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「正因為時間緊迫，你的協助格外寶貴。」？","options":["Your help was less valuable because time was short.","Your help was all the more valuable because time was short."],"answers":["Your help was all the more valuable because time was short."],"explanation":"第一種意思是「正因為時間緊迫，你的協助格外寶貴。」，另一種是「因為時間緊迫，你的協助價值打了折扣。」。all the more 加形容詞，再用 because 或 for 引出使程度加深的原因。less 則反轉評價方向。"},{"id":"complete-form","type":"fill","prompt":"我們早早就到了，這讓延誤格外惱人。\\n請從「more／most」選出合適寫法，只填空格。\\nThe delay was all the ___ frustrating because we\'d arrived early.","answers":["more"],"explanation":"all the more 加形容詞，再用 because 或 for 引出使程度加深的原因。less 則反轉評價方向。 完整寫法是「The delay was all the more frustrating because we\'d arrived early.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nHer advice was all the ___ useful for being specific.","options":["most","more"],"answers":["more"],"explanation":"all the more 加形容詞，再用 because 或 for 引出使程度加深的原因。less 則反轉評價方向。 完整寫法是「Her advice was all the more useful for being specific.」。"},{"id":"transfer","type":"choice","prompt":"對方時間很少，反而讓他的援助格外可貴。","options":["His help would have been more valuable if he\'d been less busy.","His help was all the more valuable because he was so busy."],"answers":["His help was all the more valuable because he was so busy."],"explanation":"all the more 加形容詞，再用 because 或 for 引出使程度加深的原因。less 則反轉評價方向。 此處要表達的意思對應「His help was all the more valuable because he was so busy.」。"}]},{"language":"en","id":"quantity-bound","title":"no more than 的上限與 no fewer than 的下限","explanation":["CEFR C2 ｜ 使用頻率：中","no more than 在規則裡通常設定上限；no fewer than 設下限，亦可在敘述中強調「竟達」這個數字。","比較「You may claim no more than three journeys.」（你最多可以報銷三趟。）和「You must claim no fewer than three journeys.」（你必須至少申報三趟。）。","常見誤用：The tiny choir recruited no fewest than ten soloists.　修正：The tiny choir recruited no fewer than ten soloists."],"examples":[{"text":"You may claim no more than three journeys.","zh":"你最多可以報銷三趟。"},{"text":"You must claim no fewer than three journeys.","zh":"你必須至少申報三趟。"},{"text":"The tiny choir recruited no fewer than ten soloists.","zh":"這個小合唱團竟找到了十位獨唱者。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「你最多可以報銷三趟。」？","options":["You must claim no fewer than three journeys.","You may claim no more than three journeys."],"answers":["You may claim no more than three journeys."],"explanation":"第一種意思是「你最多可以報銷三趟。」，另一種是「你必須至少申報三趟。」。no more than 在規則裡通常設定上限；no fewer than 設下限，亦可在敘述中強調「竟達」這個數字。"},{"id":"complete-form","type":"fill","prompt":"這個小合唱團竟找到了十位獨唱者。\\n請從「fewer／fewest」選出合適寫法，只填空格。\\nThe tiny choir recruited no ___ than ten soloists.","answers":["fewer"],"explanation":"no more than 在規則裡通常設定上限；no fewer than 設下限，亦可在敘述中強調「竟達」這個數字。 完整寫法是「The tiny choir recruited no fewer than ten soloists.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe lift holds no ___ than six people.","options":["most","more"],"answers":["more"],"explanation":"no more than 在規則裡通常設定上限；no fewer than 設下限，亦可在敘述中強調「竟達」這個數字。 完整寫法是「The lift holds no more than six people.」。"},{"id":"transfer","type":"choice","prompt":"團體票最多含十二人，不要求至少十二人。","options":["A group ticket covers no fewer than twelve people.","A group ticket covers no more than twelve people."],"answers":["A group ticket covers no more than twelve people."],"explanation":"no more than 在規則裡通常設定上限；no fewer than 設下限，亦可在敘述中強調「竟達」這個數字。 此處要表達的意思對應「A group ticket covers no more than twelve people.」。"}]},{"language":"en","id":"not-so-much","title":"not so much A as B 重新界定問題","explanation":["CEFR C2 ｜ 使用頻率：中","not so much A as B 用 B 替代 A，給同一個現象更準確的名稱。對調兩者就會反轉你的立場。","比較「It was not so much opposition as doubt.」（與其說是反對，不如說是懷疑。）和「It was not so much doubt as opposition.」（與其說是懷疑，不如說是反對。）。","常見誤用：The issue is not so much distance that frequency of service.　修正：The issue is not so much distance as frequency of service."],"examples":[{"text":"It was not so much opposition as doubt.","zh":"與其說是反對，不如說是懷疑。"},{"text":"It was not so much doubt as opposition.","zh":"與其說是懷疑，不如說是反對。"},{"text":"The issue is not so much distance as frequency of service.","zh":"問題主要在班次，而非距離。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「與其說是反對，不如說是懷疑。」？","options":["It was not so much opposition as doubt.","It was not so much doubt as opposition."],"answers":["It was not so much opposition as doubt."],"explanation":"第一種意思是「與其說是反對，不如說是懷疑。」，另一種是「與其說是懷疑，不如說是反對。」。not so much A as B 用 B 替代 A，給同一個現象更準確的名稱。對調兩者就會反轉你的立場。"},{"id":"complete-form","type":"fill","prompt":"問題主要在班次，而非距離。\\n請從「that／as」選出合適寫法，只填空格。\\nThe issue is not so much distance ___ frequency of service.","answers":["as"],"explanation":"not so much A as B 用 B 替代 A，給同一個現象更準確的名稱。對調兩者就會反轉你的立場。 完整寫法是「The issue is not so much distance as frequency of service.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe role is not so much managerial ___ advisory.","options":["as","that"],"answers":["as"],"explanation":"not so much A as B 用 B 替代 A，給同一個現象更準確的名稱。對調兩者就會反轉你的立場。 完整寫法是「The role is not so much managerial as advisory.」。"},{"id":"transfer","type":"choice","prompt":"組員其實是懷疑估算方式，不是反對專案。","options":["The response was not so much opposition as doubt about the estimate.","The response was not so much doubt about the estimate as opposition."],"answers":["The response was not so much opposition as doubt about the estimate."],"explanation":"not so much A as B 用 B 替代 A，給同一個現象更準確的名稱。對調兩者就會反轉你的立場。 此處要表達的意思對應「The response was not so much opposition as doubt about the estimate.」。"}]},{"language":"en","id":"relative-number","title":"one of those who 的先行詞與數量一致","explanation":["CEFR C2 ｜ 使用頻率：中","關係子句動詞與所描述的先行詞配合。one of several mentors who speak 是一群人都會；the only mentor who speaks 則突出唯一一人。","比較「May is one of three mentors who speak Thai.」（會泰語的三位導師中，May 是其中一位。）和「May is the only mentor who speaks Thai.」（May 是唯一會泰語的導師。）。","常見誤用：Both students who runs the club are away.　修正：Both students who run the club are away."],"examples":[{"text":"May is one of three mentors who speak Thai.","zh":"會泰語的三位導師中，May 是其中一位。"},{"text":"May is the only mentor who speaks Thai.","zh":"May 是唯一會泰語的導師。"},{"text":"Both students who run the club are away.","zh":"經營社團的那兩位學生都不在。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「會泰語的三位導師中，May 是其中一位。」？","options":["May is one of three mentors who speak Thai.","May is the only mentor who speaks Thai."],"answers":["May is one of three mentors who speak Thai."],"explanation":"第一種意思是「會泰語的三位導師中，May 是其中一位。」，另一種是「May 是唯一會泰語的導師。」。關係子句動詞與所描述的先行詞配合。one of several mentors who speak 是一群人都會；the only mentor who speaks 則突出唯一一人。"},{"id":"complete-form","type":"fill","prompt":"經營社團的那兩位學生都不在。\\n請從「run／runs」選出合適寫法，只填空格。\\nBoth students who ___ the club are away.","answers":["run"],"explanation":"關係子句動詞與所描述的先行詞配合。one of several mentors who speak 是一群人都會；the only mentor who speaks 則突出唯一一人。 完整寫法是「Both students who run the club are away.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe only one who ___ a key is upstairs.","options":["have","has"],"answers":["has"],"explanation":"關係子句動詞與所描述的先行詞配合。one of several mentors who speak 是一群人都會；the only mentor who speaks 則突出唯一一人。 完整寫法是「The only one who has a key is upstairs.」。"},{"id":"transfer","type":"choice","prompt":"三位導師都會泰語，May 是其中一位。","options":["May is one of three mentors who speak Thai.","May is the only one of three mentors who speaks Thai."],"answers":["May is one of three mentors who speak Thai."],"explanation":"關係子句動詞與所描述的先行詞配合。one of several mentors who speak 是一群人都會；the only mentor who speaks 則突出唯一一人。 此處要表達的意思對應「May is one of three mentors who speak Thai.」。"}]},{"language":"en","id":"whoever","title":"whoever 的內層主詞與外層介系詞","explanation":["CEFR C2 ｜ 使用頻率：中","whoever 可同時扮演整個名詞子句的引導詞與內層主詞。即使外面有介系詞，仍須檢查內層動詞需要什麼角色。","比較「Leave the key with whoever closes the hall.」（把鑰匙交給最後關閉大廳的人。）和「Leave the key with the person I chose.」（把鑰匙交給我選定的人。）。","常見誤用：Give the badge to whomever is on duty.　修正：Give the badge to whoever is on duty."],"examples":[{"text":"Leave the key with whoever closes the hall.","zh":"把鑰匙交給最後關閉大廳的人。"},{"text":"Leave the key with the person I chose.","zh":"把鑰匙交給我選定的人。"},{"text":"Give the badge to whoever is on duty.","zh":"把識別證交給當班的人。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「把鑰匙交給最後關閉大廳的人。」？","options":["Leave the key with the person I chose.","Leave the key with whoever closes the hall."],"answers":["Leave the key with whoever closes the hall."],"explanation":"第一種意思是「把鑰匙交給最後關閉大廳的人。」，另一種是「把鑰匙交給我選定的人。」。whoever 可同時扮演整個名詞子句的引導詞與內層主詞。即使外面有介系詞，仍須檢查內層動詞需要什麼角色。"},{"id":"complete-form","type":"fill","prompt":"把識別證交給當班的人。\\n請從「whoever／whomever」選出合適寫法，只填空格。\\nGive the badge to ___ is on duty.","answers":["whoever"],"explanation":"whoever 可同時扮演整個名詞子句的引導詞與內層主詞。即使外面有介系詞，仍須檢查內層動詞需要什麼角色。 完整寫法是「Give the badge to whoever is on duty.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nWe\'ll work with ___ wins the vote.","options":["whomever","whoever"],"answers":["whoever"],"explanation":"whoever 可同時扮演整個名詞子句的引導詞與內層主詞。即使外面有介系詞，仍須檢查內層動詞需要什麼角色。 完整寫法是「We\'ll work with whoever wins the vote.」。"},{"id":"transfer","type":"choice","prompt":"你要說誰最後離開就把鑰匙交給誰。","options":["Leave it with whomever leaves last.","Leave it with whoever leaves last."],"answers":["Leave it with whoever leaves last."],"explanation":"whoever 可同時扮演整個名詞子句的引導詞與內層主詞。即使外面有介系詞，仍須檢查內層動詞需要什麼角色。 此處要表達的意思對應「Leave it with whoever leaves last.」。"}]},{"language":"en","id":"prep-whom","title":"正式關係子句的介系詞與 whom","explanation":["CEFR C2 ｜ 使用頻率：中","正式關係子句把介系詞前置時，指人用 whom。選 from 或 to 時取決於誰是資訊來源、誰是接收者。","比較「The partner from whom I sought advice has replied.」（我向其求教的那位夥伴回覆了。）和「The partner to whom I offered advice has replied.」（我提供建議給他的那位夥伴回覆了。）。","常見誤用：The students for whose the fund was created chose its name.　修正：The students for whom the fund was created chose its name."],"examples":[{"text":"The partner from whom I sought advice has replied.","zh":"我向其求教的那位夥伴回覆了。"},{"text":"The partner to whom I offered advice has replied.","zh":"我提供建議給他的那位夥伴回覆了。"},{"text":"The students for whom the fund was created chose its name.","zh":"基金要幫助的學生親自選了名稱。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我向其求教的那位夥伴回覆了。」？","options":["The partner to whom I offered advice has replied.","The partner from whom I sought advice has replied."],"answers":["The partner from whom I sought advice has replied."],"explanation":"第一種意思是「我向其求教的那位夥伴回覆了。」，另一種是「我提供建議給他的那位夥伴回覆了。」。正式關係子句把介系詞前置時，指人用 whom。選 from 或 to 時取決於誰是資訊來源、誰是接收者。"},{"id":"complete-form","type":"fill","prompt":"基金要幫助的學生親自選了名稱。\\n請從「whom／whose」選出合適寫法，只填空格。\\nThe students for ___ the fund was created chose its name.","answers":["whom"],"explanation":"正式關係子句把介系詞前置時，指人用 whom。選 from 或 to 時取決於誰是資訊來源、誰是接收者。 完整寫法是「The students for whom the fund was created chose its name.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe mentor with ___ I worked has retired.","options":["whose","whom"],"answers":["whom"],"explanation":"正式關係子句把介系詞前置時，指人用 whom。選 from 或 to 時取決於誰是資訊來源、誰是接收者。 完整寫法是「The mentor with whom I worked has retired.」。"},{"id":"transfer","type":"choice","prompt":"研究夥伴提供了你需要的資料，選出把夥伴寫成資料來源的說法。","options":["the partner to whom we supplied the figures","the partner from whom we obtained the figures"],"answers":["the partner from whom we obtained the figures"],"explanation":"正式關係子句把介系詞前置時，指人用 whom。選 from 或 to 時取決於誰是資訊來源、誰是接收者。 此處要表達的意思對應「the partner from whom we obtained the figures」。"}]},{"language":"en","id":"ellipsis-any","title":"if any 與 if ever 的省略保留","explanation":["CEFR C2 ｜ 使用頻率：中","在數量旁加 if any，保留「甚至可能完全沒有」；頻率旁加 if ever，保留「可能從未發生」。","比較「The savings, if any, were modest.」（即使真的有省到錢，金額也很小。）和「There were definitely some modest savings.」（確實省下了一點錢。）。","常見誤用：We rarely, if any, rehearse on Sundays.　修正：We rarely, if ever, rehearse on Sundays."],"examples":[{"text":"The savings, if any, were modest.","zh":"即使真的有省到錢，金額也很小。"},{"text":"There were definitely some modest savings.","zh":"確實省下了一點錢。"},{"text":"We rarely, if ever, rehearse on Sundays.","zh":"我們週日很少排練，甚至可能從未排過。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「即使真的有省到錢，金額也很小。」？","options":["The savings, if any, were modest.","There were definitely some modest savings."],"answers":["The savings, if any, were modest."],"explanation":"第一種意思是「即使真的有省到錢，金額也很小。」，另一種是「確實省下了一點錢。」。在數量旁加 if any，保留「甚至可能完全沒有」；頻率旁加 if ever，保留「可能從未發生」。"},{"id":"complete-form","type":"fill","prompt":"我們週日很少排練，甚至可能從未排過。\\n請從「ever／any」選出合適寫法，只填空格。\\nWe rarely, if ___, rehearse on Sundays.","answers":["ever"],"explanation":"在數量旁加 if any，保留「甚至可能完全沒有」；頻率旁加 if ever，保留「可能從未發生」。 完整寫法是「We rarely, if ever, rehearse on Sundays.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThere were few objections, if ___.","options":["ever","any"],"answers":["any"],"explanation":"在數量旁加 if any，保留「甚至可能完全沒有」；頻率旁加 if ever，保留「可能從未發生」。 完整寫法是「There were few objections, if any.」。"},{"id":"transfer","type":"choice","prompt":"試辦結束，但連有沒有省錢都還不確定。","options":["There were definitely modest savings.","The savings, if any, were modest."],"answers":["The savings, if any, were modest."],"explanation":"在數量旁加 if any，保留「甚至可能完全沒有」；頻率旁加 if ever，保留「可能從未發生」。 此處要表達的意思對應「The savings, if any, were modest.」。"}]},{"language":"en","id":"raising-appear","title":"appear to have 與報告中的審慎判斷","explanation":["CEFR C1 ｜ 使用頻率：中","正式分析可用 appear to 加原形以保留判斷；to have 加分詞把推測的變化放在觀察以前。去掉 appear 會讓結論更肯定。","比較「Demand appears to have fallen before the strike.」（需求看來在罷工前就已下滑。）和「Demand fell before the strike.」（需求在罷工前就下滑了。）。","常見誤用：The figures appear to have stabilise since May.　修正：The figures appear to have stabilised since May."],"examples":[{"text":"Demand appears to have fallen before the strike.","zh":"需求看來在罷工前就已下滑。"},{"text":"Demand fell before the strike.","zh":"需求在罷工前就下滑了。"},{"text":"The figures appear to have stabilised since May.","zh":"數字似乎自五月以來已趨穩。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「需求看來在罷工前就已下滑。」？","options":["Demand fell before the strike.","Demand appears to have fallen before the strike."],"answers":["Demand appears to have fallen before the strike."],"explanation":"第一種意思是「需求看來在罷工前就已下滑。」，另一種是「需求在罷工前就下滑了。」。正式分析可用 appear to 加原形以保留判斷；to have 加分詞把推測的變化放在觀察以前。去掉 appear 會讓結論更肯定。"},{"id":"complete-form","type":"fill","prompt":"數字似乎自五月以來已趨穩。\\n請從「stabilised／stabilise」選出合適寫法，只填空格。\\nThe figures appear to have ___ since May.","answers":["stabilised"],"explanation":"正式分析可用 appear to 加原形以保留判斷；to have 加分詞把推測的變化放在觀察以前。去掉 appear 會讓結論更肯定。 完整寫法是「The figures appear to have stabilised since May.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe gap appears ___ narrowing.","options":["be","to be"],"answers":["to be"],"explanation":"正式分析可用 appear to 加原形以保留判斷；to have 加分詞把推測的變化放在觀察以前。去掉 appear 會讓結論更肯定。 完整寫法是「The gap appears to be narrowing.」。"},{"id":"transfer","type":"choice","prompt":"兩份資料都有缺頁。你要保留結論，表示「成本看來在換供應商之前就上升了」。","options":["Costs appear to have risen before we changed suppliers.","Costs rose because we changed suppliers."],"answers":["Costs appear to have risen before we changed suppliers."],"explanation":"正式分析可用 appear to 加原形以保留判斷；to have 加分詞把推測的變化放在觀察以前。去掉 appear 會讓結論更肯定。 此處要表達的意思對應「Costs appear to have risen before we changed suppliers.」。"}]},{"language":"en","id":"passive-ing","title":"英式 need doing 的被動意義","explanation":["CEFR C1 ｜ 使用頻率：中","需要做某事的主詞若是承受者，英式英語常用 need 加 -ing，等於 need to be 加分詞；need to 加主動原形則由主詞執行。","比較「The report needs checking.」（報告需要有人核對。）和「The team needs to check the report.」（團隊需要核對報告。）。","常見誤用：The locks need change before term starts.　修正：The locks need changing before term starts."],"examples":[{"text":"The report needs checking.","zh":"報告需要有人核對。"},{"text":"The team needs to check the report.","zh":"團隊需要核對報告。"},{"text":"The locks need changing before term starts.","zh":"開學前得換鎖。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「報告需要有人核對。」？","options":["The report needs checking.","The team needs to check the report."],"answers":["The report needs checking."],"explanation":"第一種意思是「報告需要有人核對。」，另一種是「團隊需要核對報告。」。需要做某事的主詞若是承受者，英式英語常用 need 加 -ing，等於 need to be 加分詞；need to 加主動原形則由主詞執行。"},{"id":"complete-form","type":"fill","prompt":"開學前得換鎖。\\n請從「change／changing」選出合適寫法，只填空格。\\nThe locks need ___ before term starts.","answers":["changing"],"explanation":"需要做某事的主詞若是承受者，英式英語常用 need 加 -ing，等於 need to be 加分詞；need to 加主動原形則由主詞執行。 完整寫法是「The locks need changing before term starts.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nThe piano needs to be ___.","options":["tuned","tune"],"answers":["tuned"],"explanation":"需要做某事的主詞若是承受者，英式英語常用 need 加 -ing，等於 need to be 加分詞；need to 加主動原形則由主詞執行。 完整寫法是「The piano needs to be tuned.」。"},{"id":"transfer","type":"choice","prompt":"你要在交接信中說「這些收據還需要人核對」。","options":["These receipts still need checking.","These receipts have already been checked."],"answers":["These receipts still need checking."],"explanation":"需要做某事的主詞若是承受者，英式英語常用 need 加 -ing，等於 need to be 加分詞；need to 加主動原形則由主詞執行。 此處要表達的意思對應「These receipts still need checking.」。"}]},{"language":"fr","id":"articles-genre","title":"冠詞與名詞的性數","explanation":["CEFR A1 ｜ 使用頻率：高","第一次提到可數的東西時，單數用 un（陽性）或 une（陰性），複數用 des。當對方知道你指的是哪一個，就用 le、la、les。單數定冠詞遇到母音或啞音 h 縮成 l’。","把冠詞和名詞一起背。une adresse 是陰性，l’adresse 表面上看不出這件事。","常見誤用：Je cherche un prise.　修正：Je cherche une prise."],"examples":[{"text":"Il y a une boulangerie près du campus. La boulangerie ouvre à sept heures.","zh":"校園附近有一家麵包店。那家麵包店七點開門。"},{"text":"Je cherche une boulangerie.","zh":"我在找一家麵包店。"},{"text":"Je cherche une prise.","zh":"我在找一個插座。"}],"questions":[{"id":"context-1","type":"choice","prompt":"第一次提到某間教室：Je cherche ___ salle pour répéter.","options":["un","une","des"],"answers":["une"],"explanation":"salle 是陰性單數。要找任一間可用的教室，使用 une salle。"},{"id":"context-2","type":"choice","prompt":"兩人已談到這些筆記：Tu as apporté ___ notes dont on a parlé ?","options":["la","le","les"],"answers":["les"],"explanation":"notes 是複數，後面的關係子句限定了雙方知道的那些筆記。"},{"id":"complete-form","type":"fill","prompt":"我在找一個插座。 依語境填入 une 或 un。\\nJe cherche ___ prise.","answers":["une"],"explanation":"第一次提到可數的東西時，單數用 un（陽性）或 une（陰性），複數用 des。當對方知道你指的是哪一個，就用 le、la、les。單數定冠詞遇到母音或啞音 h 縮成 l’。 此句應寫成「Je cherche une prise.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我在找一家麵包店。\\nboulangerie. ｜ cherche ｜ une ｜ Je","answers":["Je cherche une boulangerie.","Je cherche une boulangerie"],"explanation":"第一次提到可數的東西時，單數用 un（陽性）或 une（陰性），複數用 des。當對方知道你指的是哪一個，就用 le、la、les。單數定冠詞遇到母音或啞音 h 縮成 l’。 在這個語境中，完整語序為「Je cherche une boulangerie.」。"}]},{"language":"fr","id":"present-personnes","title":"現在式與主詞人稱","explanation":["CEFR A1 ｜ 使用頻率：高","規則 -er 動詞的現在式先去掉 -er，再依 je、tu、il/elle/on、nous、vous、ils/elles 加上 -e、-es、-e、-ons、-ez、-ent。口語中動詞結尾常聽不出差異，主詞代名詞通常必須保留。","口語的 on 可以表示「我們」，動詞仍用第三人稱單數，如 On travaille ensemble。","常見誤用：Vous sommes au bon étage.　修正：Vous êtes au bon étage."],"examples":[{"text":"Nous préparons un exposé. Vous préparez le vôtre aussi ?","zh":"我們在準備口頭報告。你們也在準備自己的報告嗎？"},{"text":"Nous travaillons ensemble à Paris.","zh":"我們一起在巴黎工作。"},{"text":"Vous êtes au bon étage.","zh":"您在正確的樓層。"}],"questions":[{"id":"context-1","type":"choice","prompt":"Mes camarades ___ le français à Paris.","options":["étudie","étudions","étudient"],"answers":["étudient"],"explanation":"mes camarades 相當於 ils 或 elles，所以用 étudient。"},{"id":"context-2","type":"choice","prompt":"On ___ le train à huit heures.（搭車）","options":["prend","prenons","prennent"],"answers":["prend"],"explanation":"prendre 是不規則動詞。on 的搭配與 il 相同，為 prend。"},{"id":"complete-form","type":"fill","prompt":"您在正確的樓層。 依語境填入 êtes 或 sommes。\\nVous ___ au bon étage.","answers":["êtes"],"explanation":"規則 -er 動詞的現在式先去掉 -er，再依 je、tu、il/elle/on、nous、vous、ils/elles 加上 -e、-es、-e、-ons、-ez、-ent。口語中動詞結尾常聽不出差異，主詞代名詞通常必須保留。 此句應寫成「Vous êtes au bon étage.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我們一起在巴黎工作。\\ntravaillons ｜ Nous ｜ Paris. ｜ à ｜ ensemble","answers":["Nous travaillons ensemble à Paris.","Nous travaillons ensemble à Paris"],"explanation":"規則 -er 動詞的現在式先去掉 -er，再依 je、tu、il/elle/on、nous、vous、ils/elles 加上 -e、-es、-e、-ons、-ez、-ent。口語中動詞結尾常聽不出差異，主詞代名詞通常必須保留。 在這個語境中，完整語序為「Nous travaillons ensemble à Paris.」。"}]},{"language":"fr","id":"questions-est-ce","title":"用 est-ce que 問問題","explanation":["CEFR A1 ｜ 使用頻率：高","把 est-ce que 放在陳述句前面，就能組成是非問句，主詞和動詞維持原順序。問時間、地點、原因時，把 quand、où、pourquoi 放在 est-ce que 前面。","que 遇到母音會縮寫，如 Est-ce qu’il reste des places ?","常見誤用：Est-ce que avez-vous un reçu ?　修正：Est-ce que vous avez un reçu ?"],"examples":[{"text":"Est-ce que ce train s’arrête ici ? Où est-ce que je dois changer ?","zh":"這班車會停這裡嗎？我該在哪裡換車？"},{"text":"Est-ce que vous prenez la carte ?","zh":"請問你們收信用卡嗎？"},{"text":"Est-ce que vous avez un reçu ?","zh":"請問您有收據嗎？"}],"questions":[{"id":"context-1","type":"choice","prompt":"你想問開門時間，該怎麼問？","options":["Où est-ce que la salle ouvre ?","À quelle heure est-ce que la salle ouvre ?","Pourquoi est-ce que la salle ouvre ?"],"answers":["À quelle heure est-ce que la salle ouvre ?"],"explanation":"à quelle heure 明確詢問幾點。où 問地點，pourquoi 問原因。"},{"id":"context-2","type":"choice","prompt":"選出標準的 est-ce que 問句。","options":["Est-ce que peux-tu venir ?","Est-ce tu que peux venir ?","Est-ce que tu peux venir ?"],"answers":["Est-ce que tu peux venir ?"],"explanation":"est-ce que 本身已標記問句，後面維持 tu peux 的順序。"},{"id":"complete-form","type":"fill","prompt":"請問您有收據嗎？ 依語境填入 vous avez 或 avez-vous。\\nEst-ce que ___ un reçu ?","answers":["vous avez"],"explanation":"把 est-ce que 放在陳述句前面，就能組成是非問句，主詞和動詞維持原順序。問時間、地點、原因時，把 quand、où、pourquoi 放在 est-ce que 前面。 此句應寫成「Est-ce que vous avez un reçu ?」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n請問你們收信用卡嗎？\\nvous ｜ que ｜ Est-ce ｜ carte ? ｜ la ｜ prenez","answers":["Est-ce que vous prenez la carte ?","Est-ce que vous prenez la carte?","Est-ce que vous prenez la carte"],"explanation":"把 est-ce que 放在陳述句前面，就能組成是非問句，主詞和動詞維持原順序。問時間、地點、原因時，把 quand、où、pourquoi 放在 est-ce que 前面。 在這個語境中，完整語序為「Est-ce que vous prenez la carte ?」。"}]},{"language":"fr","id":"passe-compose","title":"複合過去式：已完成的事件","explanation":["CEFR A2 ｜ 使用頻率：高","用 avoir 或 être 的現在式加過去分詞，交代已完成的事件。大多數動詞用 avoir，aller、venir 等特定不及物動詞和所有代名動詞用 être。aller 與 être 搭配時，過去分詞跟主詞性數一致。","辨認助動詞再處理配合。Elle est arrivée、elles sont arrivées，但 elles ont réservé une salle 中的 réservé 不跟主詞配合。","常見誤用：Les deux étudiantes sont parti à midi.　修正：Les deux étudiantes sont parties à midi."],"examples":[{"text":"Hier, je suis allé à la gare et j’ai acheté mon billet.","zh":"昨天我去了車站，買了車票。（男性說話者）"},{"text":"J’ai acheté mon billet hier.","zh":"我昨天買了車票。"},{"text":"Les deux étudiantes sont parties à midi.","zh":"兩位女學生中午離開了。"}],"questions":[{"id":"context-1","type":"choice","prompt":"Mes deux amies ___ au concert hier.","options":["ont allées","sont allées","sont allé"],"answers":["sont allées"],"explanation":"aller 用 être，兩位女性是陰性複數，所以寫 allées。"},{"id":"context-2","type":"choice","prompt":"Hier soir, nous ___ une table pour quatre.","options":["avons réservé","sommes réservés","avons réserver"],"answers":["avons réservé"],"explanation":"réserver quelque chose 用 avoir，後面接過去分詞 réservé。"},{"id":"complete-form","type":"fill","prompt":"兩位女學生中午離開了。 依語境填入 parties 或 parti。\\nLes deux étudiantes sont ___ à midi.","answers":["parties"],"explanation":"用 avoir 或 être 的現在式加過去分詞，交代已完成的事件。大多數動詞用 avoir，aller、venir 等特定不及物動詞和所有代名動詞用 être。aller 與 être 搭配時，過去分詞跟主詞性數一致。 此句應寫成「Les deux étudiantes sont parties à midi.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我昨天買了車票。\\nbillet ｜ acheté ｜ J’ai ｜ hier. ｜ mon","answers":["J’ai acheté mon billet hier.","J’ai acheté mon billet hier"],"explanation":"用 avoir 或 être 的現在式加過去分詞，交代已完成的事件。大多數動詞用 avoir，aller、venir 等特定不及物動詞和所有代名動詞用 être。aller 與 être 搭配時，過去分詞跟主詞性數一致。 在這個語境中，完整語序為「J’ai acheté mon billet hier.」。"}]},{"language":"fr","id":"comparaison","title":"比較級與最高級","explanation":["CEFR A2 ｜ 使用頻率：高","比較形容詞時，在形容詞前放 plus、aussi 或 moins，第二個比較對象前用 que。表示某個範圍內程度最高時，用定冠詞搭配 plus，如 le trajet le plus court。","bon 的比較級是 meilleur，修飾陰性名詞用 meilleure。比較動作做得好不好，則用 bien 的比較級 mieux。","常見誤用：Le plat du jour est moins cher de la formule.　修正：Le plat du jour est moins cher que la formule."],"examples":[{"text":"Cette salle est aussi calme que la bibliothèque. C’est la salle la plus lumineuse du bâtiment.","zh":"這間教室和圖書館一樣安靜。它是整棟樓採光最好的教室。"},{"text":"Ce trajet est plus court que l’autre.","zh":"這條路線比另一條短。"},{"text":"Le plat du jour est moins cher que la formule.","zh":"每日特餐比套餐便宜。"}],"questions":[{"id":"context-1","type":"choice","prompt":"選出「我第二次表現得更好」：La deuxième fois, j’ai ___ joué.","options":["meilleur","mieux","meilleure"],"answers":["mieux"],"explanation":"要修飾 joué 這個動作，用副詞比較級 mieux。"},{"id":"context-2","type":"choice","prompt":"Cette solution est ___ chère que l’autre.（比較便宜）","options":["plus","aussi","moins"],"answers":["moins"],"explanation":"moins chère que 表示「比……便宜」。"},{"id":"complete-form","type":"fill","prompt":"每日特餐比套餐便宜。 依語境填入 que 或 de。\\nLe plat du jour est moins cher ___ la formule.","answers":["que"],"explanation":"比較形容詞時，在形容詞前放 plus、aussi 或 moins，第二個比較對象前用 que。表示某個範圍內程度最高時，用定冠詞搭配 plus，如 le trajet le plus court。 此句應寫成「Le plat du jour est moins cher que la formule.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n這條路線比另一條短。\\nCe ｜ est ｜ court ｜ que ｜ l’autre. ｜ trajet ｜ plus","answers":["Ce trajet est plus court que l’autre.","Ce trajet est plus court que l’autre"],"explanation":"比較形容詞時，在形容詞前放 plus、aussi 或 moins，第二個比較對象前用 que。表示某個範圍內程度最高時，用定冠詞搭配 plus，如 le trajet le plus court。 在這個語境中，完整語序為「Ce trajet est plus court que l’autre.」。"}]},{"language":"fr","id":"objets-pronominaux","title":"直接與間接受詞代名詞","explanation":["CEFR A2 ｜ 使用頻率：常","直接受詞不透過介系詞引入，可用 le、la、les 代換。像 écrire à quelqu’un 這類動詞的 à 加人，可以用 lui 或 leur 代換。一般直述句中，代名詞放在變位動詞前。","先記住動詞的句型。écouter quelqu’un 是直接受詞，téléphoner à quelqu’un 才用 lui 或 leur。","常見誤用：Je les écris chaque semaine.　修正：Je leur écris chaque semaine."],"examples":[{"text":"Je connais la coordinatrice. Je la connais bien et je lui écris souvent.","zh":"我認識那位協調員。我跟她很熟，也常寫信給她。"},{"text":"Je lui parle souvent.","zh":"我常跟他說話。"},{"text":"Je leur écris chaque semaine.","zh":"我每週都寫信給他們。"}],"questions":[{"id":"context-1","type":"choice","prompt":"Je téléphone à mes parents. → Je ___ téléphone.","options":["les","leur","leurs"],"answers":["leur"],"explanation":"téléphoner à 加人。複數間接受詞代名詞是 leur，不加 s。"},{"id":"context-2","type":"choice","prompt":"Tu vois tes collègues ? → Oui, je ___ vois.","options":["lui","leur","les"],"answers":["les"],"explanation":"voir quelqu’un 直接接受詞，複數用 les。"},{"id":"complete-form","type":"fill","prompt":"我每週都寫信給他們。 依語境填入 leur 或 les。\\nJe ___ écris chaque semaine.","answers":["leur"],"explanation":"直接受詞不透過介系詞引入，可用 le、la、les 代換。像 écrire à quelqu’un 這類動詞的 à 加人，可以用 lui 或 leur 代換。一般直述句中，代名詞放在變位動詞前。 此句應寫成「Je leur écris chaque semaine.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我常跟他說話。\\nlui ｜ Je ｜ parle ｜ souvent.","answers":["Je lui parle souvent.","Je lui parle souvent"],"explanation":"直接受詞不透過介系詞引入，可用 le、la、les 代換。像 écrire à quelqu’un 這類動詞的 à 加人，可以用 lui 或 leur 代換。一般直述句中，代名詞放在變位動詞前。 在這個語境中，完整語序為「Je lui parle souvent.」。"}]},{"language":"fr","id":"imparfait-recit","title":"未完成過去式與複合過去式","explanation":["CEFR B1 ｜ 使用頻率：高","敘事時，用 imparfait 描述事件發生時的背景、正在進行的動作或習慣；用 passé composé 推進故事、標記事件的發生或完成。同一動詞可用兩個時態，差別在說話者如何呈現事件。","不要只看動作花了多久。「我在納米比亞教了一個月」把整段經驗看成一個已結束的事件，因此可說 J’ai enseigné en Namibie pendant un mois。","常見誤用：Nous dînait quand le gardien a frappé.　修正：Nous dînions quand le gardien a frappé."],"examples":[{"text":"Je relisais mes notes quand mon téléphone a sonné.","zh":"我正在重讀筆記時，電話響了。"},{"text":"Je révisais quand le cours a commencé.","zh":"課程開始時，我正在複習。"},{"text":"Nous dînions quand le gardien a frappé.","zh":"管理員敲門時我們正在吃飯。"}],"questions":[{"id":"context-1","type":"choice","prompt":"描述當時正在發生的背景：Quand le micro est tombé, je ___ encore du piano.","options":["jouerai","jouais","jouerais"],"answers":["jouais"],"explanation":"彈琴是麥克風掉落時持續進行的背景，用 jouais。"},{"id":"context-2","type":"choice","prompt":"把行程當作一次完成的事件：Samedi dernier, notre équipe ___ trois écoles en une journée.","options":["visitera","visiterait","a visité"],"answers":["a visité"],"explanation":"三所學校及一天的範圍讓這裡的巡訪構成一個完整事件。"},{"id":"complete-form","type":"fill","prompt":"管理員敲門時我們正在吃飯。 依語境填入 dînions 或 dînait。\\nNous ___ quand le gardien a frappé.","answers":["dînions"],"explanation":"敘事時，用 imparfait 描述事件發生時的背景、正在進行的動作或習慣；用 passé composé 推進故事、標記事件的發生或完成。同一動詞可用兩個時態，差別在說話者如何呈現事件。 此句應寫成「Nous dînions quand le gardien a frappé.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n課程開始時，我正在複習。\\na ｜ commencé. ｜ Je ｜ le ｜ quand ｜ révisais ｜ cours","answers":["Je révisais quand le cours a commencé.","Je révisais quand le cours a commencé"],"explanation":"敘事時，用 imparfait 描述事件發生時的背景、正在進行的動作或習慣；用 passé composé 推進故事、標記事件的發生或完成。同一動詞可用兩個時態，差別在說話者如何呈現事件。 在這個語境中，完整語序為「Je révisais quand le cours a commencé.」。"}]},{"language":"fr","id":"relatif-simple","title":"關係代名詞 qui、que、où","explanation":["CEFR B1 ｜ 使用頻率：高","找出關係子句缺哪一種成分。缺主詞用 qui，缺直接受詞用 que；先行詞表示地點或時間，子句缺地點或時間補語，就用 où。人和物都可以當 qui 或 que 的先行詞。","先把子句還原成完整句。例如 Ma sœur adore ce café → le café que ma sœur adore。","常見誤用：Voici le bus que va à la gare.　修正：Voici le bus qui va à la gare."],"examples":[{"text":"C’est le café où je travaille et que ma sœur adore.","zh":"這就是我平常工作、我妹妹也很喜歡的那家咖啡廳。"},{"text":"Voici le stage que je vise.","zh":"這就是我想爭取的實習。"},{"text":"Voici le bus qui va à la gare.","zh":"這是開往車站的公車。"}],"questions":[{"id":"context-1","type":"choice","prompt":"L’association ___ organise ces ateliers recrute.","options":["où","que","qui"],"answers":["qui"],"explanation":"organise 缺主詞，而協會正是舉辦工作坊的人員組織，所以用 qui。"},{"id":"context-2","type":"choice","prompt":"Je me souviens du jour ___ nous avons lancé le projet.","options":["où","qui","que"],"answers":["où"],"explanation":"nous avons lancé le projet 成分完整，剩下的是「在那一天」這個時間。"},{"id":"complete-form","type":"fill","prompt":"這是開往車站的公車。 依語境填入 qui 或 que。\\nVoici le bus ___ va à la gare.","answers":["qui"],"explanation":"找出關係子句缺哪一種成分。缺主詞用 qui，缺直接受詞用 que；先行詞表示地點或時間，子句缺地點或時間補語，就用 où。人和物都可以當 qui 或 que 的先行詞。 此句應寫成「Voici le bus qui va à la gare.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n這就是我想爭取的實習。\\nvise. ｜ Voici ｜ que ｜ je ｜ stage ｜ le","answers":["Voici le stage que je vise.","Voici le stage que je vise"],"explanation":"找出關係子句缺哪一種成分。缺主詞用 qui，缺直接受詞用 que；先行詞表示地點或時間，子句缺地點或時間補語，就用 où。人和物都可以當 qui 或 que 的先行詞。 在這個語境中，完整語序為「Voici le stage que je vise.」。"}]},{"language":"fr","id":"necessite-subjonctif","title":"虛擬式：立場、必要與讓步","explanation":["CEFR B2 ｜ 使用頻率：高","il faut que、je souhaite que、bien que 等結構需要虛擬式。虛擬式呈現說話者對事態的立場，也能搭配已知事實，如「雖然他在場」。先判斷引導結構，再挑選變位。","虛擬式與直陳式在部分人稱外形相同。先用 être（soit）、avoir（ait）或 pouvoir（puisse）練習辨認差異。","常見誤用：Il faut qu\'elle a son badge.　修正：Il faut qu\'elle ait son badge."],"examples":[{"text":"Bien que le budget soit serré, je souhaite que chaque élève puisse participer.","zh":"儘管預算吃緊，我希望每位學生都能參加。"},{"text":"Il faut que tu sois là.","zh":"你必須到場。"},{"text":"Il faut qu\'elle ait son badge.","zh":"她必須帶著識別證。"}],"questions":[{"id":"context-1","type":"choice","prompt":"Il faut que nous ___ prêts avant l’entretien.","options":["sommes","soyons","serons"],"answers":["soyons"],"explanation":"il faut que 需要虛擬式。être 的 nous 形式是 soyons。"},{"id":"context-2","type":"choice","prompt":"Je souhaite que cette formation vous ___ utile.","options":["est","sera","soit"],"answers":["soit"],"explanation":"je souhaite que 引導願望，être 的第三人稱單數虛擬式為 soit。"},{"id":"complete-form","type":"fill","prompt":"她必須帶著識別證。 依語境填入 ait 或 a。\\nIl faut qu\'elle ___ son badge.","answers":["ait"],"explanation":"il faut que、je souhaite que、bien que 等結構需要虛擬式。虛擬式呈現說話者對事態的立場，也能搭配已知事實，如「雖然他在場」。先判斷引導結構，再挑選變位。 此句應寫成「Il faut qu\'elle ait son badge.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n你必須到場。\\nque ｜ tu ｜ Il ｜ sois ｜ faut ｜ là.","answers":["Il faut que tu sois là.","Il faut que tu sois là"],"explanation":"il faut que、je souhaite que、bien que 等結構需要虛擬式。虛擬式呈現說話者對事態的立場，也能搭配已知事實，如「雖然他在場」。先判斷引導結構，再挑選變位。 在這個語境中，完整語序為「Il faut que tu sois là.」。"}]},{"language":"fr","id":"pronoms-y-en","title":"代名詞 y 與 en","explanation":["CEFR B2 ｜ 使用頻率：常","y 可代換地點補語或部分 à 加事物的補語。en 可代換 de 加名詞、部分冠詞加名詞或數量表達中的名詞。代換帶數量的名詞時，數字仍要留下。","penser à ce projet → y penser；penser à Léa → penser à elle。介系詞相同，指涉人或事物會影響選擇。","常見誤用：Des places ? Il y reste trois.　修正：Des places ? Il en reste trois."],"examples":[{"text":"Tu as des billets pour le concert ? J’en ai deux, et j’y vais samedi.","zh":"你有音樂會的票嗎？我有兩張，星期六會去。"},{"text":"J’en voudrais deux pour samedi.","zh":"我想要兩張星期六的。"},{"text":"Des places ? Il en reste trois.","zh":"座位嗎？還剩三個。"}],"questions":[{"id":"context-1","type":"choice","prompt":"Tu participes à cet atelier ? → Oui, j’___ participe.","options":["en","y","le"],"answers":["y"],"explanation":"participer à 加活動，可用 y 代換 à cet atelier。"},{"id":"context-2","type":"choice","prompt":"Que devient « Je voudrais trois exemplaires » ?","options":["J’y voudrais trois.","Je les voudrais de trois.","J’en voudrais trois."],"answers":["J’en voudrais trois."],"explanation":"en 代替 exemplaires，確切數量 trois 留在動詞後方。"},{"id":"complete-form","type":"fill","prompt":"座位嗎？還剩三個。 依語境填入 en 或 y。\\nDes places ? Il ___ reste trois.","answers":["en"],"explanation":"y 可代換地點補語或部分 à 加事物的補語。en 可代換 de 加名詞、部分冠詞加名詞或數量表達中的名詞。代換帶數量的名詞時，數字仍要留下。 此句應寫成「Des places ? Il en reste trois.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我想要兩張星期六的。\\nsamedi. ｜ J’en ｜ deux ｜ voudrais ｜ pour","answers":["J’en voudrais deux pour samedi.","J’en voudrais deux pour samedi"],"explanation":"y 可代換地點補語或部分 à 加事物的補語。en 可代換 de 加名詞、部分冠詞加名詞或數量表達中的名詞。代換帶數量的名詞時，數字仍要留下。 在這個語境中，完整語序為「J’en voudrais deux pour samedi.」。"}]},{"language":"fr","id":"si-plus-que-parfait","title":"過去未實現的假設","explanation":["CEFR B2 ｜ 使用頻率：常","用 si 加愈過去式提出沒有發生的過去條件，主句若談過去結果，就用過去條件式。愈過去式由未完成過去式的助動詞加過去分詞組成；過去條件式則把助動詞換成現在條件式。","假設原因在過去，結果也可能在現在。如 Si j’avais pris ce train, je serais déjà à Paris。主句 serais 表示目前的狀態。","常見誤用：Si j\'avais eu ton numéro, je t\'aurais appeler.　修正：Si j\'avais eu ton numéro, je t\'aurais appelé."],"examples":[{"text":"Si j’avais vu l’annonce, j’aurais envoyé ma candidature avant lundi.","zh":"如果我當時看到了公告，我就會在週一前寄出申請。"},{"text":"Si j’avais su, je serais venu.","zh":"要是我當時知道，我就來了。（男性說話者）"},{"text":"Si j\'avais eu ton numéro, je t\'aurais appelé.","zh":"如果我當時有你的號碼，就會打給你。"}],"questions":[{"id":"context-1","type":"choice","prompt":"Si nous ___ réservé plus tôt, nous aurions payé moins cher.","options":["aurions","avions","avons"],"answers":["avions"],"explanation":"標示過去反事實條件，需要愈過去式 avions réservé。"},{"id":"context-2","type":"choice","prompt":"Si elle avait été prévenue, elle ___ à la réunion hier.","op
