sonne ne répond.","answers":["beau"],"explanation":"avoir beau 加原形，下一分句才交代即使試過仍無法改變的結果。beau 為固定形式。 完整寫法是「Elles ont beau appeler, personne ne répond.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nJ\'ai beau ___ le mail, je ne trouve pas la date.","options":["relu","relire"],"answers":["relire"],"explanation":"avoir beau 加原形，下一分句才交代即使試過仍無法改變的結果。beau 為固定形式。 完整寫法是「J\'ai beau relire le mail, je ne trouve pas la date.」。"},{"id":"transfer","type":"choice","prompt":"你已反覆嘗試聯絡宿舍，仍無人接聽。","options":["Il suffit que j\'appelle la résidence pour obtenir une réponse.","J\'ai beau appeler la résidence, personne ne répond."],"answers":["J\'ai beau appeler la résidence, personne ne répond."],"explanation":"avoir beau 加原形，下一分句才交代即使試過仍無法改變的結果。beau 為固定形式。 此處要表達的意思對應「J\'ai beau appeler la résidence, personne ne répond.」。"}]},{"language":"fr","id":"futur-anterieur","title":"先將來時與未來事件的先後","explanation":["CEFR B2 ｜ 使用頻率：中","avoir 或 être 的簡單未來式加過去分詞，以未來時間為參照，說明到時已完成的事。","比較「Quand j\'aurai signé, je vous appellerai.」（我簽完後會打給您。）和「Je vous appellerai avant de signer.」（我會在簽名前打給您。）。","常見誤用：D\'ici lundi, nous aurons recevoir toutes les réponses.　修正：D\'ici lundi, nous aurons reçu toutes les réponses."],"examples":[{"text":"Quand j\'aurai signé, je vous appellerai.","zh":"我簽完後會打給您。"},{"text":"Je vous appellerai avant de signer.","zh":"我會在簽名前打給您。"},{"text":"D\'ici lundi, nous aurons reçu toutes les réponses.","zh":"到週一我們就會收齊回覆。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我簽完後會打給您。」？","options":["Je vous appellerai avant de signer.","Quand j\'aurai signé, je vous appellerai."],"answers":["Quand j\'aurai signé, je vous appellerai."],"explanation":"第一種意思是「我簽完後會打給您。」，另一種是「我會在簽名前打給您。」。avoir 或 être 的簡單未來式加過去分詞，以未來時間為參照，說明到時已完成的事。"},{"id":"complete-form","type":"fill","prompt":"到週一我們就會收齊回覆。\\n請從「reçu／recevoir」選出合適寫法，只填空格。\\nD\'ici lundi, nous aurons ___ toutes les réponses.","answers":["reçu"],"explanation":"avoir 或 être 的簡單未來式加過去分詞，以未來時間為參照，說明到時已完成的事。 完整寫法是「D\'ici lundi, nous aurons reçu toutes les réponses.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nQuand elles seront ___, nous ouvrirons.","options":["arrivé","arrivées"],"answers":["arrivées"],"explanation":"avoir 或 être 的簡單未來式加過去分詞，以未來時間為參照，說明到時已完成的事。 完整寫法是「Quand elles seront arrivées, nous ouvrirons.」。"},{"id":"transfer","type":"choice","prompt":"你要等收據全部到齊，再讓行政人員結案。","options":["Vous pourrez clore le dossier avant que je reçoive les justificatifs.","Vous pourrez clore le dossier quand j\'aurai reçu tous les justificatifs."],"answers":["Vous pourrez clore le dossier quand j\'aurai reçu tous les justificatifs."],"explanation":"avoir 或 être 的簡單未來式加過去分詞，以未來時間為參照，說明到時已完成的事。 此處要表達的意思對應「Vous pourrez clore le dossier quand j\'aurai reçu tous les justificatifs.」。"}]},{"language":"fr","id":"restriction-que","title":"ne…que 的限制範圍","explanation":["CEFR B1 ｜ 使用頻率：高","ne…que 表「只」，que 放在被限制的成分之前。ne…pas 則否定動作或狀態。","比較「Je ne travaille que le lundi.」（我只有週一工作。）和「Je ne travaille pas le lundi.」（我週一不工作。）。","常見誤用：Je n\'ai pas trois reçus, pas un de plus.　修正：Je n\'ai que trois reçus, pas un de plus."],"examples":[{"text":"Je ne travaille que le lundi.","zh":"我只有週一工作。"},{"text":"Je ne travaille pas le lundi.","zh":"我週一不工作。"},{"text":"Je n\'ai que trois reçus, pas un de plus.","zh":"我只有三張收據，一張也沒多。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我只有週一工作。」？","options":["Je ne travaille pas le lundi.","Je ne travaille que le lundi."],"answers":["Je ne travaille que le lundi."],"explanation":"第一種意思是「我只有週一工作。」，另一種是「我週一不工作。」。ne…que 表「只」，que 放在被限制的成分之前。ne…pas 則否定動作或狀態。"},{"id":"complete-form","type":"fill","prompt":"我只有三張收據，一張也沒多。\\n請從「pas／que」選出合適寫法，只填空格。\\nJe n\'ai ___ trois reçus, pas un de plus.","answers":["que"],"explanation":"ne…que 表「只」，que 放在被限制的成分之前。ne…pas 則否定動作或狀態。 完整寫法是「Je n\'ai que trois reçus, pas un de plus.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nElle ne vient ___ le soir.","options":["que","quoi"],"answers":["que"],"explanation":"ne…que 表「只」，que 放在被限制的成分之前。ne…pas 則否定動作或狀態。 完整寫法是「Elle ne vient que le soir.」。"},{"id":"transfer","type":"choice","prompt":"要交代你「只有週二有空」，限制的是日期。","options":["Je ne suis pas libre le mardi.","Je ne suis libre que le mardi."],"answers":["Je ne suis libre que le mardi."],"explanation":"ne…que 表「只」，que 放在被限制的成分之前。ne…pas 則否定動作或狀態。 此處要表達的意思對應「Je ne suis libre que le mardi.」。"}]},{"language":"fr","id":"objectif-meme-sujet","title":"souhaiter 與兩個動作的主詞","explanation":["CEFR B1 ｜ 使用頻率：高","souhaiter 加原形表示主詞自己的意願；希望另一個人去做，要寫 que 加另一主詞與虛擬式。","比較「Je souhaite vous envoyer une confirmation.」（我想寄一份確認信給您。）和「Je souhaite que vous m\'envoyiez une confirmation.」（我希望您寄一份確認信給我。）。","常見誤用：Elle veut que signer elle-même le courrier.　修正：Elle veut signer elle-même le courrier."],"examples":[{"text":"Je souhaite vous envoyer une confirmation.","zh":"我想寄一份確認信給您。"},{"text":"Je souhaite que vous m\'envoyiez une confirmation.","zh":"我希望您寄一份確認信給我。"},{"text":"Elle veut signer elle-même le courrier.","zh":"她想親自簽署信件。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我想寄一份確認信給您。」？","options":["Je souhaite vous envoyer une confirmation.","Je souhaite que vous m\'envoyiez une confirmation."],"answers":["Je souhaite vous envoyer une confirmation."],"explanation":"第一種意思是「我想寄一份確認信給您。」，另一種是「我希望您寄一份確認信給我。」。souhaiter 加原形表示主詞自己的意願；希望另一個人去做，要寫 que 加另一主詞與虛擬式。"},{"id":"complete-form","type":"fill","prompt":"她想親自簽署信件。\\n請從「signer／que signer」選出合適寫法，只填空格。\\nElle veut ___ elle-même le courrier.","answers":["signer"],"explanation":"souhaiter 加原形表示主詞自己的意願；希望另一個人去做，要寫 que 加另一主詞與虛擬式。 完整寫法是「Elle veut signer elle-même le courrier.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nNous souhaitons que vous ___ présents.","options":["soyez","êtes"],"answers":["soyez"],"explanation":"souhaiter 加原形表示主詞自己的意願；希望另一個人去做，要寫 que 加另一主詞與虛擬式。 完整寫法是「Nous souhaitons que vous soyez présents.」。"},{"id":"transfer","type":"choice","prompt":"你希望收到宿舍寄來的確認信，寄件人應該是對方。","options":["Je souhaiterais que vous m\'envoyiez une confirmation écrite.","Je souhaiterais vous envoyer une confirmation écrite."],"answers":["Je souhaiterais que vous m\'envoyiez une confirmation écrite."],"explanation":"souhaiter 加原形表示主詞自己的意願；希望另一個人去做，要寫 que 加另一主詞與虛擬式。 此處要表達的意思對應「Je souhaiterais que vous m\'envoyiez une confirmation écrite.」。"}]},{"language":"fr","id":"a-force-de","title":"à force de 與反覆行動的結果","explanation":["CEFR B2 ｜ 使用頻率：高","à force de 加名詞或原形，指出反覆行動累積出了某個結果。pour 加原形通常給出做事的目的。","比較「À force de répéter, nous avons gagné en précision.」（經過一次次排練，我們越來越精準。）和「Nous répétons pour gagner en précision.」（我們排練是為了更精準。）。","常見誤用：À force à vérifier les chiffres, elle a repéré l\'erreur.　修正：À force de vérifier les chiffres, elle a repéré l\'erreur."],"examples":[{"text":"À force de répéter, nous avons gagné en précision.","zh":"經過一次次排練，我們越來越精準。"},{"text":"Nous répétons pour gagner en précision.","zh":"我們排練是為了更精準。"},{"text":"À force de vérifier les chiffres, elle a repéré l\'erreur.","zh":"她反覆核對數字，終於發現錯誤。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「經過一次次排練，我們越來越精準。」？","options":["Nous répétons pour gagner en précision.","À force de répéter, nous avons gagné en précision."],"answers":["À force de répéter, nous avons gagné en précision."],"explanation":"第一種意思是「經過一次次排練，我們越來越精準。」，另一種是「我們排練是為了更精準。」。à force de 加名詞或原形，指出反覆行動累積出了某個結果。pour 加原形通常給出做事的目的。"},{"id":"complete-form","type":"fill","prompt":"她反覆核對數字，終於發現錯誤。\\n請從「de／à」選出合適寫法，只填空格。\\nÀ force ___ vérifier les chiffres, elle a repéré l\'erreur.","answers":["de"],"explanation":"à force de 加名詞或原形，指出反覆行動累積出了某個結果。pour 加原形通常給出做事的目的。 完整寫法是「À force de vérifier les chiffres, elle a repéré l\'erreur.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nÀ force de ___, il s\'est blessé.","options":["couru","courir"],"answers":["courir"],"explanation":"à force de 加名詞或原形，指出反覆行動累積出了某個結果。pour 加原形通常給出做事的目的。 完整寫法是「À force de courir, il s\'est blessé.」。"},{"id":"transfer","type":"choice","prompt":"想說老師經過一次次修改，最終找到適合初學者的教法。","options":["Elle va adapter le cours pour chercher une bonne méthode.","À force d\'adapter le cours, elle a trouvé une bonne méthode."],"answers":["À force d\'adapter le cours, elle a trouvé une bonne méthode."],"explanation":"à force de 加名詞或原形，指出反覆行動累積出了某個結果。pour 加原形通常給出做事的目的。 此處要表達的意思對應「À force d\'adapter le cours, elle a trouvé une bonne méthode.」。"}]},{"language":"fr","id":"avant-apres","title":"après que 與正式書寫的直陳式","explanation":["CEFR C1 ｜ 使用頻率：中","正式法文的 après que 將事件視為已完成或屆時已完成，接直陳式；avant que 指尚未發生的界線，接虛擬式。","比較「Nous paierons après que vous aurez envoyé le devis.」（等您寄出估價單後我們才會付款。）和「Nous paierons avant que vous envoyiez le devis.」（我們會在您寄估價單前就付款。）。","常見誤用：Nous répondrons après que le comité ait rendu son avis.　修正：Nous répondrons après que le comité aura rendu son avis."],"examples":[{"text":"Nous paierons après que vous aurez envoyé le devis.","zh":"等您寄出估價單後我們才會付款。"},{"text":"Nous paierons avant que vous envoyiez le devis.","zh":"我們會在您寄估價單前就付款。"},{"text":"Nous répondrons après que le comité aura rendu son avis.","zh":"委員會提出意見後，我們才會回覆。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「等您寄出估價單後我們才會付款。」？","options":["Nous paierons avant que vous envoyiez le devis.","Nous paierons après que vous aurez envoyé le devis."],"answers":["Nous paierons après que vous aurez envoyé le devis."],"explanation":"第一種意思是「等您寄出估價單後我們才會付款。」，另一種是「我們會在您寄估價單前就付款。」。正式法文的 après que 將事件視為已完成或屆時已完成，接直陳式；avant que 指尚未發生的界線，接虛擬式。"},{"id":"complete-form","type":"fill","prompt":"委員會提出意見後，我們才會回覆。\\n請從「ait／aura」選出合適寫法，只填空格。\\nNous répondrons après que le comité ___ rendu son avis.","answers":["aura"],"explanation":"正式法文的 après que 將事件視為已完成或屆時已完成，接直陳式；avant que 指尚未發生的界線，接虛擬式。 完整寫法是「Nous répondrons après que le comité aura rendu son avis.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nAprès que la décision ___ annoncée, ils sont sortis.","options":["a été","ait été"],"answers":["a été"],"explanation":"正式法文的 après que 將事件視為已完成或屆時已完成，接直陳式；avant que 指尚未發生的界線，接虛擬式。 完整寫法是「Après que la décision a été annoncée, ils sont sortis.」。"},{"id":"transfer","type":"choice","prompt":"正式信中把「委員會先提意見，我們再回覆」寫清楚。","options":["Nous répondrons avant que le comité rende son avis.","Nous répondrons après que le comité aura rendu son avis."],"answers":["Nous répondrons après que le comité aura rendu son avis."],"explanation":"正式法文的 après que 將事件視為已完成或屆時已完成，接直陳式；avant que 指尚未發生的界線，接虛擬式。 此處要表達的意思對應「Nous répondrons après que le comité aura rendu son avis.」。"}]},{"language":"fr","id":"sans-que","title":"sans que 與未伴隨發生的事","explanation":["CEFR B2 ｜ 使用頻率：高","sans que 加主詞和虛擬式，說主句發生了，另一件本可能伴隨的事卻沒發生。sans 加原形則常共用主詞。","比較「Le tarif a changé sans que nous soyons prévenus.」（費率改了，我們卻沒接獲通知。）和「Nous avons changé le tarif sans prévenir le groupe.」（我們改了費率，沒通知小組。）。","常見誤用：Elle est partie sans que je peux la remercier.　修正：Elle est partie sans que je puisse la remercier."],"examples":[{"text":"Le tarif a changé sans que nous soyons prévenus.","zh":"費率改了，我們卻沒接獲通知。"},{"text":"Nous avons changé le tarif sans prévenir le groupe.","zh":"我們改了費率，沒通知小組。"},{"text":"Elle est partie sans que je puisse la remercier.","zh":"她走了，我來不及向她道謝。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「費率改了，我們卻沒接獲通知。」？","options":["Le tarif a changé sans que nous soyons prévenus.","Nous avons changé le tarif sans prévenir le groupe."],"answers":["Le tarif a changé sans que nous soyons prévenus."],"explanation":"第一種意思是「費率改了，我們卻沒接獲通知。」，另一種是「我們改了費率，沒通知小組。」。sans que 加主詞和虛擬式，說主句發生了，另一件本可能伴隨的事卻沒發生。sans 加原形則常共用主詞。"},{"id":"complete-form","type":"fill","prompt":"她走了，我來不及向她道謝。\\n請從「puisse／peux」選出合適寫法，只填空格。\\nElle est partie sans que je ___ la remercier.","answers":["puisse"],"explanation":"sans que 加主詞和虛擬式，說主句發生了，另一件本可能伴隨的事卻沒發生。sans 加原形則常共用主詞。 完整寫法是「Elle est partie sans que je puisse la remercier.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLe piano a été déplacé sans que j\'en ___ connaissance.","options":["ai","aie"],"answers":["aie"],"explanation":"sans que 加主詞和虛擬式，說主句發生了，另一件本可能伴隨的事卻沒發生。sans 加原形則常共用主詞。 完整寫法是「Le piano a été déplacé sans que j\'en aie connaissance.」。"},{"id":"transfer","type":"choice","prompt":"你要向宿舍註明調整了維修日期卻沒通知你。","options":["La date a changé sans que j\'en sois informé.","J\'ai changé la date sans en informer la résidence."],"answers":["La date a changé sans que j\'en sois informé."],"explanation":"sans que 加主詞和虛擬式，說主句發生了，另一件本可能伴隨的事卻沒發生。sans 加原形則常共用主詞。 此處要表達的意思對應「La date a changé sans que j\'en sois informé.」。"}]},{"language":"fr","id":"pourvu","title":"pourvu que 的條件與願望","explanation":["CEFR B2 ｜ 使用頻率：中","pourvu que 加虛擬式，接在主句後是足以接受的條件，獨立成句則常表達願望。","比較「Tu peux entrer pourvu que tu aies un badge.」（只要有識別證，你就可以進去。）和「Pourvu que tu aies ton badge !」（但願你有帶識別證！）。","常見誤用：Nous accepterons pourvu que le devis est écrit.　修正：Nous accepterons pourvu que le devis soit écrit."],"examples":[{"text":"Tu peux entrer pourvu que tu aies un badge.","zh":"只要有識別證，你就可以進去。"},{"text":"Pourvu que tu aies ton badge !","zh":"但願你有帶識別證！"},{"text":"Nous accepterons pourvu que le devis soit écrit.","zh":"只要估價單是書面的，我們就接受。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「只要有識別證，你就可以進去。」？","options":["Pourvu que tu aies ton badge !","Tu peux entrer pourvu que tu aies un badge."],"answers":["Tu peux entrer pourvu que tu aies un badge."],"explanation":"第一種意思是「只要有識別證，你就可以進去。」，另一種是「但願你有帶識別證！」。pourvu que 加虛擬式，接在主句後是足以接受的條件，獨立成句則常表達願望。"},{"id":"complete-form","type":"fill","prompt":"只要估價單是書面的，我們就接受。\\n請從「est／soit」選出合適寫法，只填空格。\\nNous accepterons pourvu que le devis ___ écrit.","answers":["soit"],"explanation":"pourvu que 加虛擬式，接在主句後是足以接受的條件，獨立成句則常表達願望。 完整寫法是「Nous accepterons pourvu que le devis soit écrit.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nPourvu que nous ___ finir ce soir !","options":["pouvons","puissions"],"answers":["puissions"],"explanation":"pourvu que 加虛擬式，接在主句後是足以接受的條件，獨立成句則常表達願望。 完整寫法是「Pourvu que nous puissions finir ce soir !」。"},{"id":"transfer","type":"choice","prompt":"表達願望「但願管理員帶著鑰匙！」。","options":["Pourvu que le gardien ait sa clé !","Puisque le gardien a sa clé, entrons."],"answers":["Pourvu que le gardien ait sa clé !"],"explanation":"pourvu que 加虛擬式，接在主句後是足以接受的條件，獨立成句則常表達願望。 此處要表達的意思對應「Pourvu que le gardien ait sa clé !」。"}]},{"language":"fr","id":"moins-que","title":"à moins que 與使安排失效的例外","explanation":["CEFR C1 ｜ 使用頻率：中","à moins que 加虛擬式，提出會讓原安排失效的例外。même si 則表示即使例外成立也不改變安排。","比較「Je viendrai à moins que le train soit supprimé.」（除非火車取消，否則我會來。）和「Je viendrai même si le train est supprimé.」（即使火車取消，我也會來。）。","常見誤用：Nous voterons lundi à moins qu\'il faut reporter la séance.　修正：Nous voterons lundi à moins qu\'il faille reporter la séance."],"examples":[{"text":"Je viendrai à moins que le train soit supprimé.","zh":"除非火車取消，否則我會來。"},{"text":"Je viendrai même si le train est supprimé.","zh":"即使火車取消，我也會來。"},{"text":"Nous voterons lundi à moins qu\'il faille reporter la séance.","zh":"除非必須延期，否則我們週一表決。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「除非火車取消，否則我會來。」？","options":["Je viendrai même si le train est supprimé.","Je viendrai à moins que le train soit supprimé."],"answers":["Je viendrai à moins que le train soit supprimé."],"explanation":"第一種意思是「除非火車取消，否則我會來。」，另一種是「即使火車取消，我也會來。」。à moins que 加虛擬式，提出會讓原安排失效的例外。même si 則表示即使例外成立也不改變安排。"},{"id":"complete-form","type":"fill","prompt":"除非必須延期，否則我們週一表決。\\n請從「faut／faille」選出合適寫法，只填空格。\\nNous voterons lundi à moins qu\'il ___ reporter la séance.","answers":["faille"],"explanation":"à moins que 加虛擬式，提出會讓原安排失效的例外。même si 則表示即使例外成立也不改變安排。 完整寫法是「Nous voterons lundi à moins qu\'il faille reporter la séance.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nNous signerons à moins que vous ___ une objection.","options":["ayez","avez"],"answers":["ayez"],"explanation":"à moins que 加虛擬式，提出會讓原安排失效的例外。même si 則表示即使例外成立也不改變安排。 完整寫法是「Nous signerons à moins que vous ayez une objection.」。"},{"id":"transfer","type":"choice","prompt":"你會準時到校，唯一例外是列車被取消。","options":["J\'arriverai à l\'heure à moins que le train soit supprimé.","J\'arriverai à l\'heure même si le train est supprimé."],"answers":["J\'arriverai à l\'heure à moins que le train soit supprimé."],"explanation":"à moins que 加虛擬式，提出會讓原安排失效的例外。même si 則表示即使例外成立也不改變安排。 此處要表達的意思對應「J\'arriverai à l\'heure à moins que le train soit supprimé.」。"}]},{"language":"fr","id":"inversion-complexe","title":"正式問句中的複合倒裝","explanation":["CEFR B2 ｜ 使用頻率：高","主詞是名詞時，正式問句可以先寫主詞，再將對應代名詞以連字號接在動詞後。兩個母音之間有時需插入 -t-。","比較「Quand la séance commence-t-elle ?」（會議幾點開始？）和「Quand la séance a-t-elle commencé ?」（會議是幾點開始的？）。","常見誤用：Les dossiers sont-elles prêts ?　修正：Les dossiers sont-ils prêts ?"],"examples":[{"text":"Quand la séance commence-t-elle ?","zh":"會議幾點開始？"},{"text":"Quand la séance a-t-elle commencé ?","zh":"會議是幾點開始的？"},{"text":"Les dossiers sont-ils prêts ?","zh":"文件都備齊了嗎？"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「會議幾點開始？」？","options":["Quand la séance commence-t-elle ?","Quand la séance a-t-elle commencé ?"],"answers":["Quand la séance commence-t-elle ?"],"explanation":"第一種意思是「會議幾點開始？」，另一種是「會議是幾點開始的？」。主詞是名詞時，正式問句可以先寫主詞，再將對應代名詞以連字號接在動詞後。兩個母音之間有時需插入 -t-。"},{"id":"complete-form","type":"fill","prompt":"文件都備齊了嗎？\\n請從「elles／ils」選出合適寫法，只填空格。\\nLes dossiers sont-___ prêts ?","answers":["ils"],"explanation":"主詞是名詞時，正式問句可以先寫主詞，再將對應代名詞以連字號接在動詞後。兩個母音之間有時需插入 -t-。 完整寫法是「Les dossiers sont-ils prêts ?」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nCette mesure a-___ un effet mesurable ?","options":["t-il","t-elle"],"answers":["t-elle"],"explanation":"主詞是名詞時，正式問句可以先寫主詞，再將對應代名詞以連字號接在動詞後。兩個母音之間有時需插入 -t-。 完整寫法是「Cette mesure a-t-elle un effet mesurable ?」。"},{"id":"transfer","type":"choice","prompt":"主持活動時，正式詢問某位女講者將在幾點抵達。","options":["À quelle heure la conférencière arrivera-t-elle ?","À quelle heure la conférencière est-elle arrivée ?"],"answers":["À quelle heure la conférencière arrivera-t-elle ?"],"explanation":"主詞是名詞時，正式問句可以先寫主詞，再將對應代名詞以連字號接在動詞後。兩個母音之間有時需插入 -t-。 此處要表達的意思對應「À quelle heure la conférencière arrivera-t-elle ?」。"}]},{"language":"fr","id":"infinitif-passe","title":"完成不定詞與先行動作","explanation":["CEFR C1 ｜ 使用頻率：中","用 avoir 或 être 的原形加分詞，嵌入與主句共用主詞的先行動作。不定詞現在式則未必已發生。","比較「Je regrette d\'avoir promis une date.」（我後悔已經答應了日期。）和「J\'hésite à promettre une date.」（我還在猶豫要不要答應日期。）。","常見誤用：Après avoir relire le texte, elle a signé.　修正：Après avoir relu le texte, elle a signé."],"examples":[{"text":"Je regrette d\'avoir promis une date.","zh":"我後悔已經答應了日期。"},{"text":"J\'hésite à promettre une date.","zh":"我還在猶豫要不要答應日期。"},{"text":"Après avoir relu le texte, elle a signé.","zh":"她重讀文字後才簽。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我後悔已經答應了日期。」？","options":["Je regrette d\'avoir promis une date.","J\'hésite à promettre une date."],"answers":["Je regrette d\'avoir promis une date."],"explanation":"第一種意思是「我後悔已經答應了日期。」，另一種是「我還在猶豫要不要答應日期。」。用 avoir 或 être 的原形加分詞，嵌入與主句共用主詞的先行動作。不定詞現在式則未必已發生。"},{"id":"complete-form","type":"fill","prompt":"她重讀文字後才簽。\\n請從「relire／relu」選出合適寫法，只填空格。\\nAprès avoir ___ le texte, elle a signé.","answers":["relu"],"explanation":"用 avoir 或 être 的原形加分詞，嵌入與主句共用主詞的先行動作。不定詞現在式則未必已發生。 完整寫法是「Après avoir relu le texte, elle a signé.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nIl reconnaît avoir ___ le justificatif.","options":["oublier","oublié"],"answers":["oublié"],"explanation":"用 avoir 或 être 的原形加分詞，嵌入與主句共用主詞的先行動作。不定詞現在式則未必已發生。 完整寫法是「Il reconnaît avoir oublié le justificatif.」。"},{"id":"transfer","type":"choice","prompt":"你在面試中承認自己當初漏算了交通費。","options":["Je pense oublier les frais de transport si personne ne me le rappelle.","Je reconnais avoir oublié les frais de transport."],"answers":["Je reconnais avoir oublié les frais de transport."],"explanation":"用 avoir 或 être 的原形加分詞，嵌入與主句共用主詞的先行動作。不定詞現在式則未必已發生。 此處要表達的意思對應「Je reconnais avoir oublié les frais de transport.」。"}]},{"language":"fr","id":"subjonctif-passe","title":"虛擬式過去與已完成的事件","explanation":["CEFR C1 ｜ 使用頻率：中","會引出虛擬式的情緒或判斷，若指涉已完成事件，改用 avoir 或 être 的虛擬式加分詞。","比較「Je suis ravi qu\'elle soit venue.」（我很高興她已經來過。）和「Je suis ravi qu\'elle puisse venir demain.」（我很高興她明天能來。）。","常見誤用：Je regrette qu\'elle est partie avant le débat.　修正：Je regrette qu\'elle soit partie avant le débat."],"examples":[{"text":"Je suis ravi qu\'elle soit venue.","zh":"我很高興她已經來過。"},{"text":"Je suis ravi qu\'elle puisse venir demain.","zh":"我很高興她明天能來。"},{"text":"Je regrette qu\'elle soit partie avant le débat.","zh":"我很遺憾她在辯論前離開了。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我很高興她已經來過。」？","options":["Je suis ravi qu\'elle soit venue.","Je suis ravi qu\'elle puisse venir demain."],"answers":["Je suis ravi qu\'elle soit venue."],"explanation":"第一種意思是「我很高興她已經來過。」，另一種是「我很高興她明天能來。」。會引出虛擬式的情緒或判斷，若指涉已完成事件，改用 avoir 或 être 的虛擬式加分詞。"},{"id":"complete-form","type":"fill","prompt":"我很遺憾她在辯論前離開了。\\n請從「est／soit」選出合適寫法，只填空格。\\nJe regrette qu\'elle ___ partie avant le débat.","answers":["soit"],"explanation":"會引出虛擬式的情緒或判斷，若指涉已完成事件，改用 avoir 或 être 的虛擬式加分詞。 完整寫法是「Je regrette qu\'elle soit partie avant le débat.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nJe suis heureux que nous ___ trouvé un accord.","options":["ayons","avons"],"answers":["ayons"],"explanation":"會引出虛擬式的情緒或判斷，若指涉已完成事件，改用 avoir 或 être 的虛擬式加分詞。 完整寫法是「Je suis heureux que nous ayons trouvé un accord.」。"},{"id":"transfer","type":"choice","prompt":"對方已經接受邀請。你為這個既成事實感到高興。","options":["J\'espère que vous accepterez notre invitation.","Je suis heureux que vous ayez accepté notre invitation."],"answers":["Je suis heureux que vous ayez accepté notre invitation."],"explanation":"會引出虛擬式的情緒或判斷，若指涉已完成事件，改用 avoir 或 être 的虛擬式加分詞。 此處要表達的意思對應「Je suis heureux que vous ayez accepté notre invitation.」。"}]},{"language":"fr","id":"mise-relief","title":"c\'est…qui／que 的焦點","explanation":["CEFR B2 ｜ 使用頻率：高","c\'est…qui 用於聚焦後段主詞；c\'est…que 用於受詞或時間等成分。這會決定電話是誰打給誰。","比較「C\'est le gardien qui m\'a appelé.」（是管理員打給我的。）和「C\'est le gardien que j\'ai appelé.」（我打給的人是管理員。）。","常見誤用：C\'est mardi qui nous avons voté.　修正：C\'est mardi que nous avons voté."],"examples":[{"text":"C\'est le gardien qui m\'a appelé.","zh":"是管理員打給我的。"},{"text":"C\'est le gardien que j\'ai appelé.","zh":"我打給的人是管理員。"},{"text":"C\'est mardi que nous avons voté.","zh":"我們是在週二表決的。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「是管理員打給我的。」？","options":["C\'est le gardien que j\'ai appelé.","C\'est le gardien qui m\'a appelé."],"answers":["C\'est le gardien qui m\'a appelé."],"explanation":"第一種意思是「是管理員打給我的。」，另一種是「我打給的人是管理員。」。c\'est…qui 用於聚焦後段主詞；c\'est…que 用於受詞或時間等成分。這會決定電話是誰打給誰。"},{"id":"complete-form","type":"fill","prompt":"我們是在週二表決的。\\n請從「que／qui」選出合適寫法，只填空格。\\nC\'est mardi ___ nous avons voté.","answers":["que"],"explanation":"c\'est…qui 用於聚焦後段主詞；c\'est…que 用於受詞或時間等成分。這會決定電話是誰打給誰。 完整寫法是「C\'est mardi que nous avons voté.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nC\'est cette ligne ___ fausse le total.","options":["que","qui"],"answers":["qui"],"explanation":"c\'est…qui 用於聚焦後段主詞；c\'est…que 用於受詞或時間等成分。這會決定電話是誰打給誰。 完整寫法是「C\'est cette ligne qui fausse le total.」。"},{"id":"transfer","type":"choice","prompt":"管理員打給你，不是你主動打過去。","options":["C\'est le gardien qui m\'a appelé.","C\'est le gardien que j\'ai appelé."],"answers":["C\'est le gardien qui m\'a appelé."],"explanation":"c\'est…qui 用於聚焦後段主詞；c\'est…que 用於受詞或時間等成分。這會決定電話是誰打給誰。 此處要表達的意思對應「C\'est le gardien qui m\'a appelé.」。"}]},{"language":"fr","id":"ne-litteraire","title":"文雅語體中有否定意義的單獨 ne","explanation":["CEFR C2 ｜ 使用頻率：低","pouvoir、oser、cesser 等在文雅書寫中可以單用 ne 表否定。不能因為看不到 pas 就解讀成肯定。","比較「Je ne puis approuver ce montant.」（我無法核准這個金額。）和「Je puis approuver ce montant.」（我可以核准這個金額。）。","常見誤用：Elle ne cesser de demander un calendrier.　修正：Elle ne cesse de demander un calendrier."],"examples":[{"text":"Je ne puis approuver ce montant.","zh":"我無法核准這個金額。"},{"text":"Je puis approuver ce montant.","zh":"我可以核准這個金額。"},{"text":"Elle ne cesse de demander un calendrier.","zh":"她不斷要求提供時程。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我無法核准這個金額。」？","options":["Je puis approuver ce montant.","Je ne puis approuver ce montant."],"answers":["Je ne puis approuver ce montant."],"explanation":"第一種意思是「我無法核准這個金額。」，另一種是「我可以核准這個金額。」。pouvoir、oser、cesser 等在文雅書寫中可以單用 ne 表否定。不能因為看不到 pas 就解讀成肯定。"},{"id":"complete-form","type":"fill","prompt":"她不斷要求提供時程。\\n請從「cesse／cesser」選出合適寫法，只填空格。\\nElle ne ___ de demander un calendrier.","answers":["cesse"],"explanation":"pouvoir、oser、cesser 等在文雅書寫中可以單用 ne 表否定。不能因為看不到 pas 就解讀成肯定。 完整寫法是「Elle ne cesse de demander un calendrier.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nJe n\'___ interrompre la séance.","options":["ose","oser"],"answers":["ose"],"explanation":"pouvoir、oser、cesser 等在文雅書寫中可以單用 ne 表否定。不能因為看不到 pas 就解讀成肯定。 完整寫法是「Je n\'ose interrompre la séance.」。"},{"id":"transfer","type":"choice","prompt":"收到正式回覆「Nous ne pouvons garantir ce délai」。應如何理解？","options":["Le délai n\'est pas garanti.","Le délai est garanti."],"answers":["Le délai n\'est pas garanti."],"explanation":"pouvoir、oser、cesser 等在文雅書寫中可以單用 ne 表否定。不能因為看不到 pas 就解讀成肯定。 此處要表達的意思對應「Le délai n\'est pas garanti.」。"}]},{"language":"fr","id":"encore-faut","title":"encore faut-il que 與必要前提","explanation":["CEFR C1 ｜ 使用頻率：中","encore faut-il que 加虛擬式補上必要前提，暗示前面的提案雖可行仍有條件。encore 加時間量則表示還要多久。","比較「Chacun peut postuler. Encore faut-il connaître la date limite.」（人人都能申請，前提是得知道截止日。）和「Chacun connaît déjà la date limite.」（每個人都已經知道截止日。）。","常見誤用：Encore faut-il que nous avons les moyens de tester le plan.　修正：Encore faut-il que nous ayons les moyens de tester le plan."],"examples":[{"text":"Chacun peut postuler. Encore faut-il connaître la date limite.","zh":"人人都能申請，前提是得知道截止日。"},{"text":"Chacun connaît déjà la date limite.","zh":"每個人都已經知道截止日。"},{"text":"Encore faut-il que nous ayons les moyens de tester le plan.","zh":"前提是我們得有資源測試計畫。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「人人都能申請，前提是得知道截止日。」？","options":["Chacun peut postuler. Encore faut-il connaître la date limite.","Chacu
