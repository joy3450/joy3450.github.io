tions":["serait venue","serait venu","aurait venue"],"answers":["serait venue"],"explanation":"venir 用 être，過去條件式是 serait venue，並與陰性主詞配合。"},{"id":"complete-form","type":"fill","prompt":"如果我當時有你的號碼，就會打給你。 依語境填入 appelé 或 appeler。\\nSi j\'avais eu ton numéro, je t\'aurais ___.","answers":["appelé"],"explanation":"用 si 加愈過去式提出沒有發生的過去條件，主句若談過去結果，就用過去條件式。愈過去式由未完成過去式的助動詞加過去分詞組成；過去條件式則把助動詞換成現在條件式。 此句應寫成「Si j\'avais eu ton numéro, je t\'aurais appelé.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n要是我當時知道，我就來了。（男性說話者）\\nj’avais ｜ Si ｜ su, ｜ serais ｜ venu. ｜ je","answers":["Si j’avais su, je serais venu.","Si j’avais su, je serais venu"],"explanation":"用 si 加愈過去式提出沒有發生的過去條件，主句若談過去結果，就用過去條件式。愈過去式由未完成過去式的助動詞加過去分詞組成；過去條件式則把助動詞換成現在條件式。 在這個語境中，完整語序為「Si j’avais su, je serais venu.」。"}]},{"language":"fr","id":"relatif-preposition","title":"複合關係代名詞與介系詞","explanation":["CEFR C1 ｜ 使用頻率：常","需要保留介系詞時，可用 lequel / laquelle / lesquels / lesquelles 指回先行詞，性數跟先行詞一致。à 與 lequel、lesquels、lesquelles 合併成 auquel、auxquels、auxquelles；陰性單數仍寫 à laquelle。","先還原動詞搭配：j’ai participé à la mission。先行詞若是人，介系詞後也常用 qui，如 la collègue avec qui je travaille。","常見誤用：La table sur lequel j\'ai posé le micro est bancale.　修正：La table sur laquelle j\'ai posé le micro est bancale."],"examples":[{"text":"La mission à laquelle j’ai participé portait sur l’accès à l’éducation.","zh":"我參與的那項任務探討教育機會。"},{"text":"Voici la raison pour laquelle je postule.","zh":"這是我提出申請的原因。"},{"text":"La table sur laquelle j\'ai posé le micro est bancale.","zh":"我放麥克風的那張桌子不穩。"}],"questions":[{"id":"context-1","type":"choice","prompt":"Les problèmes ___ nous faisons face sont complexes.","options":["desquels","auxquels","lesquels"],"answers":["auxquels"],"explanation":"faire face à quelque chose，且 problèmes 是陽性複數，因此為 auxquels。"},{"id":"context-2","type":"choice","prompt":"Voici les hypothèses sur ___ repose notre analyse.","options":["lesquels","laquelle","lesquelles"],"answers":["lesquelles"],"explanation":"reposer sur 搭配 sur，hypothèses 是陰性複數，故選 lesquelles。"},{"id":"complete-form","type":"fill","prompt":"我放麥克風的那張桌子不穩。 依語境填入 laquelle 或 lequel。\\nLa table sur ___ j\'ai posé le micro est bancale.","answers":["laquelle"],"explanation":"需要保留介系詞時，可用 lequel / laquelle / lesquels / lesquelles 指回先行詞，性數跟先行詞一致。à 與 lequel、lesquels、lesquelles 合併成 auquel、auxquels、auxquelles；陰性單數仍寫 à laquelle。 此句應寫成「La table sur laquelle j\'ai posé le micro est bancale.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n這是我提出申請的原因。\\npostule. ｜ je ｜ la ｜ pour ｜ Voici ｜ laquelle ｜ raison","answers":["Voici la raison pour laquelle je postule.","Voici la raison pour laquelle je postule"],"explanation":"需要保留介系詞時，可用 lequel / laquelle / lesquels / lesquelles 指回先行詞，性數跟先行詞一致。à 與 lequel、lesquels、lesquelles 合併成 auquel、auxquels、auxquelles；陰性單數仍寫 à laquelle。 在這個語境中，完整語序為「Voici la raison pour laquelle je postule.」。"}]},{"language":"fr","id":"discours-rapporte","title":"間接引語與過去觀點","explanation":["CEFR C1 ｜ 使用頻率：常","在過去的時間點轉述當時所說的話，若採用過去敘事視角，原話現在式常轉成未完成過去式，過去已完成的事轉成愈過去式，當時尚未發生的事則用條件式表示「過去眼中的未來」。","要一起調整人稱和時間指示語。若說話者確認陳述至今仍然成立，也可以保留現在式，視角會不同。","常見誤用：Il a dit qu\'il venir le lendemain.　修正：Il a dit qu\'il viendrait le lendemain."],"examples":[{"text":"« Je reviendrai demain. » → Elle a annoncé qu’elle reviendrait le lendemain.","zh":"「我明天會回來。」轉述為「她說她隔天會回來」。"},{"text":"Elle pensait que tu viendrais.","zh":"她當時以為你會來。"},{"text":"Il a dit qu\'il viendrait le lendemain.","zh":"他說隔天會來。"}],"questions":[{"id":"context-1","type":"choice","prompt":"由過去視角轉述「J’ai déjà envoyé le dossier.」→ Il a dit qu’il ___ déjà envoyé le dossier.","options":["aura","aurait","avait"],"answers":["avait"],"explanation":"寄出資料早於「他說」的時間，用愈過去式 avait envoyé。"},{"id":"context-2","type":"choice","prompt":"隔週轉述「Nous partirons demain.」→ Ils ont dit qu’ils partiraient ___.","options":["le lendemain","la veille","hier"],"answers":["le lendemain"],"explanation":"原話中的明天，是以當時為基準的隔天，寫 le lendemain。"},{"id":"complete-form","type":"fill","prompt":"他說隔天會來。 依語境填入 viendrait 或 venir。\\nIl a dit qu\'il ___ le lendemain.","answers":["viendrait"],"explanation":"在過去的時間點轉述當時所說的話，若採用過去敘事視角，原話現在式常轉成未完成過去式，過去已完成的事轉成愈過去式，當時尚未發生的事則用條件式表示「過去眼中的未來」。 此句應寫成「Il a dit qu\'il viendrait le lendemain.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n她當時以為你會來。\\nque ｜ Elle ｜ pensait ｜ tu ｜ viendrais.","answers":["Elle pensait que tu viendrais.","Elle pensait que tu viendrais"],"explanation":"在過去的時間點轉述當時所說的話，若採用過去敘事視角，原話現在式常轉成未完成過去式，過去已完成的事轉成愈過去式，當時尚未發生的事則用條件式表示「過去眼中的未來」。 在這個語境中，完整語序為「Elle pensait que tu viendrais.」。"}]},{"language":"fr","id":"gerondif","title":"副動詞：同一主詞的兩個動作","explanation":["CEFR C1 ｜ 使用頻率：常","en 加現在分詞形成 gérondif，可表示同時進行、方法、條件等關係。副動詞的隱含主詞通常必須與主句主詞相同。tout en 依上下文也可凸顯兩件事同時成立時的反差。","現在分詞通常取現在式 nous 的詞幹加 -ant。例外有 étant、ayant、sachant。副動詞不做性數配合。","常見誤用：Elle révise en marcher vers la gare.　修正：Elle révise en marchant vers la gare."],"examples":[{"text":"En comparant les devis, nous avons repéré un écart. Nous avons réduit les coûts tout en maintenant la qualité.","zh":"我們比較報價時發現了差距。我們降低了成本，同時維持品質。"},{"text":"On apprend en faisant des erreurs.","zh":"我們在犯錯的過程中學習。"},{"text":"Elle révise en marchant vers la gare.","zh":"她邊走去車站邊複習。"}],"questions":[{"id":"context-1","type":"choice","prompt":"要表達「我搭車時弄丟了票」，哪句主詞一致？","options":["En prenant le train, mon billet a disparu.","En prenant le train, j’ai perdu mon billet.","En prenant le train, la gare était bondée."],"answers":["En prenant le train, j’ai perdu mon billet."],"explanation":"「搭車」的人和「弄丟票」的人都是 je。其餘句子的主詞是票或車站。"},{"id":"context-2","type":"choice","prompt":"Elle finance ses études en ___ le week-end.","options":["travaillé","travailler","travaillant"],"answers":["travaillant"],"explanation":"這裡 en 加現在分詞說明她靠什麼方法負擔學費。"},{"id":"complete-form","type":"fill","prompt":"她邊走去車站邊複習。 依語境填入 marchant 或 marcher。\\nElle révise en ___ vers la gare.","answers":["marchant"],"explanation":"en 加現在分詞形成 gérondif，可表示同時進行、方法、條件等關係。副動詞的隱含主詞通常必須與主句主詞相同。tout en 依上下文也可凸顯兩件事同時成立時的反差。 此句應寫成「Elle révise en marchant vers la gare.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我們在犯錯的過程中學習。\\nerreurs. ｜ faisant ｜ des ｜ On ｜ apprend ｜ en","answers":["On apprend en faisant des erreurs.","On apprend en faisant des erreurs"],"explanation":"en 加現在分詞形成 gérondif，可表示同時進行、方法、條件等關係。副動詞的隱含主詞通常必須與主句主詞相同。tout en 依上下文也可凸顯兩件事同時成立時的反差。 在這個語境中，完整語序為「On apprend en faisant des erreurs.」。"}]},{"language":"fr","id":"condition-ecrite","title":"正式書面語的限制條件","explanation":["CEFR C2 ｜ 使用頻率：進","正式書面語常用 pour peu que 加虛擬式，表示「只消……就……」的最低條件。pour autant que 加虛擬式則可限定說話者掌握資訊的範圍，如 pour autant que je sache（據我所知）。","pour peu que 雖然有 peu，並不表示「幾乎不可能」。用它時，重點在使結果成立的門檻很低。","常見誤用：Pour peu qu\'on lui donner le plan, elle trouvera.　修正：Pour peu qu\'on lui donne le plan, elle trouvera."],"examples":[{"text":"Pour peu que les partenaires s’entendent, ce projet est viable. Pour autant que je sache, aucun accord n’a été signé.","zh":"合作夥伴只要達成共識，這項計畫就可行。據我所知，雙方尚未簽署任何協議。"},{"text":"Pour autant que je sache, il viendra.","zh":"據我所知，他會來。"},{"text":"Pour peu qu\'on lui donne le plan, elle trouvera.","zh":"只要給她地圖，她就找得到。"}],"questions":[{"id":"context-1","type":"choice","prompt":"「據我所知」的固定說法是？","options":["Pour autant que je sais","Pour autant que je sache","Pour autant que je saurai"],"answers":["Pour autant que je sache"],"explanation":"用虛擬式 sache 限定知識範圍，這也是常見的固定搭配。"},{"id":"context-2","type":"choice","prompt":"哪個開頭最能表達「只消對方稍作讓步」？","options":["Après que le partenaire a fait une concession","Quoique le partenaire fasse une concession","Pour peu que le partenaire fasse une concession"],"answers":["Pour peu que le partenaire fasse une concession"],"explanation":"pour peu que 表達最低條件；quoique 是讓步，après que 是時間先後。"},{"id":"complete-form","type":"fill","prompt":"只要給她地圖，她就找得到。 依語境填入 lui donne 或 lui donner。\\nPour peu qu\'on ___ le plan, elle trouvera.","answers":["lui donne"],"explanation":"正式書面語常用 pour peu que 加虛擬式，表示「只消……就……」的最低條件。pour autant que 加虛擬式則可限定說話者掌握資訊的範圍，如 pour autant que je sache（據我所知）。 此句應寫成「Pour peu qu\'on lui donne le plan, elle trouvera.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n據我所知，他會來。\\nPour ｜ il ｜ je ｜ sache, ｜ viendra. ｜ que ｜ autant","answers":["Pour autant que je sache, il viendra.","Pour autant que je sache, il viendra"],"explanation":"正式書面語常用 pour peu que 加虛擬式，表示「只消……就……」的最低條件。pour autant que 加虛擬式則可限定說話者掌握資訊的範圍，如 pour autant que je sache（據我所知）。 在這個語境中，完整語序為「Pour autant que je sache, il viendra.」。"}]},{"language":"fr","id":"ne-expletif","title":"贅詞 ne 與真正的否定","explanation":["CEFR C2 ｜ 使用頻率：進","正式語體在 craindre que、avant que、à moins que 等結構中，可加入沒有否定意義的 ne explétif。在這些例句裡，單獨的 ne 不反轉命題；要真正否定時，需要注意 pas 等否定成分。","在此類子句省略贅詞 ne，原意維持，例如 avant qu’il parte。請避免把「單獨 ne 一定不否定」推廣到所有書面語。","常見誤用：Je crains qu\'il ne parte pas avant le vote.　修正：Je crains qu\'il ne parte avant le vote."],"examples":[{"text":"Je crains qu’il ne parte. / Je crains qu’il ne parte pas.","zh":"我擔心他會離開。／我擔心他不會離開。"},{"text":"Je crains qu’il ne parte.","zh":"我擔心他會離開。（使用贅詞 ne）"},{"text":"Je crains qu\'il ne parte avant le vote.","zh":"我擔心他會在表決前離開。"}],"questions":[{"id":"context-1","type":"choice","prompt":"« Avant que le débat ne commence » 是什麼意思？","options":["在辯論開始前","因為辯論無法開始","在辯論結束後"],"answers":["在辯論開始前"],"explanation":"avant que 引導開始前的時點，ne 是可省略的贅詞。"},{"id":"context-2","type":"choice","prompt":"要明確表達「我怕他不理解」，哪句合適？","options":["Je crains qu’il ne comprenne.","Je crains qu’il comprenne.","Je crains qu’il ne comprenne pas."],"answers":["Je crains qu’il ne comprenne pas."],"explanation":"ne… pas 真正否定 comprenne。另兩句都表示擔心他會理解。"},{"id":"complete-form","type":"fill","prompt":"我擔心他會在表決前離開。 依語境填入 ne parte 或 ne parte pas。\\nJe crains qu\'il ___ avant le vote.","answers":["ne parte"],"explanation":"正式語體在 craindre que、avant que、à moins que 等結構中，可加入沒有否定意義的 ne explétif。在這些例句裡，單獨的 ne 不反轉命題；要真正否定時，需要注意 pas 等否定成分。 此句應寫成「Je crains qu\'il ne parte avant le vote.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n我擔心他會離開。（使用贅詞 ne）\\nJe ｜ qu’il ｜ ne ｜ parte. ｜ crains","answers":["Je crains qu’il ne parte.","Je crains qu’il ne parte"],"explanation":"正式語體在 craindre que、avant que、à moins que 等結構中，可加入沒有否定意義的 ne explétif。在這些例句裡，單獨的 ne 不反轉命題；要真正否定時，需要注意 pas 等否定成分。 在這個語境中，完整語序為「Je crains qu’il ne parte.」。"}]},{"language":"fr","id":"hypothese-inversee","title":"文學與論述中的倒裝假設","explanation":["CEFR C2 ｜ 使用頻率：進","在刻意正式或文學性的語體，動詞與代名詞主詞倒裝，可以構成沒有 si 的假設。若主句指出即使條件成立也不會改變的結果，這個假設便帶有讓步意味。辨讀時應連同主句理解。","這種「即便……也……」可改寫為 même si 加直陳式；Serait-il le seul… 在此相當於 Même s’il était le seul…。","常見誤用：Doit-il annuler sa soirée, il finirait le rapport.　修正：Dût-il annuler sa soirée, il finirait le rapport."],"examples":[{"text":"Serait-il le seul à défendre cette idée, il ne changerait pas d’avis.","zh":"就算全場只有他一個人捍衛這個想法，他也不會改變立場。"},{"text":"Serait-il seul, il continuerait.","zh":"就算他孤身一人，他仍會繼續。（用倒裝假設）"},{"text":"Dût-il annuler sa soirée, il finirait le rapport.","zh":"即使非得取消晚上的約，他也會寫完報告。"}],"questions":[{"id":"context-1","type":"choice","prompt":"« Devrais-je tout recommencer, je poursuivrais ce projet. » 最接近哪個意思？","options":["我問自己是否該放棄專案。","即使必須全部重來，我也會繼續。","因為我已重新開始，所以專案完成了。"],"answers":["即使必須全部重來，我也會繼續。"],"explanation":"第一部分是倒裝的讓步假設，後半句指出即便如此仍會繼續。"},{"id":"context-2","type":"choice","prompt":"哪個較日常的句子保留 « Serait-il seul, il continuerait. » 的讓步意思？","options":["Dès qu’il sera seul, il continuera.","Il a continué parce qu’il était seul.","Même s’il était seul, il continuerait."],"answers":["Même s’il était seul, il continuerait."],"explanation":"même si 加 imparfait 搭配主句條件式，重現「就算……也……」的假設。"},{"id":"complete-form","type":"fill","prompt":"即使非得取消晚上的約，他也會寫完報告。 依語境填入 Dût-il 或 Doit-il。\\n___ annuler sa soirée, il finirait le rapport.","answers":["Dût-il"],"explanation":"在刻意正式或文學性的語體，動詞與代名詞主詞倒裝，可以構成沒有 si 的假設。若主句指出即使條件成立也不會改變的結果，這個假設便帶有讓步意味。辨讀時應連同主句理解。 此句應寫成「Dût-il annuler sa soirée, il finirait le rapport.」。"},{"id":"rebuild-sentence","type":"fill","prompt":"依中文重組句子，使用全部詞塊並保留所給標點。\\n就算他孤身一人，他仍會繼續。（用倒裝假設）\\ncontinuerait. ｜ il ｜ Serait-il ｜ seul,","answers":["Serait-il seul, il continuerait.","Serait-il seul, il continuerait"],"explanation":"在刻意正式或文學性的語體，動詞與代名詞主詞倒裝，可以構成沒有 si 的假設。若主句指出即使條件成立也不會改變的結果，這個假設便帶有讓步意味。辨讀時應連同主句理解。 在這個語境中，完整語序為「Serait-il seul, il continuerait.」。"}]},{"language":"fr","id":"avoir-age","title":"用 avoir 表達年齡","explanation":["CEFR A1 ｜ 使用頻率：高","年齡用 avoir 加數字和 ans；身分或成年狀態則用 être。動詞隨主詞變位。","比較「J\'ai vingt-trois ans.」（我二十三歲。）和「Je suis majeur.」（我已成年。）。","常見誤用：Quel âge êtes-vous ?　修正：Quel âge avez-vous ?"],"examples":[{"text":"J\'ai vingt-trois ans.","zh":"我二十三歲。"},{"text":"Je suis majeur.","zh":"我已成年。"},{"text":"Quel âge avez-vous ?","zh":"請問您幾歲？"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我二十三歲。」？","options":["Je suis majeur.","J\'ai vingt-trois ans."],"answers":["J\'ai vingt-trois ans."],"explanation":"第一種意思是「我二十三歲。」，另一種是「我已成年。」。年齡用 avoir 加數字和 ans；身分或成年狀態則用 être。動詞隨主詞變位。"},{"id":"complete-form","type":"fill","prompt":"請問您幾歲？\\n請從「avez／êtes」選出合適寫法，只填空格。\\nQuel âge ___-vous ?","answers":["avez"],"explanation":"年齡用 avoir 加數字和 ans；身分或成年狀態則用 être。動詞隨主詞變位。 完整寫法是「Quel âge avez-vous ?」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLes élèves ___ douze ans.","options":["sont","ont"],"answers":["ont"],"explanation":"年齡用 avoir 加數字和 ans；身分或成年狀態則用 être。動詞隨主詞變位。 完整寫法是「Les élèves ont douze ans.」。"},{"id":"transfer","type":"choice","prompt":"在報名表填寫欄位時，哪個問題要求你給一個年齡數字？","options":["Quel âge avez-vous ?","Êtes-vous majeur ?"],"answers":["Quel âge avez-vous ?"],"explanation":"年齡用 avoir 加數字和 ans；身分或成年狀態則用 être。動詞隨主詞變位。 此處要表達的意思對應「Quel âge avez-vous ?」。"}]},{"language":"fr","id":"ne-pas","title":"ne…pas 與 ne…plus","explanation":["CEFR A1 ｜ 使用頻率：高","標準書寫用 ne 和 pas 夾住變位動詞；母音前 ne 省成 n\'。ne…plus 則表示原來有而現在不再有。","比較「Je ne travaille pas ici.」（我沒在這裡工作。）和「Je ne travaille plus ici.」（我已不在這裡工作了。）。","常見誤用：Je ne ai pas de badge.　修正：Je n\'ai pas de badge."],"examples":[{"text":"Je ne travaille pas ici.","zh":"我沒在這裡工作。"},{"text":"Je ne travaille plus ici.","zh":"我已不在這裡工作了。"},{"text":"Je n\'ai pas de badge.","zh":"我沒有識別證。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我沒在這裡工作。」？","options":["Je ne travaille plus ici.","Je ne travaille pas ici."],"answers":["Je ne travaille pas ici."],"explanation":"第一種意思是「我沒在這裡工作。」，另一種是「我已不在這裡工作了。」。標準書寫用 ne 和 pas 夾住變位動詞；母音前 ne 省成 n\'。ne…plus 則表示原來有而現在不再有。"},{"id":"complete-form","type":"fill","prompt":"我沒有識別證。\\n請從「ne／n\'」選出合適寫法，只填空格。\\nJe ___ai pas de badge.","answers":["n\'"],"explanation":"標準書寫用 ne 和 pas 夾住變位動詞；母音前 ne 省成 n\'。ne…plus 則表示原來有而現在不再有。 完整寫法是「Je n\'ai pas de badge.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nElle ne vient ___ ce soir.","options":["pas","de"],"answers":["pas"],"explanation":"標準書寫用 ne 和 pas 夾住變位動詞；母音前 ne 省成 n\'。ne…plus 則表示原來有而現在不再有。 完整寫法是「Elle ne vient pas ce soir.」。"},{"id":"transfer","type":"choice","prompt":"宿舍問熱水是否修好。你說「以前有熱水，現在沒有了」。","options":["Je n\'ai jamais eu d\'eau chaude.","Je n\'ai plus d\'eau chaude."],"answers":["Je n\'ai plus d\'eau chaude."],"explanation":"標準書寫用 ne 和 pas 夾住變位動詞；母音前 ne 省成 n\'。ne…plus 則表示原來有而現在不再有。 此處要表達的意思對應「Je n\'ai plus d\'eau chaude.」。"}]},{"language":"fr","id":"possessifs","title":"所有形容詞跟誰配合？","explanation":["CEFR A1 ｜ 使用頻率：高","所有形容詞先看擁有者，再看被擁有的名詞性數。son 和 sa 都可能指男生或女生的東西。","比較「Paul cherche sa carte.」（保羅在找他的卡。）和「Paul cherche ses cartes.」（保羅在找他的那些卡。）。","常見誤用：Elle a perdu sa dossier.　修正：Elle a perdu son dossier."],"examples":[{"text":"Paul cherche sa carte.","zh":"保羅在找他的卡。"},{"text":"Paul cherche ses cartes.","zh":"保羅在找他的那些卡。"},{"text":"Elle a perdu son dossier.","zh":"她弄丟了她的資料夾。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「保羅在找他的卡。」？","options":["Paul cherche sa carte.","Paul cherche ses cartes."],"answers":["Paul cherche sa carte."],"explanation":"第一種意思是「保羅在找他的卡。」，另一種是「保羅在找他的那些卡。」。所有形容詞先看擁有者，再看被擁有的名詞性數。son 和 sa 都可能指男生或女生的東西。"},{"id":"complete-form","type":"fill","prompt":"她弄丟了她的資料夾。\\n請從「son／sa」選出合適寫法，只填空格。\\nElle a perdu ___ dossier.","answers":["son"],"explanation":"所有形容詞先看擁有者，再看被擁有的名詞性數。son 和 sa 都可能指男生或女生的東西。 完整寫法是「Elle a perdu son dossier.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nJ\'ai oublié ___ clés.","options":["ma","mes"],"answers":["mes"],"explanation":"所有形容詞先看擁有者，再看被擁有的名詞性數。son 和 sa 都可能指男生或女生的東西。 完整寫法是「J\'ai oublié mes clés.」。"},{"id":"transfer","type":"choice","prompt":"Paul 在找他自己的學生證。要表達他只弄丟一張女性名詞 carte，用哪個片語？","options":["sa carte étudiante","ses cartes étudiantes"],"answers":["sa carte étudiante"],"explanation":"所有形容詞先看擁有者，再看被擁有的名詞性數。son 和 sa 都可能指男生或女生的東西。 此處要表達的意思對應「sa carte étudiante」。"}]},{"language":"fr","id":"partitif","title":"用部分冠詞取用未計量的東西","explanation":["CEFR A2 ｜ 使用頻率：高","取用一些未計量的食物，用 du、de la 或 de l\'；可數的一杯則用 un café。","比較「Je voudrais du café.」（我想要一些咖啡。）和「Je voudrais un café.」（我想點一杯咖啡。）。","常見誤用：Il reste du soupe au frigo.　修正：Il reste de la soupe au frigo."],"examples":[{"text":"Je voudrais du café.","zh":"我想要一些咖啡。"},{"text":"Je voudrais un café.","zh":"我想點一杯咖啡。"},{"text":"Il reste de la soupe au frigo.","zh":"冰箱裡還剩些湯。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我想要一些咖啡。」？","options":["Je voudrais du café.","Je voudrais un café."],"answers":["Je voudrais du café."],"explanation":"第一種意思是「我想要一些咖啡。」，另一種是「我想點一杯咖啡。」。取用一些未計量的食物，用 du、de la 或 de l\'；可數的一杯則用 un café。"},{"id":"complete-form","type":"fill","prompt":"冰箱裡還剩些湯。\\n請從「du／de la」選出合適寫法，只填空格。\\nIl reste ___ soupe au frigo.","answers":["de la"],"explanation":"取用一些未計量的食物，用 du、de la 或 de l\'；可數的一杯則用 un café。 完整寫法是「Il reste de la soupe au frigo.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nOn a acheté ___ farine.","options":["du","de la"],"answers":["de la"],"explanation":"取用一些未計量的食物，用 du、de la 或 de l\'；可數的一杯則用 un café。 完整寫法是「On a acheté de la farine.」。"},{"id":"transfer","type":"choice","prompt":"你在共同廚房需要一些麵粉，份數不重要。","options":["Il me faut trois paquets de farine.","Il me faut de la farine."],"answers":["Il me faut de la farine."],"explanation":"取用一些未計量的食物，用 du、de la 或 de l\'；可數的一杯則用 un café。 此處要表達的意思對應「Il me faut de la farine.」。"}]},{"language":"fr","id":"quantite-de","title":"數量詞之後的 de","explanation":["CEFR A2 ｜ 使用頻率：高","beaucoup、assez 等數量詞加 de 後接名詞。beaucoup des dossiers reçus 則是特定的一批案件中的許多件。","比較「Il reste assez de temps.」（剩下的時間夠用。）和「Il reste peu de temps.」（剩下的時間很少。）。","常見誤用：Il reste beaucoup des places libres.　修正：Il reste beaucoup de places libres."],"examples":[{"text":"Il reste assez de temps.","zh":"剩下的時間夠用。"},{"text":"Il reste peu de temps.","zh":"剩下的時間很少。"},{"text":"Il reste beaucoup de places libres.","zh":"還有許多空位。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「剩下的時間夠用。」？","options":["Il reste peu de temps.","Il reste assez de temps."],"answers":["Il reste assez de temps."],"explanation":"第一種意思是「剩下的時間夠用。」，另一種是「剩下的時間很少。」。beaucoup、assez 等數量詞加 de 後接名詞。beaucoup des dossiers reçus 則是特定的一批案件中的許多件。"},{"id":"complete-form","type":"fill","prompt":"還有許多空位。\\n請從「de／des」選出合適寫法，只填空格。\\nIl reste beaucoup ___ places libres.","answers":["de"],"explanation":"beaucoup、assez 等數量詞加 de 後接名詞。beaucoup des dossiers reçus 則是特定的一批案件中的許多件。 完整寫法是「Il reste beaucoup de places libres.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nElle a trop ___ travail.","options":["de","du"],"answers":["de"],"explanation":"beaucoup、assez 等數量詞加 de 後接名詞。beaucoup des dossiers reçus 則是特定的一批案件中的許多件。 完整寫法是「Elle a trop de travail.」。"},{"id":"transfer","type":"choice","prompt":"你想說「收到的那批卷宗中有許多已簽名」，指特定範圍。","options":["Beaucoup des dossiers reçus sont signés.","Beaucoup de gens signent des dossiers."],"answers":["Beaucoup des dossiers reçus sont signés."],"explanation":"beaucoup、assez 等數量詞加 de 後接名詞。beaucoup des dossiers reçus 則是特定的一批案件中的許多件。 此處要表達的意思對應「Beaucoup des dossiers reçus sont signés.」。"}]},{"language":"fr","id":"futur-proche","title":"aller 加原形與近期打算","explanation":["CEFR A2 ｜ 使用頻率：高","aller 的現在式接原形，表達當下已有的計畫或即將發生的事。aller 加地點則是前往某處。","比較「Je vais appeler la résidence.」（我打算打電話給宿舍。）和「Je vais à la résidence.」（我正要去宿舍。）。","常見誤用：Nous allons réservés une salle.　修正：Nous allons réserver une salle."],"examples":[{"text":"Je vais appeler la résidence.","zh":"我打算打電話給宿舍。"},{"text":"Je vais à la résidence.","zh":"我正要去宿舍。"},{"text":"Nous allons réserver une salle.","zh":"我們打算預訂教室。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我打算打電話給宿舍。」？","options":["Je vais appeler la résidence.","Je vais à la résidence."],"answers":["Je vais appeler la résidence."],"explanation":"第一種意思是「我打算打電話給宿舍。」，另一種是「我正要去宿舍。」。aller 的現在式接原形，表達當下已有的計畫或即將發生的事。aller 加地點則是前往某處。"},{"id":"complete-form","type":"fill","prompt":"我們打算預訂教室。\\n請從「réserver／réservés」選出合適寫法，只填空格。\\nNous allons ___ une salle.","answers":["réserver"],"explanation":"aller 的現在式接原形，表達當下已有的計畫或即將發生的事。aller 加地點則是前往某處。 完整寫法是「Nous allons réserver une salle.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nTu vas ___ le bus ?","options":["prendre","prends"],"answers":["prendre"],"explanation":"aller 的現在式接原形，表達當下已有的計畫或即將發生的事。aller 加地點則是前往某處。 完整寫法是「Tu vas prendre le bus ?」。"},{"id":"transfer","type":"choice","prompt":"要預告同學「我正要打電話給宿舍」。","options":["Je vais téléphoner à la résidence.","Je viens de téléphoner à la résidence."],"answers":["Je vais téléphoner à la résidence."],"explanation":"aller 的現在式接原形，表達當下已有的計畫或即將發生的事。aller 加地點則是前往某處。 此處要表達的意思對應「Je vais téléphoner à la résidence.」。"}]},{"language":"fr","id":"passe-recent","title":"venir de 與剛完成的動作","explanation":["CEFR A2 ｜ 使用頻率：高","venir de 加原形從參照時間回望剛完成的動作。venir de 加地名可表示從哪裡來。","比較「Le train vient de partir.」（火車剛開走。）和「Le train va partir.」（火車就要開了。）。","常見誤用：Nous venons de terminé la répétition.　修正：Nous venons de terminer la répétition."],"examples":[{"text":"Le train vient de partir.","zh":"火車剛開走。"},{"text":"Le train va partir.","zh":"火車就要開了。"},{"text":"Nous venons de terminer la répétition.","zh":"我們剛排練完。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「火車剛開走。」？","options":["Le train va partir.","Le train vient de partir."],"answers":["Le train vient de partir."],"explanation":"第一種意思是「火車剛開走。」，另一種是「火車就要開了。」。venir de 加原形從參照時間回望剛完成的動作。venir de 加地名可表示從哪裡來。"},{"id":"complete-form","type":"fill","prompt":"我們剛排練完。\\n請從「terminé／terminer」選出合適寫法，只填空格。\\nNous venons de ___ la répétition.","answers":["terminer"],"explanation":"venir de 加原形從參照時間回望剛完成的動作。venir de 加地名可表示從哪裡來。 完整寫法是「Nous venons de terminer la répétition.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nElle vient d\'___ le devis.","options":["envoyé","envoyer"],"answers":["envoyer"],"explanation":"venir de 加原形從參照時間回望剛完成的動作。venir de 加地名可表示從哪裡來。 完整寫法是「Elle vient d\'envoyer le devis.」。"},{"id":"transfer","type":"choice","prompt":"承辦問你有沒有收到資料，你要說「我剛剛才收到」。","options":["Je viens de recevoir le document.","Je vais recevoir le document."],"answers":["Je viens de recevoir le document."],"explanation":"venir de 加原形從參照時間回望剛完成的動作。venir de 加地名可表示從哪裡來。 此處要表達的意思對應「Je viens de recevoir le document.」。"}]},{"language":"fr","id":"pronominal","title":"代名動詞與反身代名詞","explanation":["CEFR B1 ｜ 使用頻率：高","代名動詞依人稱變更反身代名詞：je me、tu te、nous nous 等。拿掉代名詞可能換成對另一個人做動作。","比較「Je me réveille à sept heures.」（我七點醒來。）和「Je réveille mon frère à sept heures.」（我七點叫醒弟弟。）。","常見誤用：Tu se prépares pour l\'entretien ?　修正：Tu te prépares pour l\'entretien ?"],"examples":[{"text":"Je me réveille à sept heures.","zh":"我七點醒來。"},{"text":"Je réveille mon frère à sept heures.","zh":"我七點叫醒弟弟。"},{"text":"Tu te prépares pour l\'entretien ?","zh":"你在準備面試嗎？"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我七點醒來。」？","options":["Je me réveille à sept heures.","Je réveille mon frère à sept heures."],"answers":["Je me réveille à sept heures."],"explanation":"第一種意思是「我七點醒來。」，另一種是「我七點叫醒弟弟。」。代名動詞依人稱變更反身代名詞：je me、tu te、nous nous 等。拿掉代名詞可能換成對另一個人做動作。"},{"id":"complete-form","type":"fill","prompt":"你在準備面試嗎？\\n請從「se／te」選出合適寫法，只填空格。\\nTu ___ prépares pour l\'entretien ?","answers":["te"],"explanation":"代名動詞依人稱變更反身代名詞：je me、tu te、nous nous 等。拿掉代名詞可能換成對另一個人做動作。 完整寫法是「Tu te prépares pour l\'entretien ?」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nVous ___ appelez comment ?","options":["vous","se"],"answers":["vous"],"explanation":"代名動詞依人稱變更反身代名詞：je me、tu te、nous nous 等。拿掉代名詞可能換成對另一個人做動作。 完整寫法是「Vous vous appelez comment ?」。"},{"id":"transfer","type":"choice","prompt":"告訴朋友「我們在車站前碰面」，互相會合。","options":["On se retrouve devant la gare.","On retrouve le guide devant la gare."],"answers":["On se retrouve devant la gare."],"explanation":"代名動詞依人稱變更反身代名詞：je me、tu te、nous nous 等。拿掉代名詞可能換成對另一個人做動作。 此處要表達的意思對應「On se retrouve devant la gare.」。"}]},{"language":"fr","id":"lieu-pays","title":"城市與國名的地點介系詞","explanation":["CEFR B1 ｜ 使用頻率：高","地點介系詞常見組合是 à 加城市，en 加陰性國名，au 加子音起首的陽性國名，aux 加複數國名。de 指出來源。","比較「Je vais à Paris.」（我要去巴黎。）和「Je viens de Paris.」（我從巴黎來。）。","常見誤用：Elle travaille en Canada.　修正：Elle travaille au Canada."],"examples":[{"text":"Je vais à Paris.","zh":"我要去巴黎。"},{"text":"Je viens de Paris.","zh":"我從巴黎來。"},{"text":"Elle travaille au Canada.","zh":"她在加拿大工作。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我要去巴黎。」？","options":["Je viens de Paris.","Je vais à Paris."],"answers":["Je vais à Paris."],"explanation":"第一種意思是「我要去巴黎。」，另一種是「我從巴黎來。」。地點介系詞常見組合是 à 加城市，en 加陰性國名，au 加子音起首的陽性國名，aux 加複數國名。de 指出來源。"},{"id":"complete-form","type":"fill","prompt":"她在加拿大工作。\\n請從「au／en」選出合適寫法，只填空格。\\nElle travaille ___ Canada.","answers":["au"],"explanation":"地點介系詞常見組合是 à 加城市，en 加陰性國名，au 加子音起首的陽性國名，aux 加複數國名。de 指出來源。 完整寫法是「Elle travaille au Canada.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nNous répétons ___ Pays-Bas.","options":["au","aux"],"answers":["aux"],"explanation":"地點介系詞常見組合是 à 加城市，en 加陰性國名，au 加子音起首的陽性國名，aux 加複數國名。de 指出來源。 完整寫法是「Nous répétons aux Pays-Bas.」。"},{"id":"transfer","type":"choice","prompt":"你是從巴黎出發，到加拿大採訪。","options":["Je pars de Paris pour aller au Canada.","Je viens du Canada pour aller à Paris."],"answers":["Je pars de Paris pour aller au Canada."],"explanation":"地點介系詞常見組合是 à 加城市，en 加陰性國名，au 加子音起首的陽性國名，aux 加複數國名。de 指出來源。 此處要表達的意思對應「Je pars de Paris pour aller au Canada.」。"}]},{"language":"fr","id":"imperatif-tu","title":"給熟人的 tu 命令式","explanation":["CEFR B1 ｜ 使用頻率：高","對一位熟人給指示時省略 tu。規則 -er 動詞通常去掉 -s；prendre 等動詞需保留自己的命令式。","比較「Tu écoutes le soliste.」（你正在聽獨唱者。）和「Écoute le soliste.」（聽一下獨唱者。）。","常見誤用：Regardes le numéro de salle.　修正：Regarde le numéro de salle."],"examples":[{"text":"Tu écoutes le soliste.","zh":"你正在聽獨唱者。"},{"text":"Écoute le soliste.","zh":"聽一下獨唱者。"},{"text":"Regarde le numéro de salle.","zh":"看一下教室編號。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「你正在聽獨唱者。」？","options":["Tu écoutes le soliste.","Écoute le soliste."],"answers":["Tu écoutes le soliste."],"explanation":"第一種意思是「你正在聽獨唱者。」，另一種是「聽一下獨唱者。」。對一位熟人給指示時省略 tu。規則 -er 動詞通常去掉 -s；prendre 等動詞需保留自己的命令式。"},{"id":"complete-form","type":"fill","prompt":"看一下教室編號。\\n請從「Regarde／Regardes」選出合適寫法，只填空格。\\n___ le numéro de salle.","answers":["Regarde"],"explanation":"對一位熟人給指示時省略 tu。規則 -er 動詞通常去掉 -s；prendre 等動詞需保留自己的命令式。 完整寫法是「Regarde le numéro de salle.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\n___ ton badge avant de sortir.","options":["Prends","Prend"],"answers":["Prends"],"explanation":"對一位熟人給指示時省略 tu。規則 -er 動詞通常去掉 -s；prendre 等動詞需保留自己的命令式。 完整寫法是「Prends ton badge avant de sortir.」。"},{"id":"transfer","type":"choice","prompt":"對住同一層的熟人簡短地說「出門前關一下門」。","options":["Tu as fermé la porte en partant ?","Ferme la porte en partant."],"answers":["Ferme la porte en partant."],"explanation":"對一位熟人給指示時省略 tu。規則 -er 動詞通常去掉 -s；prendre 等動詞需保留自己的命令式。 此處要表達的意思對應「Ferme la porte en partant.」。"}]},{"language":"fr","id":"plus-que-parfait","title":"愈過去式與更早發生的事","explanation":["CEFR B1 ｜ 使用頻率：高","在過去參照點以前已完成的事，用 avoir 或 être 的未完成過去式加分詞；一般複合過去式可以推進敘事。","比較「Quand je suis arrivé, le gardien était parti.」（我到時管理員已走了。）和「Quand je suis arrivé, le gardien est parti.」（我到的時候管理員才離開。）。","常見誤用：Elle avait prévenir le groupe avant la réunion.　修正：Elle avait prévenu le groupe avant la réunion."],"examples":[{"text":"Quand je suis arrivé, le gardien était parti.","zh":"我到時管理員已走了。"},{"text":"Quand je suis arrivé, le gardien est parti.","zh":"我到的時候管理員才離開。"},{"text":"Elle avait prévenu le groupe avant la réunion.","zh":"她在開會前就通知了小組。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我到時管理員已走了。」？","options":["Quand je suis arrivé, le gardien est parti.","Quand je suis arrivé, le gardien était parti."],"answers":["Quand je suis arrivé, le gardien était parti."],"explanation":"第一種意思是「我到時管理員已走了。」，另一種是「我到的時候管理員才離開。」。在過去參照點以前已完成的事，用 avoir 或 être 的未完成過去式加分詞；一般複合過去式可以推進敘事。"},{"id":"complete-form","type":"fill","prompt":"她在開會前就通知了小組。\\n請從「prévenir／prévenu」選出合適寫法，只填空格。\\nElle avait ___ le groupe avant la réunion.","answers":["prévenu"],"explanation":"在過去參照點以前已完成的事，用 avoir 或 être 的未完成過去式加分詞；一般複合過去式可以推進敘事。 完整寫法是「Elle avait prévenu le groupe avant la réunion.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nQuand ils ont appelé, nous avions déjà ___.","options":["payer","payé"],"answers":["payé"],"explanation":"在過去參照點以前已完成的事，用 avoir 或 être 的未完成過去式加分詞；一般複合過去式可以推進敘事。 完整寫法是「Quand ils ont appelé, nous avions déjà payé.」。"},{"id":"transfer","type":"choice","prompt":"你打給宿舍時，管理員早已離開。哪句交代了這個先後？","options":["Le gardien est parti après mon appel.","Quand j\'ai appelé, le gardien était déjà parti."],"answers":["Quand j\'ai appelé, le gardien était déjà parti."],"explanation":"在過去參照點以前已完成的事，用 avoir 或 être 的未完成過去式加分詞；一般複合過去式可以推進敘事。 此處要表達的意思對應「Quand j\'ai appelé, le gardien était déjà parti.」。"}]},{"language":"fr","id":"futur-simple","title":"簡單未來式的承諾","explanation":["CEFR B1 ｜ 使用頻率：中","用未來詞幹加 -ai、-as、-a、-ons、-ez、-ont 作預告或承諾。第一人稱的 -ai 和條件式 -ais 在書面中有重要區別。","比較「Demain, je pourrai vous répondre.」（明天我就能回覆您。）和「Je pourrais vous répondre demain si cela vous convient.」（如果您方便，我可以明天回覆。）。","常見誤用：La responsable seront là lundi.　修正：La responsable sera là lundi."],"examples":[{"text":"Demain, je pourrai vous répondre.","zh":"明天我就能回覆您。"},{"text":"Je pourrais vous répondre demain si cela vous convient.","zh":"如果您方便，我可以明天回覆。"},{"text":"La responsable sera là lundi.","zh":"負責人週一會在場。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「明天我就能回覆您。」？","options":["Demain, je pourrai vous répondre.","Je pourrais vous répondre demain si cela vous convient."],"answers":["Demain, je pourrai vous répondre."],"explanation":"第一種意思是「明天我就能回覆您。」，另一種是「如果您方便，我可以明天回覆。」。用未來詞幹加 -ai、-as、-a、-ons、-ez、-ont 作預告或承諾。第一人稱的 -ai 和條件式 -ais 在書面中有重要區別。"},{"id":"complete-form","type":"fill","prompt":"負責人週一會在場。\\n請從「seront／sera」選出合適寫法，只填空格。\\nLa responsable ___ là lundi.","answers":["sera"],"explanation":"用未來詞幹加 -ai、-as、-a、-ons、-ez、-ont 作預告或承諾。第一人稱的 -ai 和條件式 -ais 在書面中有重要區別。 完整寫法是「La responsable sera là lundi.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nVous ___ les résultats demain.","options":["aurez","aurons"],"answers":["aurez"],"explanation":"用未來詞幹加 -ai、-as、-a、-ons、-ez、-ont 作預告或承諾。第一人稱的 -ai 和條件式 -ais 在書面中有重要區別。 完整寫法是「Vous aurez les résultats demain.」。"},{"id":"transfer","type":"choice","prompt":"正式寄信承諾隔天回覆。哪句直接承諾？","options":["Je vous répondrai demain.","Je pourrais vous répondre demain si j\'ai le temps."],"answers":["Je vous répondrai demain."],"explanation":"用未來詞幹加 -ai、-as、-a、-ons、-ez、-ont 作預告或承諾。第一人稱的 -ai 和條件式 -ais 在書面中有重要區別。 此處要表達的意思對應「Je vous répondrai demain.」。"}]},{"language":"fr","id":"quand-futur","title":"quand 引出未來時間","explanation":["CEFR B1 ｜ 使用頻率：高","quand 引出預期會發生的未來時間，子句可用未來式。si 加現在式把來訪當作仍待成立的條件。","比較「Quand vous viendrez, nous visiterons le studio.」（您來的時候我們會參觀工作室。）和「Si vous venez, nous visiterons le studio.」（您如果來，我們就參觀工作室。）。","常見誤用：Quand ils sera prêts, nous voterons.　修正：Quand ils seront prêts, nous voterons."],"examples":[{"text":"Quand vous viendrez, nous visiterons le studio.","zh":"您來的時候我們會參觀工作室。"},{"text":"Si vous venez, nous visiterons le studio.","zh":"您如果來，我們就參觀工作室。"},{"text":"Quand ils seront prêts, nous voterons.","zh":"他們準備好時我們就表決。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「您來的時候我們會參觀工作室。」？","options":["Quand vous viendrez, nous visiterons le studio.","Si vous venez, nous visiterons le studio."],"answers":["Quand vous viendrez, nous visiterons le studio."],"explanation":"第一種意思是「您來的時候我們會參觀工作室。」，另一種是「您如果來，我們就參觀工作室。」。quand 引出預期會發生的未來時間，子句可用未來式。si 加現在式把來訪當作仍待成立的條件。"},{"id":"complete-form","type":"fill","prompt":"他們準備好時我們就表決。\\n請從「sera／seront」選出合適寫法，只填空格。\\nQuand ils ___ prêts, nous voterons.","answers":["seront"],"explanation":"quand 引出預期會發生的未來時間，子句可用未來式。si 加現在式把來訪當作仍待成立的條件。 完整寫法是「Quand ils seront prêts, nous voterons.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nQuand tu ___, je descendrai.","options":["arriveras","arrivera"],"answers":["arriveras"],"explanation":"quand 引出預期會發生的未來時間，子句可用未來式。si 加現在式把來訪當作仍待成立的條件。 完整寫法是「Quand tu arriveras, je descendrai.」。"},{"id":"transfer","type":"choice","prompt":"想說「等你到，我就下樓」，把抵達當成預期事件。","options":["Si tu viens, je descendrai.","Quand tu arriveras, je descendrai."],"answers":["Quand tu arriveras, je descendrai."],"explanation":"quand 引出預期會發生的未來時間，子句可用未來式。si 加現在式把來訪當作仍待成立的條件。 此處要表達的意思對應「Quand tu arriveras, je descendrai.」。"}]},{"language":"fr","id":"si-present","title":"si 加現在式的開放條件","explanation":["CEFR B1 ｜ 使用頻率：高","si 引出現實可行的條件，用現在式；結果可用未來式或命令式。puisque 則把前提當作已知。","比較「Si vous avez un instant, je vous montre le dossier.」（您如果有空，我可以把資料給您看。）和「Puisque vous avez un instant, je vous montre le dossier.」（既然您有空，我就把資料給您看。）。","常見誤用：Si le prix baissera, nous réserverons.　修正：Si le prix baisse, nous réserverons."],"examples":[{"text":"Si vous avez un instant, je vous montre le dossier.","zh":"您如果有空，我可以把資料給您看。"},{"text":"Puisque vous avez un instant, je vous montre le dossier.","zh":"既然您有空，我就把資料給您看。"},{"text":"Si le prix baisse, nous réserverons.","zh":"如果降價，我們就預訂。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「您如果有空，我可以把資料給您看。」？","options":["Si vous avez un instant, je vous montre le dossier.","Puisque vous avez un instant, je vous montre le dossier."],"answers":["Si vous avez un instant, je vous montre le dossier."],"explanation":"第一種意思是「您如果有空，我可以把資料給您看。」，另一種是「既然您有空，我就把資料給您看。」。si 引出現實可行的條件，用現在式；結果可用未來式或命令式。puisque 則把前提當作已知。"},{"id":"complete-form","type":"fill","prompt":"如果降價，我們就預訂。\\n請從「baissera／baisse」選出合適寫法，只填空格。\\nSi le prix ___, nous réserverons.","answers":["baisse"],"explanation":"si 引出現實可行的條件，用現在式；結果可用未來式或命令式。puisque 則把前提當作已知。 完整寫法是「Si le prix baisse, nous réserverons.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nSi tu ___ demain, apporte ton badge.","options":["viendras","viens"],"answers":["viens"],"explanation":"si 引出現實可行的條件，用現在式；結果可用未來式或命令式。puisque 則把前提當作已知。 完整寫法是「Si tu viens demain, apporte ton badge.」。"},{"id":"transfer","type":"choice","prompt":"你還不確定朋友明天來不來。如何保留這個條件？","options":["Si tu viens, apporte ton badge.","Puisque tu viens, apporte ton badge."],"answers":["Si tu viens, apporte ton badge."],"explanation":"si 引出現實可行的條件，用現在式；結果可用未來式或命令式。puisque 則把前提當作已知。 此處要表達的意思對應「Si tu viens, apporte ton badge.」。"}]},{"language":"fr","id":"si-imparfait","title":"si 加未完成過去式的假設","explanation":["CEFR B1 ｜ 使用頻率：高","對現在或未來設想較遠的條件，si 後用 imparfait，結果用條件式。si 後直接用條件式是常見錯誤。","比較「Si j\'avais une voiture, je rentrerais plus tard.」（我若有車，就能晚一點回家。）和「Si j\'ai une voiture demain, je rentrerai plus tard.」（我明天如果有車，就會晚點回家。）。","常見誤用：Si nous habiterions plus près, nous viendrions à pied.　修正：Si nous habitions plus près, nous viendrions à pied."],"examples":[{"text":"Si j\'avais une voiture, je rentrerais plus tard.","zh":"我若有車，就能晚一點回家。"},{"text":"Si j\'ai une voiture demain, je rentrerai plus tard.","zh":"我明天如果有車，就會晚點回家。"},{"text":"Si nous habitions plus près, nous viendrions à pied.","zh":"我們若住近些就會走路來。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我若有車，就能晚一點回家。」？","options":["Si j\'ai une voiture demain, je rentrerai plus tard.","Si j\'avais une voiture, je rentrerais plus tard."],"answers":["Si j\'avais une voiture, je rentrerais plus tard."],"explanation":"第一種意思是「我若有車，就能晚一點回家。」，另一種是「我明天如果有車，就會晚點回家。」。對現在或未來設想較遠的條件，si 後用 imparfait，結果用條件式。si 後直接用條件式是常見錯誤。"},{"id":"complete-form","type":"fill","prompt":"我們若住近些就會走路來。\\n請從「habiterions／habitions」選出合適寫法，只填空格。\\nSi nous ___ plus près, nous viendrions à pied.","answers":["habitions"],"explanation":"對現在或未來設想較遠的條件，si 後用 imparfait，結果用條件式。si 後直接用條件式是常見錯誤。 完整寫法是「Si nous habitions plus près, nous viendrions à pied.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nSi vous ___ la réponse, que feriez-vous ?","options":["sauriez","saviez"],"answers":["saviez"],"explanation":"對現在或未來設想較遠的條件，si 後用 imparfait，結果用條件式。si 後直接用條件式是常見錯誤。 完整寫法是「Si vous saviez la réponse, que feriez-vous ?」。"},{"id":"transfer","type":"choice","prompt":"你現在沒有車。怎麼說「假如有車，我就會晚些回家」？","options":["Puisque j\'ai une voiture, je rentrerai plus tard.","Si j\'avais une voiture, je rentrerais plus tard."],"answers":["Si j\'avais une voiture, je rentrerais plus tard."],"explanation":"對現在或未來設想較遠的條件，si 後用 imparfait，結果用條件式。si 後直接用條件式是常見錯誤。 此處要表達的意思對應「Si j\'avais une voiture, je rentrerais plus tard.」。"}]},{"language":"fr","id":"depuis","title":"depuis 與持續到現在的狀態","explanation":["CEFR B1 ｜ 使用頻率：高","從某時開始一路持續到現在，通常用現在式加 depuis。pendant 常將活動視為有起訖的一段。","比較「J\'habite ici depuis un an.」（我住在這裡已經一年了。）和「J\'ai habité ici pendant un an.」（我曾在這裡住過一年。）。","常見誤用：Nous attendons il y a une heure et le bus n\'est toujours pas là.　修正：Nous attendons depuis une heure et le bus n\'est toujours pas là."],"examples":[{"text":"J\'habite ici depuis un an.","zh":"我住在這裡已經一年了。"},{"text":"J\'ai habité ici pendant un an.","zh":"我曾在這裡住過一年。"},{"text":"Nous attendons depuis une heure et le bus n\'est toujours pas là.","zh":"我們已等一小時，車仍沒來。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我住在這裡已經一年了。」？","options":["J\'ai habité ici pendant un an.","J\'habite ici depuis un an."],"answers":["J\'habite ici depuis un an."],"explanation":"第一種意思是「我住在這裡已經一年了。」，另一種是「我曾在這裡住過一年。」。從某時開始一路持續到現在，通常用現在式加 depuis。pendant 常將活動視為有起訖的一段。"},{"id":"complete-form","type":"fill","prompt":"我們已等一小時，車仍沒來。\\n請從「il y a／depuis」選出合適寫法，只填空格。\\nNous attendons ___ une heure et le bus n\'est toujours pas là.","answers":["depuis"],"explanation":"從某時開始一路持續到現在，通常用現在式加 depuis。pendant 常將活動視為有起訖的一段。 完整寫法是「Nous attendons depuis une heure et le bus n\'est toujours pas là.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLa panne dure ___ lundi.","options":["il y a","depuis"],"answers":["depuis"],"explanation":"從某時開始一路持續到現在，通常用現在式加 depuis。pendant 常將活動視為有起訖的一段。 完整寫法是「La panne dure depuis lundi.」。"},{"id":"transfer","type":"choice","prompt":"三週前熱水開始故障，今天報修時仍是冷的。","options":["L\'eau a été froide pendant trois semaines, mais elle est chaude maintenant.","L\'eau est froide depuis trois semaines."],"answers":["L\'eau est froide depuis trois semaines."],"explanation":"從某時開始一路持續到現在，通常用現在式加 depuis。pendant 常將活動視為有起訖的一段。 此處要表達的意思對應「L\'eau est froide depuis trois semaines.」。"}]},{"language":"fr","id":"il-y-a","title":"il y a 與從現在回推的時間點","explanation":["CEFR B1 ｜ 使用頻率：高","il y a 加時長把已發生的事定位在多久之前。dans 加時長把未來動作定位在多久之後。","比較「Le technicien est passé il y a dix minutes.」（師傅十分鐘前來過。）和「Le technicien passera dans dix minutes.」（師傅十分鐘後會來。）。","常見誤用：J\'ai envoyé le dossier depuis que trois jours.　修正：J\'ai envoyé le dossier il y a trois jours."],"examples":[{"text":"Le technicien est passé il y a dix minutes.","zh":"師傅十分鐘前來過。"},{"text":"Le technicien passera dans dix minutes.","zh":"師傅十分鐘後會來。"},{"text":"J\'ai envoyé le dossier il y a trois jours.","zh":"我三天前寄出了資料。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「師傅十分鐘前來過。」？","options":["Le technicien est passé il y a dix minutes.","Le technicien passera dans dix minutes."],"answers":["Le technicien est passé il y a dix minutes."],"explanation":"第一種意思是「師傅十分鐘前來過。」，另一種是「師傅十分鐘後會來。」。il y a 加時長把已發生的事定位在多久之前。dans 加時長把未來動作定位在多久之後。"},{"id":"complete-form","type":"fill","prompt":"我三天前寄出了資料。\\n請從「il y a／depuis que」選出合適寫法，只填空格。\\nJ\'ai envoyé le dossier ___ trois jours.","answers":["il y a"],"explanation":"il y a 加時長把已發生的事定位在多久之前。dans 加時長把未來動作定位在多久之後。 完整寫法是「J\'ai envoyé le dossier il y a trois jours.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLe train est parti ___ une heure.","options":["pendant que","il y a"],"answers":["il y a"],"explanation":"il y a 加時長把已發生的事定位在多久之前。dans 加時長把未來動作定位在多久之後。 完整寫法是「Le train est parti il y a une heure.」。"},{"id":"transfer","type":"choice","prompt":"承辦問你何時寄出郵件。你說「兩天前」。","options":["Je l\'ai envoyé il y a deux jours.","Je l\'enverrai dans deux jours."],"answers":["Je l\'ai envoyé il y a deux jours."],"explanation":"il y a 加時長把已發生的事定位在多久之前。dans 加時長把未來動作定位在多久之後。 此處要表達的意思對應「Je l\'ai envoyé il y a deux jours.」。"}]},{"language":"fr","id":"pendant-en","title":"pendant 與 en 的歷時觀點","explanation":["CEFR B1 ｜ 使用頻率：高","pendant 加時長表示活動持續多久；en 加時長表示完成某項工作的速度。選哪個取決於是否聚焦終點。","比較「J\'ai travaillé sur le dossier pendant deux heures.」（我花了兩小時處理資料。）和「J\'ai terminé le dossier en deux heures.」（我花兩小時完成了資料。）。","常見誤用：Elle a rempli le formulaire depuis que cinq minutes chrono.　修正：Elle a rempli le formulaire en cinq minutes chrono."],"examples":[{"text":"J\'ai travaillé sur le dossier pendant deux heures.","zh":"我花了兩小時處理資料。"},{"text":"J\'ai terminé le dossier en deux heures.","zh":"我花兩小時完成了資料。"},{"text":"Elle a rempli le formulaire en cinq minutes chrono.","zh":"她五分鐘就填完了表格。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我花了兩小時處理資料。」？","options":["J\'ai travaillé sur le dossier pendant deux heures.","J\'ai terminé le dossier en deux heures."],"answers":["J\'ai travaillé sur le dossier pendant deux heures."],"explanation":"第一種意思是「我花了兩小時處理資料。」，另一種是「我花兩小時完成了資料。」。pendant 加時長表示活動持續多久；en 加時長表示完成某項工作的速度。選哪個取決於是否聚焦終點。"},{"id":"complete-form","type":"fill","prompt":"她五分鐘就填完了表格。\\n請從「depuis que／en」選出合適寫法，只填空格。\\nElle a rempli le formulaire ___ cinq minutes chrono.","answers":["en"],"explanation":"pendant 加時長表示活動持續多久；en 加時長表示完成某項工作的速度。選哪個取決於是否聚焦終點。 完整寫法是「Elle a rempli le formulaire en cinq minutes chrono.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nNous avons discuté ___ tout le trajet.","options":["pendant","il y a"],"answers":["pendant"],"explanation":"pendant 加時長表示活動持續多久；en 加時長表示完成某項工作的速度。選哪個取決於是否聚焦終點。 完整寫法是「Nous avons discuté pendant tout le trajet.」。"},{"id":"transfer","type":"choice","prompt":"想強調兩小時內做完報告，而不只是工作兩小時。","options":["J\'ai travaillé sur le rapport pendant deux heures.","J\'ai terminé le rapport en deux heures."],"answers":["J\'ai terminé le rapport en deux heures."],"explanation":"pendant 加時長表示活動持續多久；en 加時長表示完成某項工作的速度。選哪個取決於是否聚焦終點。 此處要表達的意思對應「J\'ai terminé le rapport en deux heures.」。"}]},{"language":"fr","id":"negative-quantity","title":"否定句中的 de 與冠詞","explanation":["CEFR B1 ｜ 使用頻率：高","數量和否定搭配時，常把不定或部分冠詞改成 de。若以 être 辨別物品身分，通常仍保留冠詞。","比較「Je n\'ai pas de justificatif.」（我沒有證明文件。）和「Ce n\'est pas un justificatif.」（這不是證明文件。）。","常見誤用：Nous n\'avons plus des places libres.　修正：Nous n\'avons plus de places libres."],"examples":[{"text":"Je n\'ai pas de justificatif.","zh":"我沒有證明文件。"},{"text":"Ce n\'est pas un justificatif.","zh":"這不是證明文件。"},{"text":"Nous n\'avons plus de places libres.","zh":"我們已經沒有空位。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我沒有證明文件。」？","options":["Ce n\'est pas un justificatif.","Je n\'ai pas de justificatif."],"answers":["Je n\'ai pas de justificatif."],"explanation":"第一種意思是「我沒有證明文件。」，另一種是「這不是證明文件。」。數量和否定搭配時，常把不定或部分冠詞改成 de。若以 être 辨別物品身分，通常仍保留冠詞。"},{"id":"complete-form","type":"fill","prompt":"我們已經沒有空位。\\n請從「des／de」選出合適寫法，只填空格。\\nNous n\'avons plus ___ places libres.","answers":["de"],"explanation":"數量和否定搭配時，常把不定或部分冠詞改成 de。若以 être 辨別物品身分，通常仍保留冠詞。 完整寫法是「Nous n\'avons plus de places libres.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nCe n\'est pas ___ facture.","options":["une","de"],"answers":["une"],"explanation":"數量和否定搭配時，常把不定或部分冠詞改成 de。若以 être 辨別物品身分，通常仍保留冠詞。 完整寫法是「Ce n\'est pas une facture.」。"},{"id":"transfer","type":"choice","prompt":"你有一張收據，但櫃檯告訴你這東西不能當住址證明。","options":["Ce n\'est pas un justificatif de domicile.","Je n\'ai pas de reçu."],"answers":["Ce n\'est pas un justificatif de domicile."],"explanation":"數量和否定搭配時，常把不定或部分冠詞改成 de。若以 être 辨別物品身分，通常仍保留冠詞。 此處要表達的意思對應「Ce n\'est pas un justificatif de domicile.」。"}]},{"language":"fr","id":"interrogatif-quel","title":"quel 與 lequel 的選擇","explanation":["CEFR B1 ｜ 使用頻率：高","問「哪個、什麼」時，quel 依所問名詞性數配合。lequel 則可獨立代替前文已知的名詞。","比較「Quelle salle avez-vous réservée ?」（您預訂了哪間教室？）和「Laquelle avez-vous réservée ?」（您預訂的是哪一間？）。","常見誤用：Quelles documents faut-il joindre ?　修正：Quels documents faut-il joindre ?"],"examples":[{"text":"Quelle salle avez-vous réservée ?","zh":"您預訂了哪間教室？"},{"text":"Laquelle avez-vous réservée ?","zh":"您預訂的是哪一間？"},{"text":"Quels documents faut-il joindre ?","zh":"需要附上哪些文件？"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「您預訂了哪間教室？」？","options":["Quelle salle avez-vous réservée ?","Laquelle avez-vous réservée ?"],"answers":["Quelle salle avez-vous réservée ?"],"explanation":"第一種意思是「您預訂了哪間教室？」，另一種是「您預訂的是哪一間？」。問「哪個、什麼」時，quel 依所問名詞性數配合。lequel 則可獨立代替前文已知的名詞。"},{"id":"complete-form","type":"fill","prompt":"需要附上哪些文件？\\n請從「Quels／Quelles」選出合適寫法，只填空格。\\n___ documents faut-il joindre ?","answers":["Quels"],"explanation":"問「哪個、什麼」時，quel 依所問名詞性數配合。lequel 則可獨立代替前文已知的名詞。 完整寫法是「Quels documents faut-il joindre ?」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\n___ dates vous conviennent ?","options":["Quels","Quelles"],"answers":["Quelles"],"explanation":"問「哪個、什麼」時，quel 依所問名詞性數配合。lequel 則可獨立代替前文已知的名詞。 完整寫法是「Quelles dates vous conviennent ?」。"},{"id":"transfer","type":"choice","prompt":"桌上有兩份表格，對方已知道你指的是表格，如何單用代名詞問「您要填哪一份」？","options":["Lequel voulez-vous remplir ?","Quel formulaire voulez-vous remplir ?"],"answers":["Lequel voulez-vous remplir ?"],"explanation":"問「哪個、什麼」時，quel 依所問名詞性數配合。lequel 則可獨立代替前文已知的名詞。 此處要表達的意思對應「Lequel voulez-vous remplir ?」。"}]},{"language":"fr","id":"reflexive-inf","title":"代名不定詞的人稱與位置","explanation":["CEFR B1 ｜ 使用頻率：高","反身不定詞跟在 devoir、vouloir 等後面時，代名詞仍跟執行者人稱配合，放在不定詞前。","比較「Tu dois te présenter à l\'accueil.」（你必須到櫃檯報到。）和「Tu dois me présenter à l\'équipe.」（你必須把我介紹給團隊。）。","常見誤用：Nous devons se inscrire avant lundi.　修正：Nous devons nous inscrire avant lundi."],"examples":[{"text":"Tu dois te présenter à l\'accueil.","zh":"你必須到櫃檯報到。"},{"text":"Tu dois me présenter à l\'équipe.","zh":"你必須把我介紹給團隊。"},{"text":"Nous devons nous inscrire avant lundi.","zh":"我們得在週一前報名。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「你必須到櫃檯報到。」？","options":["Tu dois me présenter à l\'équipe.","Tu dois te présenter à l\'accueil."],"answers":["Tu dois te présenter à l\'accueil."],"explanation":"第一種意思是「你必須到櫃檯報到。」，另一種是「你必須把我介紹給團隊。」。反身不定詞跟在 devoir、vouloir 等後面時，代名詞仍跟執行者人稱配合，放在不定詞前。"},{"id":"complete-form","type":"fill","prompt":"我們得在週一前報名。\\n請從「se／nous」選出合適寫法，只填空格。\\nNous devons ___ inscrire avant lundi.","answers":["nous"],"explanation":"反身不定詞跟在 devoir、vouloir 等後面時，代名詞仍跟執行者人稱配合，放在不定詞前。 完整寫法是「Nous devons nous inscrire avant lundi.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nVous pouvez ___ asseoir ici.","options":["vous","se"],"answers":["vous"],"explanation":"反身不定詞跟在 devoir、vouloir 等後面時，代名詞仍跟執行者人稱配合，放在不定詞前。 完整寫法是「Vous pouvez vous asseoir ici.」。"},{"id":"transfer","type":"choice","prompt":"提醒朋友他必須自行到櫃檯報到。","options":["Tu dois te présenter à l\'accueil.","Tu dois me présenter à l\'accueil."],"answers":["Tu dois te présenter à l\'accueil."],"explanation":"反身不定詞跟在 devoir、vouloir 等後面時，代名詞仍跟執行者人稱配合，放在不定詞前。 此處要表達的意思對應「Tu dois te présenter à l\'accueil.」。"}]},{"language":"fr","id":"comparatif-nom","title":"比較形容詞與比較名詞數量","explanation":["CEFR B1 ｜ 使用頻率：高","比較物品數量用 plus 或 moins de 加名詞，再用 que 接比較對象。比較形容詞的程度則沒有這個 de。","比較「Ce trajet demande plus de temps que l\'autre.」（這條路比另一條花更多時間。）和「Ce trajet est plus pratique que l\'autre.」（這條路比另一條方便。）。","常見誤用：Nous avons moins que places que prévu.　修正：Nous avons moins de places que prévu."],"examples":[{"text":"Ce trajet demande plus de temps que l\'autre.","zh":"這條路比另一條花更多時間。"},{"text":"Ce trajet est plus pratique que l\'autre.","zh":"這條路比另一條方便。"},{"text":"Nous avons moins de places que prévu.","zh":"座位比預期少。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「這條路比另一條花更多時間。」？","options":["Ce trajet est plus pratique que l\'autre.","Ce trajet demande plus de temps que l\'autre."],"answers":["Ce trajet demande plus de temps que l\'autre."],"explanation":"第一種意思是「這條路比另一條花更多時間。」，另一種是「這條路比另一條方便。」。比較物品數量用 plus 或 moins de 加名詞，再用 que 接比較對象。比較形容詞的程度則沒有這個 de。"},{"id":"complete-form","type":"fill","prompt":"座位比預期少。\\n請從「de／que」選出合適寫法，只填空格。\\nNous avons moins ___ places que prévu.","answers":["de"],"explanation":"比較物品數量用 plus 或 moins de 加名詞，再用 que 接比較對象。比較形容詞的程度則沒有這個 de。 完整寫法是「Nous avons moins de places que prévu.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLa salle est plus grande ___ la mienne.","options":["que","de"],"answers":["que"],"explanation":"比較物品數量用 plus 或 moins de 加名詞，再用 que 接比較對象。比較形容詞的程度則沒有這個 de。 完整寫法是「La salle est plus grande que la mienne.」。"},{"id":"transfer","type":"choice","prompt":"你要比較的是座位的「數量」，不是座位舒適度。","options":["Les places dans la seconde salle sont plus confortables.","Il y a plus de places dans la seconde salle."],"answers":["Il y a plus de places dans la seconde salle."],"explanation":"比較物品數量用 plus 或 moins de 加名詞，再用 que 接比較對象。比較形容詞的程度則沒有這個 de。 此處要表達的意思對應「Il y a plus de places dans la seconde salle.」。"}]},{"language":"fr","id":"pour-que","title":"pour que 與目的的執行者","explanation":["CEFR B2 ｜ 使用頻率：高","目的子句的執行者與主句不同時，用 pour que 加主詞和虛擬式；同一人執行則通常用 pour 加原形。","比較「Je joins un plan pour que vous trouviez l\'entrée.」（我附地圖，好讓您找到入口。）和「J\'utilise un plan pour trouver l\'entrée.」（我為了找到入口而使用地圖。）。","常見誤用：Je laisse la clé pour qu\'elle a accès au studio.　修正：Je laisse la clé pour qu\'elle ait accès au studio."],"examples":[{"text":"Je joins un plan pour que vous trouviez l\'entrée.","zh":"我附地圖，好讓您找到入口。"},{"text":"J\'utilise un plan pour trouver l\'entrée.","zh":"我為了找到入口而使用地圖。"},{"text":"Je laisse la clé pour qu\'elle ait accès au studio.","zh":"我留下鑰匙，好讓她能進工作室。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我附地圖，好讓您找到入口。」？","options":["Je joins un plan pour que vous trouviez l\'entrée.","J\'utilise un plan pour trouver l\'entrée."],"answers":["Je joins un plan pour que vous trouviez l\'entrée."],"explanation":"第一種意思是「我附地圖，好讓您找到入口。」，另一種是「我為了找到入口而使用地圖。」。目的子句的執行者與主句不同時，用 pour que 加主詞和虛擬式；同一人執行則通常用 pour 加原形。"},{"id":"complete-form","type":"fill","prompt":"我留下鑰匙，好讓她能進工作室。\\n請從「a／ait」選出合適寫法，只填空格。\\nJe laisse la clé pour qu\'elle ___ accès au studio.","answers":["ait"],"explanation":"目的子句的執行者與主句不同時，用 pour que 加主詞和虛擬式；同一人執行則通常用 pour 加原形。 完整寫法是「Je laisse la clé pour qu\'elle ait accès au studio.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nJe répète pour que tu ___ où aller.","options":["sais","saches"],"answers":["saches"],"explanation":"目的子句的執行者與主句不同時，用 pour que 加主詞和虛擬式；同一人執行則通常用 pour 加原形。 完整寫法是「Je répète pour que tu saches où aller.」。"},{"id":"transfer","type":"choice","prompt":"把案號寄給承辦人是為了讓對方追蹤進度。","options":["Je vous envoie le numéro pour que vous puissiez suivre le dossier.","Je vous envoie le numéro pour pouvoir moi-même suivre le dossier."],"answers":["Je vous envoie le numéro pour que vous puissiez suivre le dossier."],"explanation":"目的子句的執行者與主句不同時，用 pour que 加主詞和虛擬式；同一人執行則通常用 pour 加原形。 此處要表達的意思對應「Je vous envoie le numéro pour que vous puissiez suivre le dossier.」。"}]},{"language":"fr","id":"bien-que","title":"bien que 與讓步虛擬式","explanation":["CEFR B2 ｜ 使用頻率：高","bien que 加虛擬式，即使承認的是一項事實也如此。même si 表相近的讓步但一般接直陳式。","比較「Bien que le studio soit petit, le son porte bien.」（工作室雖小，聲音卻傳得很清楚。）和「Comme le studio est petit, le son porte bien.」（因為工作室小，聲音傳得很清楚。）。","常見誤用：Bien qu\'il fait froid, nous attendons dehors.　修正：Bien qu\'il fasse froid, nous attendons dehors."],"examples":[{"text":"Bien que le studio soit petit, le son porte bien.","zh":"工作室雖小，聲音卻傳得很清楚。"},{"text":"Comme le studio est petit, le son porte bien.","zh":"因為工作室小，聲音傳得很清楚。"},{"text":"Bien qu\'il fasse froid, nous attendons dehors.","zh":"天氣雖冷，我們仍在外面等。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「工作室雖小，聲音卻傳得很清楚。」？","options":["Comme le studio est petit, le son porte bien.","Bien que le studio soit petit, le son porte bien."],"answers":["Bien que le studio soit petit, le son porte bien."],"explanation":"第一種意思是「工作室雖小，聲音卻傳得很清楚。」，另一種是「因為工作室小，聲音傳得很清楚。」。bien que 加虛擬式，即使承認的是一項事實也如此。même si 表相近的讓步但一般接直陳式。"},{"id":"complete-form","type":"fill","prompt":"天氣雖冷，我們仍在外面等。\\n請從「fait／fasse」選出合適寫法，只填空格。\\nBien qu\'il ___ froid, nous attendons dehors.","answers":["fasse"],"explanation":"bien que 加虛擬式，即使承認的是一項事實也如此。même si 表相近的讓步但一般接直陳式。 完整寫法是「Bien qu\'il fasse froid, nous attendons dehors.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nMême si le train ___ bondé, je le prends.","options":["soit","est"],"answers":["est"],"explanation":"bien que 加虛擬式，即使承認的是一項事實也如此。même si 表相近的讓步但一般接直陳式。 完整寫法是「Même si le train est bondé, je le prends.」。"},{"id":"transfer","type":"choice","prompt":"你承認樣本小，但仍認為結果值得研究。","options":["Comme l\'échantillon est petit, il faut écarter le résultat.","Bien que l\'échantillon soit petit, le résultat mérite notre attention."],"answers":["Bien que l\'échantillon soit petit, le résultat mérite notre attention."],"explanation":"bien que 加虛擬式，即使承認的是一項事實也如此。même si 表相近的讓步但一般接直陳式。 此處要表達的意思對應「Bien que l\'échantillon soit petit, le résultat mérite notre attention.」。"}]},{"language":"fr","id":"avant-que","title":"avant que 與尚未跨過的時間界線","explanation":["CEFR B2 ｜ 使用頻率：高","主句在某事件發生前就要完成，用 avant que 加虛擬式。若主詞相同，avant de 加原形較簡潔。","比較「Récupérez votre passeport avant que le bureau ferme.」（請在辦公室關門前領走護照。）和「Récupérez votre passeport après la fermeture du bureau.」（請在辦公室關門後領走護照。）。","常見誤用：Réponds avant qu\'il est trop tard.　修正：Réponds avant qu\'il soit trop tard."],"examples":[{"text":"Récupérez votre passeport avant que le bureau ferme.","zh":"請在辦公室關門前領走護照。"},{"text":"Récupérez votre passeport après la fermeture du bureau.","zh":"請在辦公室關門後領走護照。"},{"text":"Réponds avant qu\'il soit trop tard.","zh":"趁還來得及快回覆。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「請在辦公室關門前領走護照。」？","options":["Récupérez votre passeport après la fermeture du bureau.","Récupérez votre passeport avant que le bureau ferme."],"answers":["Récupérez votre passeport avant que le bureau ferme."],"explanation":"第一種意思是「請在辦公室關門前領走護照。」，另一種是「請在辦公室關門後領走護照。」。主句在某事件發生前就要完成，用 avant que 加虛擬式。若主詞相同，avant de 加原形較簡潔。"},{"id":"complete-form","type":"fill","prompt":"趁還來得及快回覆。\\n請從「est／soit」選出合適寫法，只填空格。\\nRéponds avant qu\'il ___ trop tard.","answers":["soit"],"explanation":"主句在某事件發生前就要完成，用 avant que 加虛擬式。若主詞相同，avant de 加原形較簡潔。 完整寫法是「Réponds avant qu\'il soit trop tard.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nJe vérifie l\'adresse avant de ___.","options":["partir","parti"],"answers":["partir"],"explanation":"主句在某事件發生前就要完成，用 avant que 加虛擬式。若主詞相同，avant de 加原形較簡潔。 完整寫法是「Je vérifie l\'adresse avant de partir.」。"},{"id":"transfer","type":"choice","prompt":"你要在辦公室關門前取回護照。","options":["Je dois récupérer mon passeport après la fermeture.","Je dois récupérer mon passeport avant que le bureau ferme."],"answers":["Je dois récupérer mon passeport avant que le bureau ferme."],"explanation":"主句在某事件發生前就要完成，用 avant que 加虛擬式。若主詞相同，avant de 加原形較簡潔。 此處要表達的意思對應「Je dois récupérer mon passeport avant que le bureau ferme.」。"}]},{"language":"fr","id":"douter","title":"douter 與 se douter 的立場差異","explanation":["CEFR B2 ｜ 使用頻率：高","douter que 加虛擬式是對事情存疑。se douter que 通常接直陳式，意思反而接近「猜想的確如此」。","比較「Je doute que le prix soit définitif.」（我懷疑價格是否已敲定。）和「Je me doute que le prix est définitif.」（我猜想價格的確已敲定。）。","常見誤用：Elle doute que nous avons assez de réponses.　修正：Elle doute que nous ayons assez de réponses."],"examples":[{"text":"Je doute que le prix soit définitif.","zh":"我懷疑價格是否已敲定。"},{"text":"Je me doute que le prix est définitif.","zh":"我猜想價格的確已敲定。"},{"text":"Elle doute que nous ayons assez de réponses.","zh":"她懷疑我們是否收到足夠回覆。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我懷疑價格是否已敲定。」？","options":["Je me doute que le prix est définitif.","Je doute que le prix soit définitif."],"answers":["Je doute que le prix soit définitif."],"explanation":"第一種意思是「我懷疑價格是否已敲定。」，另一種是「我猜想價格的確已敲定。」。douter que 加虛擬式是對事情存疑。se douter que 通常接直陳式，意思反而接近「猜想的確如此」。"},{"id":"complete-form","type":"fill","prompt":"她懷疑我們是否收到足夠回覆。\\n請從「ayons／avons」選出合適寫法，只填空格。\\nElle doute que nous ___ assez de réponses.","answers":["ayons"],"explanation":"douter que 加虛擬式是對事情存疑。se douter que 通常接直陳式，意思反而接近「猜想的確如此」。 完整寫法是「Elle doute que nous ayons assez de réponses.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nJe suis sûr que le prix ___ définitif.","options":["soit","est"],"answers":["est"],"explanation":"douter que 加虛擬式是對事情存疑。se douter que 通常接直陳式，意思反而接近「猜想的確如此」。 完整寫法是「Je suis sûr que le prix est définitif.」。"},{"id":"transfer","type":"choice","prompt":"小組的市場估算跟實地觀察對不上，你想委婉地表明存疑。","options":["Je me doute que ce chiffre reflète la réalité du terrain.","Je doute que ce chiffre reflète la réalité du terrain."],"answers":["Je doute que ce chiffre reflète la réalité du terrain."],"explanation":"douter que 加虛擬式是對事情存疑。se douter que 通常接直陳式，意思反而接近「猜想的確如此」。 此處要表達的意思對應「Je doute que ce chiffre reflète la réalité du terrain.」。"}]},{"language":"fr","id":"conditional-regret","title":"條件式過去與事後檢討","explanation":["CEFR B2 ｜ 使用頻率：高","用 devoir 的過去條件式加原形，回想本來該採取的措施。複合過去式則回報確實執行的事。","比較「Nous aurions dû prévoir du temps pour l\'interprétation.」（我們當時應該預留口譯時間。）和「Nous avons prévu du temps pour l\'interprétation.」（我們確實預留了口譯時間。）。","常見誤用：J\'aurais dois garder le reçu.　修正：J\'aurais dû garder le reçu."],"examples":[{"text":"Nous aurions dû prévoir du temps pour l\'interprétation.","zh":"我們當時應該預留口譯時間。"},{"text":"Nous avons prévu du temps pour l\'interprétation.","zh":"我們確實預留了口譯時間。"},{"text":"J\'aurais dû garder le reçu.","zh":"我當時應該保留收據。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我們當時應該預留口譯時間。」？","options":["Nous avons prévu du temps pour l\'interprétation.","Nous aurions dû prévoir du temps pour l\'interprétation."],"answers":["Nous aurions dû prévoir du temps pour l\'interprétation."],"explanation":"第一種意思是「我們當時應該預留口譯時間。」，另一種是「我們確實預留了口譯時間。」。用 devoir 的過去條件式加原形，回想本來該採取的措施。複合過去式則回報確實執行的事。"},{"id":"complete-form","type":"fill","prompt":"我當時應該保留收據。\\n請從「dois／dû」選出合適寫法，只填空格。\\nJ\'aurais ___ garder le reçu.","answers":["dû"],"explanation":"用 devoir 的過去條件式加原形，回想本來該採取的措施。複合過去式則回報確實執行的事。 完整寫法是「J\'aurais dû garder le reçu.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nElle aurait dû ___ l\'horaire.","options":["vérifier","vérifié"],"answers":["vérifier"],"explanation":"用 devoir 的過去條件式加原形，回想本來該採取的措施。複合過去式則回報確實執行的事。 完整寫法是「Elle aurait dû vérifier l\'horaire.」。"},{"id":"transfer","type":"choice","prompt":"面試回顧志工活動。你想承認「我當時應該先問當地老師」。","options":["J\'aurais dû consulter les enseignants sur place.","J\'ai consulté les enseignants sur place."],"answers":["J\'aurais dû consulter les enseignants sur place."],"explanation":"用 devoir 的過去條件式加原形，回想本來該採取的措施。複合過去式則回報確實執行的事。 此處要表達的意思對應「J\'aurais dû consulter les enseignants sur place.」。"}]},{"language":"fr","id":"double-pronouns","title":"動詞前的雙受詞代名詞","explanation":["CEFR B2 ｜ 使用頻率：高","一般句的 le、la、les 放在 lui、leur 前；me、te、nous、vous 則放在 le、la、les 前。判斷時先辨認物品和接收者。","比較「Je les leur donnerai demain.」（我明天會把那些東西交給他們。）和「Ils me les donneront demain.」（他們明天會把那些東西交給我。）。","常見誤用：La clé ? Je lui la donne ce soir.　修正：La clé ? Je la lui donne ce soir."],"examples":[{"text":"Je les leur donnerai demain.","zh":"我明天會把那些東西交給他們。"},{"text":"Ils me les donneront demain.","zh":"他們明天會把那些東西交給我。"},{"text":"La clé ? Je la lui donne ce soir.","zh":"鑰匙嗎？我今晚交給他。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我明天會把那些東西交給他們。」？","options":["Je les leur donnerai demain.","Ils me les donneront demain."],"answers":["Je les leur donnerai demain."],"explanation":"第一種意思是「我明天會把那些東西交給他們。」，另一種是「他們明天會把那些東西交給我。」。一般句的 le、la、les 放在 lui、leur 前；me、te、nous、vous 則放在 le、la、les 前。判斷時先辨認物品和接收者。"},{"id":"complete-form","type":"fill","prompt":"鑰匙嗎？我今晚交給他。\\n請從「la lui／lui la」選出合適寫法，只填空格。\\nLa clé ? Je ___ donne ce soir.","answers":["la lui"],"explanation":"一般句的 le、la、les 放在 lui、leur 前；me、te、nous、vous 則放在 le、la、les 前。判斷時先辨認物品和接收者。 完整寫法是「La clé ? Je la lui donne ce soir.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLe plan ? Elle ___ rend vendredi.","options":["me le","le me"],"answers":["me le"],"explanation":"一般句的 le、la、les 放在 lui、leur 前；me、te、nous、vous 則放在 le、la、les 前。判斷時先辨認物品和接收者。 完整寫法是「Le plan ? Elle me le rend vendredi.」。"},{"id":"transfer","type":"choice","prompt":"同學問幾張票的下落。你要說「我已經把票給他們了」。","options":["Ils me les ont déjà donnés.","Je les leur ai déjà donnés."],"answers":["Je les leur ai déjà donnés."],"explanation":"一般句的 le、la、les 放在 lui、leur 前；me、te、nous、vous 則放在 le、la、les 前。判斷時先辨認物品和接收者。 此處要表達的意思對應「Je les leur ai déjà donnés.」。"}]},{"language":"fr","id":"imperative-pronouns","title":"肯定與否定命令句的代名詞順序","explanation":["CEFR B2 ｜ 使用頻率：高","肯定命令用連字號把代名詞接在動詞後，否定命令則把代名詞移回動詞前。留意 moi 改成 me。","比較「Rends-le-moi demain.」（明天把它還給我。）和「Ne me le rends pas demain.」（明天別把它還給我。）。","常見誤用：Ce document est privé : ne lui le montre pas.　修正：Ce document est privé : ne le lui montre pas."],"examples":[{"text":"Rends-le-moi demain.","zh":"明天把它還給我。"},{"text":"Ne me le rends pas demain.","zh":"明天別把它還給我。"},{"text":"Ce document est privé : ne le lui montre pas.","zh":"這是私人文件，別給他看。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「明天把它還給我。」？","options":["Ne me le rends pas demain.","Rends-le-moi demain."],"answers":["Rends-le-moi demain."],"explanation":"第一種意思是「明天把它還給我。」，另一種是「明天別把它還給我。」。肯定命令用連字號把代名詞接在動詞後，否定命令則把代名詞移回動詞前。留意 moi 改成 me。"},{"id":"complete-form","type":"fill","prompt":"這是私人文件，別給他看。\\n請從「le lui／lui le」選出合適寫法，只填空格。\\nCe document est privé : ne ___ montre pas.","answers":["le lui"],"explanation":"肯定命令用連字號把代名詞接在動詞後，否定命令則把代名詞移回動詞前。留意 moi 改成 me。 完整寫法是「Ce document est privé : ne le lui montre pas.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nCe badge est à moi. ___ !","options":["Rends-le-moi","Rends-moi-le"],"answers":["Rends-le-moi"],"explanation":"肯定命令用連字號把代名詞接在動詞後，否定命令則把代名詞移回動詞前。留意 moi 改成 me。 完整寫法是「Ce badge est à moi. Rends-le-moi !」。"},{"id":"transfer","type":"choice","prompt":"文件有個資，請寄件者別再傳給你。","options":["Ne me le renvoie pas.","Ne le lui renvoie pas."],"answers":["Ne me le renvoie pas."],"explanation":"肯定命令用連字號把代名詞接在動詞後，否定命令則把代名詞移回動詞前。留意 moi 改成 me。 此處要表達的意思對應「Ne me le renvoie pas.」。"}]},{"language":"fr","id":"dont","title":"dont 與需要 de 的補語","explanation":["CEFR B2 ｜ 使用頻率：高","先行詞充當帶 de 的補語時用 dont，後面不再加 de 或 en。直接受詞則用 que。","比較「Voici le dossier dont j\'ai besoin.」（這是我需要的資料。）和「Voici le dossier que je consulte.」（這是我正在查閱的資料。）。","常見誤用：Le sujet que nous parlions concerne les bourses.　修正：Le sujet dont nous parlions concerne les bourses."],"examples":[{"text":"Voici le dossier dont j\'ai besoin.","zh":"這是我需要的資料。"},{"text":"Voici le dossier que je consulte.","zh":"這是我正在查閱的資料。"},{"text":"Le sujet dont nous parlions concerne les bourses.","zh":"我們剛談的議題與獎學金有關。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「這是我需要的資料。」？","options":["Voici le dossier que je consulte.","Voici le dossier dont j\'ai besoin."],"answers":["Voici le dossier dont j\'ai besoin."],"explanation":"第一種意思是「這是我需要的資料。」，另一種是「這是我正在查閱的資料。」。先行詞充當帶 de 的補語時用 dont，後面不再加 de 或 en。直接受詞則用 que。"},{"id":"complete-form","type":"fill","prompt":"我們剛談的議題與獎學金有關。\\n請從「dont／que」選出合適寫法，只填空格。\\nLe sujet ___ nous parlions concerne les bourses.","answers":["dont"],"explanation":"先行詞充當帶 de 的補語時用 dont，後面不再加 de 或 en。直接受詞則用 que。 完整寫法是「Le sujet dont nous parlions concerne les bourses.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLa décision ___ elle se souvient date de mai.","options":["que","dont"],"answers":["dont"],"explanation":"先行詞充當帶 de 的補語時用 dont，後面不再加 de 或 en。直接受詞則用 que。 完整寫法是「La décision dont elle se souvient date de mai.」。"},{"id":"transfer","type":"choice","prompt":"用 parler de 介紹上次面試談過的專案。","options":["Voici le projet que j\'ai parlé.","Voici le projet dont j\'ai parlé."],"answers":["Voici le projet dont j\'ai parlé."],"explanation":"先行詞充當帶 de 的補語時用 dont，後面不再加 de 或 en。直接受詞則用 que。 此處要表達的意思對應「Voici le projet dont j\'ai parlé.」。"}]},{"language":"fr","id":"ce-qui","title":"ce qui 與未指明的主詞","explanation":["CEFR B2 ｜ 使用頻率：高","未指明的事物在關係子句內作主詞，用 ce qui。若其後另有主詞而缺直接受詞則用 ce que。","比較「Dis-moi ce qui te surprend.」（告訴我什麼讓你意外。）和「Dis-moi ce que tu as modifié.」（告訴我你修改了什麼。）。","常見誤用：Ce que compte, c\'est la date de réception.　修正：Ce qui compte, c\'est la date de réception."],"examples":[{"text":"Dis-moi ce qui te surprend.","zh":"告訴我什麼讓你意外。"},{"text":"Dis-moi ce que tu as modifié.","zh":"告訴我你修改了什麼。"},{"text":"Ce qui compte, c\'est la date de réception.","zh":"重要的是收件日期。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「告訴我什麼讓你意外。」？","options":["Dis-moi ce qui te surprend.","Dis-moi ce que tu as modifié."],"answers":["Dis-moi ce qui te surprend."],"explanation":"第一種意思是「告訴我什麼讓你意外。」，另一種是「告訴我你修改了什麼。」。未指明的事物在關係子句內作主詞，用 ce qui。若其後另有主詞而缺直接受詞則用 ce que。"},{"id":"complete-form","type":"fill","prompt":"重要的是收件日期。\\n請從「Ce qui／Ce que」選出合適寫法，只填空格。\\n___ compte, c\'est la date de réception.","answers":["Ce qui"],"explanation":"未指明的事物在關係子句內作主詞，用 ce qui。若其後另有主詞而缺直接受詞則用 ce que。 完整寫法是「Ce qui compte, c\'est la date de réception.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nExplique ___ bloque l\'inscription.","options":["ce qui","ce que"],"answers":["ce qui"],"explanation":"未指明的事物在關係子句內作主詞，用 ce qui。若其後另有主詞而缺直接受詞則用 ce que。 完整寫法是「Explique ce qui bloque l\'inscription.」。"},{"id":"transfer","type":"choice","prompt":"你請同學指出圖表裡是哪一點讓他意外。","options":["Explique-moi ce que tu as changé dans le graphique.","Explique-moi ce qui te surprend dans le graphique."],"answers":["Explique-moi ce qui te surprend dans le graphique."],"explanation":"未指明的事物在關係子句內作主詞，用 ce qui。若其後另有主詞而缺直接受詞則用 ce que。 此處要表達的意思對應「Explique-moi ce qui te surprend dans le graphique.」。"}]},{"language":"fr","id":"ce-dont","title":"ce dont 與未指明的間接補語","explanation":["CEFR B2 ｜ 使用頻率：高","沒有明確先行詞，而動詞或形容詞需要 de 時用 ce dont。ce que 則用於直接受詞。","比較「Voilà ce dont je suis fier.」（這就是我引以為傲的事。）和「Voilà ce que je regrette.」（這就是我感到後悔的事。）。","常見誤用：Expliquez ce que vous avez peur.　修正：Expliquez ce dont vous avez peur."],"examples":[{"text":"Voilà ce dont je suis fier.","zh":"這就是我引以為傲的事。"},{"text":"Voilà ce que je regrette.","zh":"這就是我感到後悔的事。"},{"text":"Expliquez ce dont vous avez peur.","zh":"請說明您害怕的是什麼。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「這就是我引以為傲的事。」？","options":["Voilà ce que je regrette.","Voilà ce dont je suis fier."],"answers":["Voilà ce dont je suis fier."],"explanation":"第一種意思是「這就是我引以為傲的事。」，另一種是「這就是我感到後悔的事。」。沒有明確先行詞，而動詞或形容詞需要 de 時用 ce dont。ce que 則用於直接受詞。"},{"id":"complete-form","type":"fill","prompt":"請說明您害怕的是什麼。\\n請從「ce que／ce dont」選出合適寫法，只填空格。\\nExpliquez ___ vous avez peur.","answers":["ce dont"],"explanation":"沒有明確先行詞，而動詞或形容詞需要 de 時用 ce dont。ce que 則用於直接受詞。 完整寫法是「Expliquez ce dont vous avez peur.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nJ\'ai noté ___ elle se plaint.","options":["ce que","ce dont"],"answers":["ce dont"],"explanation":"沒有明確先行詞，而動詞或形容詞需要 de 時用 ce dont。ce que 則用於直接受詞。 完整寫法是「J\'ai noté ce dont elle se plaint.」。"},{"id":"transfer","type":"choice","prompt":"使用 avoir besoin de 聚焦你需要的證明。","options":["Ce que j\'ai besoin, c\'est d\'un justificatif.","Ce dont j\'ai besoin, c\'est d\'un justificatif."],"answers":["Ce dont j\'ai besoin, c\'est d\'un justificatif."],"explanation":"沒有明確先行詞，而動詞或形容詞需要 de 時用 ce dont。ce que 則用於直接受詞。 此處要表達的意思對應「Ce dont j\'ai besoin, c\'est d\'un justificatif.」。"}]},{"language":"fr","id":"accord-avoir","title":"avoir 過去分詞與前置直接受詞","explanation":["CEFR B2 ｜ 使用頻率：高","avoir 的過去分詞和放在前面的直接受詞配合；前置間接受詞不觸發配合。先確認動詞能否直接接人或物。","比較「Les lettres que j\'ai écrites sont ici.」（我寫的那些信在這裡。）和「Les clientes à qui j\'ai écrit sont ici.」（我寫過信給她們的那些客戶在這裡。）。","常見誤用：Ces affiches, nous les avons imprimé hier.　修正：Ces affiches, nous les avons imprimées hier."],"examples":[{"text":"Les lettres que j\'ai écrites sont ici.","zh":"我寫的那些信在這裡。"},{"text":"Les clientes à qui j\'ai écrit sont ici.","zh":"我寫過信給她們的那些客戶在這裡。"},{"text":"Ces affiches, nous les avons imprimées hier.","zh":"這些海報我們昨天就印好了。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我寫的那些信在這裡。」？","options":["Les lettres que j\'ai écrites sont ici.","Les clientes à qui j\'ai écrit sont ici."],"answers":["Les lettres que j\'ai écrites sont ici."],"explanation":"第一種意思是「我寫的那些信在這裡。」，另一種是「我寫過信給她們的那些客戶在這裡。」。avoir 的過去分詞和放在前面的直接受詞配合；前置間接受詞不觸發配合。先確認動詞能否直接接人或物。"},{"id":"complete-form","type":"fill","prompt":"這些海報我們昨天就印好了。\\n請從「imprimé／imprimées」選出合適寫法，只填空格。\\nCes affiches, nous les avons ___ hier.","answers":["imprimées"],"explanation":"avoir 的過去分詞和放在前面的直接受詞配合；前置間接受詞不觸發配合。先確認動詞能否直接接人或物。 完整寫法是「Ces affiches, nous les avons imprimées hier.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLa photo qu\'elle a ___ est floue.","options":["prise","pris"],"answers":["prise"],"explanation":"avoir 的過去分詞和放在前面的直接受詞配合；前置間接受詞不觸發配合。先確認動詞能否直接接人或物。 完整寫法是「La photo qu\'elle a prise est floue.」。"},{"id":"transfer","type":"choice","prompt":"你曾致函兩位女顧問。間接受詞 à qui 已前置，哪句配合正確？","options":["Les consultantes à qui j\'ai écrites m\'ont répondu.","Les consultantes à qui j\'ai écrit m\'ont répondu."],"answers":["Les consultantes à qui j\'ai écrit m\'ont répondu."],"explanation":"avoir 的過去分詞和放在前面的直接受詞配合；前置間接受詞不觸發配合。先確認動詞能否直接接人或物。 此處要表達的意思對應「Les consultantes à qui j\'ai écrit m\'ont répondu.」。"}]},{"language":"fr","id":"passif","title":"被動式與執行者 par","explanation":["CEFR B2 ｜ 使用頻率：高","用 être 加過去分詞，把承受動作的人或物放句首。若指出執行者，常用 par 加名詞。","比較「Les écoles ont été choisies par les bénévoles.」（學校是由志工挑選的。）和「Les bénévoles ont été choisis par les écoles.」（志工是由學校挑選的。）。","常見誤用：Les demandes sont examinés par le jury.　修正：Les demandes sont examinées par le jury."],"examples":[{"text":"Les écoles ont été choisies par les bénévoles.","zh":"學校是由志工挑選的。"},{"text":"Les bénévoles ont été choisis par les écoles.","zh":"志工是由學校挑選的。"},{"text":"Les demandes sont examinées par le jury.","zh":"申請由評審團審查。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「學校是由志工挑選的。」？","options":["Les bénévoles ont été choisis par les écoles.","Les écoles ont été choisies par les bénévoles."],"answers":["Les écoles ont été choisies par les bénévoles."],"explanation":"第一種意思是「學校是由志工挑選的。」，另一種是「志工是由學校挑選的。」。用 être 加過去分詞，把承受動作的人或物放句首。若指出執行者，常用 par 加名詞。"},{"id":"complete-form","type":"fill","prompt":"申請由評審團審查。\\n請從「examinés／examinées」選出合適寫法，只填空格。\\nLes demandes sont ___ par le jury.","answers":["examinées"],"explanation":"用 être 加過去分詞，把承受動作的人或物放句首。若指出執行者，常用 par 加名詞。 完整寫法是「Les demandes sont examinées par le jury.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLa salle sera ___ à dix heures.","options":["fermée","fermé"],"answers":["fermée"],"explanation":"用 être 加過去分詞，把承受動作的人或物放句首。若指出執行者，常用 par 加名詞。 完整寫法是「La salle sera fermée à dix heures.」。"},{"id":"transfer","type":"choice","prompt":"動作者是志工，被選中的是學校。句首以學校為主詞。","options":["Les bénévoles ont été sélectionnés par les écoles.","Les écoles ont été sélectionnées par les bénévoles."],"answers":["Les écoles ont été sélectionnées par les bénévoles."],"explanation":"用 être 加過去分詞，把承受動作的人或物放句首。若指出執行者，常用 par 加名詞。 此處要表達的意思對應「Les écoles ont été sélectionnées par les bénévoles.」。"}]},{"language":"fr","id":"causatif","title":"faire 加原形與委託服務","explanation":["CEFR B2 ｜ 使用頻率：高","faire 變位後接原形，可以表示使別人做或安排服務。一般主動句直接把執行者當主詞。","比較「J\'ai fait imprimer le dossier.」（我請人印了資料。）和「J\'ai imprimé le dossier moi-même.」（我親自印了資料。）。","常見誤用：Je fais réparé mon vélo.　修正：Je fais réparer mon vélo."],"examples":[{"text":"J\'ai fait imprimer le dossier.","zh":"我請人印了資料。"},{"text":"J\'ai imprimé le dossier moi-même.","zh":"我親自印了資料。"},{"text":"Je fais réparer mon vélo.","zh":"我請人修腳踏車。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我請人印了資料。」？","options":["J\'ai fait imprimer le dossier.","J\'ai imprimé le dossier moi-même."],"answers":["J\'ai fait imprimer le dossier."],"explanation":"第一種意思是「我請人印了資料。」，另一種是「我親自印了資料。」。faire 變位後接原形，可以表示使別人做或安排服務。一般主動句直接把執行者當主詞。"},{"id":"complete-form","type":"fill","prompt":"我請人修腳踏車。\\n請從「réparé／réparer」選出合適寫法，只填空格。\\nJe fais ___ mon vélo.","answers":["réparer"],"explanation":"faire 變位後接原形，可以表示使別人做或安排服務。一般主動句直接把執行者當主詞。 完整寫法是「Je fais réparer mon vélo.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nElle fera ___ le piano.","options":["vérifier","vérifié"],"answers":["vérifier"],"explanation":"faire 變位後接原形，可以表示使別人做或安排服務。一般主動句直接把執行者當主詞。 完整寫法是「Elle fera vérifier le piano.」。"},{"id":"transfer","type":"choice","prompt":"你把腳踏車送修，親手修理的人是店員。","options":["J\'ai réparé mon vélo moi-même.","J\'ai fait réparer mon vélo."],"answers":["J\'ai fait réparer mon vélo."],"explanation":"faire 變位後接原形，可以表示使別人做或安排服務。一般主動句直接把執行者當主詞。 此處要表達的意思對應「J\'ai fait réparer mon vélo.」。"}]},{"language":"fr","id":"dans-temps","title":"dans 與未來等待時間","explanation":["CEFR B1 ｜ 使用頻率：高","dans 加時長指定從現在算起多久後發生。pendant 加時長說明到時活動會持續多久。","比較「Le bureau rouvrira dans une heure.」（辦公室一小時後重新開放。）和「Le bureau rouvrira pendant une heure.」（辦公室將重新開放一小時。）。","常見誤用：Il est onze heures : le bus part pendant dix minutes, à onze heures dix.　修正：Il est onze heures : le bus part dans dix minutes, à onze heures dix."],"examples":[{"text":"Le bureau rouvrira dans une heure.","zh":"辦公室一小時後重新開放。"},{"text":"Le bureau rouvrira pendant une heure.","zh":"辦公室將重新開放一小時。"},{"text":"Il est onze heures : le bus part dans dix minutes, à onze heures dix.","zh":"現在十一點，公車十分鐘後開。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「辦公室一小時後重新開放。」？","options":["Le bureau rouvrira pendant une heure.","Le bureau rouvrira dans une heure."],"answers":["Le bureau rouvrira dans une heure."],"explanation":"第一種意思是「辦公室一小時後重新開放。」，另一種是「辦公室將重新開放一小時。」。dans 加時長指定從現在算起多久後發生。pendant 加時長說明到時活動會持續多久。"},{"id":"complete-form","type":"fill","prompt":"現在十一點，公車十分鐘後開。\\n請從「dans／pendant」選出合適寫法，只填空格。\\nIl est onze heures : le bus part ___ dix minutes, à onze heures dix.","answers":["dans"],"explanation":"dans 加時長指定從現在算起多久後發生。pendant 加時長說明到時活動會持續多久。 完整寫法是「Il est onze heures : le bus part dans dix minutes, à onze heures dix.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nLe cours commence ___ une heure, à midi.","options":["depuis","dans"],"answers":["dans"],"explanation":"dans 加時長指定從現在算起多久後發生。pendant 加時長說明到時活動會持續多久。 完整寫法是「Le cours commence dans une heure, à midi.」。"},{"id":"transfer","type":"choice","prompt":"現在十點，師傅說「J\'arrive dans vingt minutes」。","options":["Il promet de finir les travaux en vingt minutes.","Il prévoit d\'arriver à dix heures vingt."],"answers":["Il prévoit d\'arriver à dix heures vingt."],"explanation":"dans 加時長指定從現在算起多久後發生。pendant 加時長說明到時活動會持續多久。 此處要表達的意思對應「Il prévoit d\'arriver à dix heures vingt.」。"}]},{"language":"fr","id":"faute-de","title":"faute de 與必要條件不足","explanation":["CEFR B2 ｜ 使用頻率：中","faute de 加名詞或原形指出欠缺某項條件，因而導致主句結果。à la demande de 則指出是誰要求的。","比較「L\'atelier a été annulé faute de chauffeur.」（工作坊因缺司機而取消。）和「L\'atelier a été annulé à la demande du chauffeur.」（工作坊應司機要求而取消。）。","常見誤用：Faute à justificatif, le dossier a été classé.　修正：Faute de justificatif, le dossier a été classé."],"examples":[{"text":"L\'atelier a été annulé faute de chauffeur.","zh":"工作坊因缺司機而取消。"},{"text":"L\'atelier a été annulé à la demande du chauffeur.","zh":"工作坊應司機要求而取消。"},{"text":"Faute de justificatif, le dossier a été classé.","zh":"由於缺少證明，案件已結案。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「工作坊因缺司機而取消。」？","options":["L\'atelier a été annulé faute de chauffeur.","L\'atelier a été annulé à la demande du chauffeur."],"answers":["L\'atelier a été annulé faute de chauffeur."],"explanation":"第一種意思是「工作坊因缺司機而取消。」，另一種是「工作坊應司機要求而取消。」。faute de 加名詞或原形指出欠缺某項條件，因而導致主句結果。à la demande de 則指出是誰要求的。"},{"id":"complete-form","type":"fill","prompt":"由於缺少證明，案件已結案。\\n請從「de／à」選出合適寫法，只填空格。\\nFaute ___ justificatif, le dossier a été classé.","answers":["de"],"explanation":"faute de 加名詞或原形指出欠缺某項條件，因而導致主句結果。à la demande de 則指出是誰要求的。 完整寫法是「Faute de justificatif, le dossier a été classé.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nFaute de ___ joindre l\'accueil, j\'ai laissé un message.","options":["pu","pouvoir"],"answers":["pouvoir"],"explanation":"faute de 加名詞或原形指出欠缺某項條件，因而導致主句結果。à la demande de 則指出是誰要求的。 完整寫法是「Faute de pouvoir joindre l\'accueil, j\'ai laissé un message.」。"},{"id":"transfer","type":"choice","prompt":"主管問工作坊為何延期。你想說沒有空教室。","options":["Faute de salle libre, nous avons reporté l\'atelier.","Nous avons reporté l\'atelier à la demande des participants."],"answers":["Faute de salle libre, nous avons reporté l\'atelier."],"explanation":"faute de 加名詞或原形指出欠缺某項條件，因而導致主句結果。à la demande de 則指出是誰要求的。 此處要表達的意思對應「Faute de salle libre, nous avons reporté l\'atelier.」。"}]},{"language":"fr","id":"quitte-a","title":"quitte à 與願意承擔的代價","explanation":["CEFR B2 ｜ 使用頻率：中","quitte à 加原形，主動接受可能代價以完成主要行動。à condition de 表示要先滿足條件才肯做。","比較「Je veux finir l\'entretien, quitte à rater le bus.」（我想做完訪談，就算錯過公車也沒關係。）和「Je veux finir l\'entretien à condition de ne pas rater le bus.」（只要不錯過公車，我就想做完訪談。）。","常見誤用：Je préfère vérifier, quitte de perdre dix minutes.　修正：Je préfère vérifier, quitte à perdre dix minutes."],"examples":[{"text":"Je veux finir l\'entretien, quitte à rater le bus.","zh":"我想做完訪談，就算錯過公車也沒關係。"},{"text":"Je veux finir l\'entretien à condition de ne pas rater le bus.","zh":"只要不錯過公車，我就想做完訪談。"},{"text":"Je préfère vérifier, quitte à perdre dix minutes.","zh":"我寧願核對，即使要多花十分鐘。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我想做完訪談，就算錯過公車也沒關係。」？","options":["Je veux finir l\'entretien, quitte à rater le bus.","Je veux finir l\'entretien à condition de ne pas rater le bus."],"answers":["Je veux finir l\'entretien, quitte à rater le bus."],"explanation":"第一種意思是「我想做完訪談，就算錯過公車也沒關係。」，另一種是「只要不錯過公車，我就想做完訪談。」。quitte à 加原形，主動接受可能代價以完成主要行動。à condition de 表示要先滿足條件才肯做。"},{"id":"complete-form","type":"fill","prompt":"我寧願核對，即使要多花十分鐘。\\n請從「à／de」選出合適寫法，只填空格。\\nJe préfère vérifier, quitte ___ perdre dix minutes.","answers":["à"],"explanation":"quitte à 加原形，主動接受可能代價以完成主要行動。à condition de 表示要先滿足條件才肯做。 完整寫法是「Je préfère vérifier, quitte à perdre dix minutes.」。"},{"id":"apply-form","type":"choice","prompt":"依句法和上下文完成這句話。\\nNous irons à pied, quitte à ___ en retard.","options":["arrivés","arriver"],"answers":["arriver"],"explanation":"quitte à 加原形，主動接受可能代價以完成主要行動。à condition de 表示要先滿足條件才肯做。 完整寫法是「Nous irons à pied, quitte à arriver en retard.」。"},{"id":"transfer","type":"choice","prompt":"你願意冒錯過末班車的風險來完成訪談。","options":["Je terminerai l\'entretien, quitte à rater le dernier bus.","Je terminerai l\'entretien à condition de ne pas rater le dernier bus."],"answers":["Je terminerai l\'entretien, quitte à rater le dernier bus."],"explanation":"quitte à 加原形，主動接受可能代價以完成主要行動。à condition de 表示要先滿足條件才肯做。 此處要表達的意思對應「Je terminerai l\'entretien, quitte à rater le dernier bus.」。"}]},{"language":"fr","id":"avoir-beau","title":"avoir beau 與徒勞的努力","explanation":["CEFR B2 ｜ 使用頻率：高","avoir beau 加原形，下一分句才交代即使試過仍無法改變的結果。beau 為固定形式。","比較「J\'ai beau laisser couler l\'eau, elle reste froide.」（我怎麼放水，水都還是冷的。）和「Il suffit de laisser couler l\'eau pour qu\'elle chauffe.」（只要讓水流一下就會變熱。）。","常見誤用：Elles ont belles appeler, personne ne répond.　修正：Elles ont beau appeler, personne ne répond."],"examples":[{"text":"J\'ai beau laisser couler l\'eau, elle reste froide.","zh":"我怎麼放水，水都還是冷的。"},{"text":"Il suffit de laisser couler l\'eau pour qu\'elle chauffe.","zh":"只要讓水流一下就會變熱。"},{"text":"Elles ont beau appeler, personne ne répond.","zh":"她們怎麼打電話，都沒人接。"}],"questions":[{"id":"interpret","type":"choice","prompt":"哪句準確表達「我怎麼放水，水都還是冷的。」？","options":["J\'ai beau laisser couler l\'eau, elle reste froide.","Il suffit de laisser couler l\'eau pour qu\'elle chauffe."],"answers":["J\'ai beau laisser couler l\'eau, elle reste froide."],"explanation":"第一種意思是「我怎麼放水，水都還是冷的。」，另一種是「只要讓水流一下就會變熱。」。avoir beau 加原形，下一分句才交代即使試過仍無法改變的結果。beau 為固定形式。"},{"id":"complete-form","type":"fill","prompt":"她們怎麼打電話，都沒人接。\\n請從「belles／beau」選出合適寫法，只填空格。\\nElles ont ___ appeler, per
